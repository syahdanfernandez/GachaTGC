const DOCS={gacha:"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"id\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eCardForge & Gacha Studio Pro\u003c/title\u003e\n    \u003c!-- Tailwind CSS --\u003e\n    \u003cscript src=\"https://cdn.tailwindcss.com/3.4.17\"\u003e\u003c/script\u003e\n    \u003c!-- Google Fonts --\u003e\n    \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n    \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700&display=swap\" rel=\"stylesheet\"\u003e\n    \u003c!-- Lucide Icons --\u003e\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js\"\u003e\u003c/script\u003e\n    \u003c!-- html2canvas untuk merender kartu ke PNG saat Bagikan / Simpan --\u003e\n    \u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js\"\u003e\u003c/script\u003e\n\n    \u003cstyle\u003e\n        body {\n            font-family: 'Inter', sans-serif;\n            background-color: #07090e;\n            background-image:\n                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.14) 0px, transparent 50%),\n                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.14) 0px, transparent 50%);\n            color: #f8fafc;\n            overflow-x: hidden;\n        }\n\n        .font-tech { font-family: 'Rajdhani', sans-serif; }\n        .font-orbitron { font-family: 'Orbitron', sans-serif; }\n\n        /* Custom Scrollbar */\n        ::-webkit-scrollbar { width: 6px; height: 6px; }\n        ::-webkit-scrollbar-track { background: #0f172a; }\n        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }\n        ::-webkit-scrollbar-thumb:hover { background: #64748b; }\n\n        /* 3D Tilt Wrapper */\n        .card-perspective { perspective: 1200px; }\n        .card-tilt {\n            transition: transform 0.15s ease-out, box-shadow 0.3s ease;\n            transform-style: preserve-3d;\n        }\n\n        /* Holographic Sheen Effect */\n        .holo-overlay {\n            background: linear-gradient(\n                115deg,\n                transparent 20%,\n                rgba(255, 255, 255, 0.15) 35%,\n                rgba(255, 255, 255, 0.35) 42%,\n                rgba(255, 255, 255, 0.05) 50%,\n                transparent 80%\n            );\n            mix-blend-mode: overlay;\n            pointer-events: none;\n            transition: opacity 0.3s ease;\n        }\n\n        /* Manga Legendary Prismatic Foil & Metallic Shimmer */\n        @keyframes mangaFoilShimmer {\n            0% { background-position: 0% 50%; }\n            50% { background-position: 100% 50%; }\n            100% { background-position: 0% 50%; }\n        }\n\n        .manga-foil-layer {\n            background:\n                repeating-linear-gradient(\n                    -45deg,\n                    rgba(255, 255, 255, 0.03) 0px,\n                    rgba(255, 255, 255, 0.03) 2px,\n                    rgba(255, 255, 255, 0.14) 2px,\n                    rgba(255, 255, 255, 0.14) 4px\n                ),\n                linear-gradient(\n                    125deg,\n                    rgba(255, 255, 255, 0.05) 0%,\n                    rgba(56, 189, 248, 0.28) 22%,\n                    rgba(253, 224, 71, 0.32) 38%,\n                    rgba(236, 72, 153, 0.28) 54%,\n                    rgba(168, 85, 247, 0.28) 70%,\n                    rgba(255, 255, 255, 0.15) 100%\n                );\n            background-size: 200% 200%;\n            animation: mangaFoilShimmer 6s ease infinite;\n            mix-blend-mode: color-dodge;\n        }\n\n        /* Pola Titik Screentone Komik Manga */\n        .manga-screentone {\n            background-image: radial-gradient(rgba(0, 0, 0, 0.42) 1.15px, transparent 1.15px);\n            background-size: 4px 4px;\n            mix-blend-mode: multiply;\n        }\n\n        /* Kartu Terkunci di Binder */\n        .card-locked {\n            filter: brightness(0.22) grayscale(1);\n            opacity: 0.72;\n        }\n\n        /* Binder Album 2-Halaman */\n        .binder-container {\n            background: linear-gradient(145deg, #181520, #0c0914);\n            border: 3px solid #2d2638;\n            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 25px rgba(0,0,0,0.7);\n            border-radius: 24px;\n            position: relative;\n            padding: 20px;\n        }\n        .binder-stitching {\n            position: absolute;\n            inset: 8px;\n            border: 2px dashed #423854;\n            border-radius: 18px;\n            pointer-events: none;\n        }\n        .binder-page {\n            background: #14111c;\n            border: 1px solid #282133;\n            border-radius: 14px;\n            padding: 16px;\n            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);\n        }\n\n        /* 3D Flip Card untuk Summon Stage */\n        .flip-card-3d { perspective: 1200px; }\n        .flip-card-inner {\n            position: relative;\n            width: 100%;\n            height: 100%;\n            transition: transform 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275);\n            transform-style: preserve-3d;\n        }\n        .flip-card-inner.is-flipped { transform: rotateY(180deg); }\n        .flip-card-front, .flip-card-back {\n            position: absolute;\n            width: 100%;\n            height: 100%;\n            -webkit-backface-visibility: hidden;\n            backface-visibility: hidden;\n            border-radius: 24px;\n        }\n        .flip-card-back {\n            transform: rotateY(180deg);\n        }\n\n        @keyframes portalPulse {\n            0% { transform: scale(0.85) rotate(0deg); opacity: 0.45; }\n            50% { transform: scale(1.1) rotate(180deg); opacity: 0.85; }\n            100% { transform: scale(0.85) rotate(360deg); opacity: 0.45; }\n        }\n        .portal-orb { animation: portalPulse 4s infinite linear; }\n\n        #bg-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody class=\"min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white relative\"\u003e\n\n    \u003ccanvas id=\"bg-canvas\"\u003e\u003c/canvas\u003e\n\n    \u003c!-- Toast Notification --\u003e\n    \u003cdiv id=\"toast\" class=\"fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none\"\u003e\n        \u003cdiv class=\"bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3\"\u003e\n            \u003cdiv class=\"w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center\"\u003e\n                \u003ci data-lucide=\"check\" class=\"w-4 h-4\"\u003e\u003c/i\u003e\n            \u003c/div\u003e\n            \u003cspan id=\"toastMessage\" class=\"text-sm font-medium\"\u003eAksi berhasil!\u003c/span\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- Header --\u003e\n    \u003cheader class=\"border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30\"\u003e\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-3\"\u003e\n            \u003cdiv class=\"flex items-center gap-3\"\u003e\n                \u003cdiv class=\"w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-purple-500 to-pink-500 p-[2px]\"\u003e\n                    \u003cdiv class=\"w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center\"\u003e\n                        \u003ci data-lucide=\"sparkles\" class=\"w-5 h-5 text-purple-400\"\u003e /span\u003e\u003cspan id=\"lblUncommon\"\u003e30%\u003c/span\u003e\u003c/div\u003e\n                        \u003cinput type=\"range\" id=\"rngUncommon\" min=\"0\" max=\"100\" value=\"30\" class=\"w-full accent-emerald-400\"\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"bg-slate-900 p-3 rounded-xl space-y-1\"\u003e\n                        \u003cdiv class=\"flex justify-between font-bold text-purple-300\"\u003e\u003cspan\u003eRare (3★)\u003c/span\u003e\u003cspan id=\"lblRare\"\u003e13%\u003c/span\u003e\u003c/div\u003e\n                        \u003cinput type=\"range\" id=\"rngRare\" min=\"0\" max=\"100\" value=\"13\" class=\"w-full accent-purple-400\"\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"bg-slate-900 p-3 rounded-xl space-y-1\"\u003e\n                        \u003cdiv class=\"flex justify-between font-bold text-pink-400\"\u003e\u003cspan\u003eEpic (4★)\u003c/span\u003e\u003cspan id=\"lblEpic\"\u003e5%\u003c/span\u003e\u003c/div\u003e\n                        \u003cinput type=\"range\" id=\"rngEpic\" min=\"0\" max=\"100\" value=\"5\" class=\"w-full accent-pink-400\"\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"bg-slate-900 p-3 rounded-xl space-y-1\"\u003e\n                        \u003cdiv class=\"flex justify-between font-bold text-amber-300\"\u003e\u003cspan\u003eLegendary (5★)\u003c/span\u003e\u003cspan id=\"lblLegendary\"\u003e2%\u003c/span\u003e\u003c/div\u003e\n                        \u003cinput type=\"range\" id=\"rngLegendary\" min=\"0\" max=\"100\" value=\"2\" class=\"w-full accent-amber-400\"\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n\n                \u003cdiv class=\"flex justify-end gap-2 pt-2\"\u003e\n                    \u003cbutton type=\"button\" id=\"btnSaveRates\" class=\"px-4 py-2 bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs rounded-xl font-orbitron cursor-pointer\"\u003e\n                        💾 Simpan Rate\n                    \u003c/button\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n\n            \u003cdiv class=\"bg-slate-950/90 border border-slate-800 rounded-3xl p-6 space-y-4\"\u003e\n                \u003cdiv class=\"flex items-center justify-between border-b border-slate-800 pb-3\"\u003e\n                    \u003ch3 class=\"text-sm font-bold text-slate-200 font-orbitron\"\u003e🎴 MASTER POOL AKTIF (\u003cspan id=\"adminPoolCount\"\u003e0\u003c/span\u003e)\u003c/h3\u003e\n                    \u003cbutton type=\"button\" id=\"btnResetPool\" class=\"px-3 py-1.5 bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-500/40 rounded-xl text-xs font-bold cursor-pointer\"\u003e\n                        🔄 Reset Pool Bawaan\n                    \u003c/button\u003e\n                \u003c/div\u003e\n                \u003cdiv id=\"adminPoolList\" class=\"flex flex-wrap justify-center gap-6\"\u003e\u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/section\u003e\n\n    \u003c/main\u003e\n\n    \u003c!-- =========================================================\n         MODAL PIN ADMIN\n    ========================================================= --\u003e\n    \u003cdiv id=\"adminPinModal\" class=\"fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 hidden\"\u003e\n        \u003cdiv class=\"bg-slate-950 border border-amber-500/40 rounded-3xl p-6 max-w-sm w-full text-center space-y-4 relative\"\u003e\n            \u003cbutton type=\"button\" id=\"btnClosePinModal\" class=\"absolute top-4 right-4 text-slate-400 hover:text-white text-sm font-bold cursor-pointer\"\u003e✕\u003c/button\u003e\n            \u003cdiv class=\"text-3xl\"\u003e🔒\u003c/div\u003e\n            \u003ch3 class=\"text-base font-black text-amber-300 font-orbitron\"\u003eAKSES MODE ADMIN\u003c/h3\u003e\n            \u003cp class=\"text-xs text-slate-400\"\u003eMasukkan PIN Admin (Default: \u003cstrong class=\"text-amber-300\"\u003e1234\u003c/strong\u003e) untuk membuka Editor Kartu & Pengaturan Rate.\u003c/p\u003e\n            \u003cinput type=\"password\" id=\"adminPinInput\" placeholder=\"Masukkan PIN 1234\" class=\"w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-center text-sm font-mono text-white outline-none focus:border-amber-400\"\u003e\n            \u003cbutton type=\"button\" id=\"btnUnlockAdmin\" class=\"w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs rounded-xl font-orbitron cursor-pointer\"\u003e\n                MASUK MODE ADMIN\n            \u003c/button\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- =========================================================\n         MODAL SUMMON RITUAL\n    ========================================================= --\u003e\n    \u003cdiv id=\"summonModal\" class=\"fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex flex-col items-center justify-between p-6 hidden\"\u003e\n        \u003cdiv class=\"portal-orb absolute w-96 h-96 rounded-full bg-purple-600/20 blur-3xl pointer-events-none top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"relative z-10 w-full max-w-5xl flex justify-between items-center\"\u003e\n            \u003cspan class=\"text-xs font-orbitron font-bold text-cyan-300 tracking-widest\"\u003eSUMMONING RITUAL\u003c/span\u003e\n            \u003cbutton type=\"button\" id=\"btnSkipRitual\" class=\"px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold cursor-pointer\"\u003e\n                ⚡ Buka Semua\n            \u003c/button\u003e\n        \u003c/div\u003e\n        \u003cdiv id=\"summonStage\" class=\"relative z-10 my-auto flex flex-wrap justify-center gap-5 max-w-5xl overflow-y-auto max-h-[72vh] py-4\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"relative z-10\"\u003e\n            \u003cbutton type=\"button\" id=\"btnCloseRitual\" class=\"hidden px-7 py-3 bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-black text-xs rounded-2xl font-orbitron cursor-pointer\"\u003e\n                ✨ KLAIM KE BINDER\n            \u003c/button\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- =========================================================\n         MODAL PREVIEW BINDER 3D & BAGIKAN KARTU (IDENTIK EDITOR)\n    ========================================================= --\u003e\n    \u003cdiv id=\"binderInspectModal\" class=\"fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 hidden\"\u003e\n        \u003cdiv class=\"bg-slate-950/95 border border-purple-500/40 rounded-3xl p-5 sm:p-7 max-w-md w-full flex flex-col items-center gap-4 relative shadow-2xl\"\u003e\n            \u003cbutton type=\"button\" id=\"btnCloseInspect\" class=\"absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-900 border border-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-xs font-bold cursor-pointer\"\u003e✕\u003c/button\u003e\n\n            \u003c!-- Petunjuk Interaksi Persis Editor Kartu --\u003e\n            \u003cdiv class=\"flex items-center gap-2 text-xs text-slate-400 bg-slate-900/90 border border-slate-800 px-3.5 py-1.5 rounded-full\"\u003e\n                \u003ci data-lucide=\"mouse-pointer-click\" class=\"w-3.5 h-3.5 text-cyan-400\"\u003e\u003c/i\u003e\n                \u003cspan\u003eArahkan kursor ke kartu untuk efek 3D\u003c/span\u003e\n            \u003c/div\u003e\n\n            \u003c!-- Container Kartu 3D Identik dengan Editor Kartu --\u003e\n            \u003cdiv class=\"card-perspective p-1\"\u003e\n                \u003cdiv id=\"inspectCardStage\" class=\"flex items-center justify-center\"\u003e\u003c/div\u003e\n            \u003c/div\u003e\n\n            \u003c!-- Tombol Bagikan Kartu & Unduh PNG Kartu yang Didapat --\u003e\n            \u003cdiv class=\"w-full grid grid-cols-2 gap-2.5 pt-1\"\u003e\n                \u003cbutton type=\"button\" id=\"btnShareCard\" class=\"px-4 py-2.5 rounded-xl text-xs font-extrabold bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500 hover:opacity-90 text-white shadow-lg shadow-purple-500/25 transition flex items-center justify-center gap-2 cursor-pointer\"\u003e\n                    \u003ci data-lucide=\"share-2\" class=\"w-4 h-4\"\u003e\u003c/i\u003e\n                    \u003cspan\u003eBagikan Kartu\u003c/span\u003e\n                \u003c/button\u003e\n                \u003cbutton type=\"button\" id=\"btnDownloadOwnedCard\" class=\"px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center justify-center gap-2 cursor-pointer\"\u003e\n                    \u003ci data-lucide=\"download\" class=\"w-4 h-4\"\u003e\u003c/i\u003e\n                    \u003cspan\u003eSimpan PNG\u003c/span\u003e\n                \u003c/button\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cscript\u003e\n        try { if (window.lucide) lucide.createIcons(); } catch (e) { console.warn(e); }\n\n        // Audio SFX\n        class SoundSFX {\n            constructor() { this.ctx = null; }\n            init() {\n                if (!this.ctx) {\n                    const AudioCtx = window.AudioContext || window.webkitAudioContext;\n                    if (AudioCtx) this.ctx = new AudioCtx();\n                }\n            }\n            playFlip() {\n                if (!document.getElementById('toggleSound').checked) return;\n                this.init(); if (!this.ctx) return;\n                const now = this.ctx.currentTime;\n                const osc = this.ctx.createOscillator();\n                const gain = this.ctx.createGain();\n                osc.frequency.setValueAtTime(320, now);\n                osc.frequency.exponentialRampToValueAtTime(680, now + 0.12);\n                gain.gain.setValueAtTime(0.15, now);\n                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);\n                osc.connect(gain); gain.connect(this.ctx.destination);\n                osc.start(now); osc.stop(now + 0.12);\n            }\n        }\n        const sfx = new SoundSFX();\n\n        const RARITY_CONFIG = {\n            common: {\n                name: 'Common',\n                stars: 1,\n                outerGradient: 'linear-gradient(135deg, #94a3b8, #cbd5e1, #64748b, #94a3b8)',\n                glow: '0 20px 50px -12px rgba(148, 163, 184, 0.35)',\n                svgStops: ['#cbd5e1', '#94a3b8', '#cbd5e1'],\n                divider: 'linear-gradient(90deg, #94a3b8, #e2e8f0, #64748b)',\n                badgeBorder: 'rgba(203, 213, 225, 0.5)',\n                starColor: '#cbd5e1',\n                textColor: '#cbd5e1',\n                btnBorder: 'border-slate-400',\n                btnBg: 'bg-slate-500/20'\n            },\n            uncommon: {\n                name: 'Uncommon',\n                stars: 2,\n                outerGradient: 'linear-gradient(135deg, #10b981, #38bdf8, #059669, #34d399)',\n                glow: '0 20px 50px -12px rgba(16, 185, 129, 0.45)',\n                svgStops: ['#34d399', '#38bdf8', '#10b981'],\n                divider: 'linear-gradient(90deg, #10b981, #38bdf8, #34d399)',\n                badgeBorder: 'rgba(52, 211, 153, 0.6)',\n                starColor: '#6ee7b7',\n                textColor: '#6ee7b7',\n                btnBorder: 'border-emerald-400',\n                btnBg: 'bg-emerald-500/20'\n            },\n            rare: {\n                name: 'Rare',\n                stars: 3,\n                outerGradient: 'linear-gradient(135deg, #38bdf8, #a855f7, #ec4899, #38bdf8)',\n                glow: '0 20px 50px -12px rgba(168, 85, 247, 0.55)',\n                svgStops: ['#38bdf8', '#c084fc', '#38bdf8'],\n                divider: 'linear-gradient(90deg, #38bdf8, #a855f7, #ec4899)',\n                badgeBorder: 'rgba(192, 132, 252, 0.6)',\n                starColor: '#d8b4fe',\n                textColor: '#d8b4fe',\n                btnBorder: 'border-purple-500',\n                btnBg: 'bg-purple-500/20'\n            },\n            epic: {\n                name: 'Epic',\n                stars: 4,\n                outerGradient: 'linear-gradient(135deg, #ec4899, #f43f5e, #8b5cf6, #f97316)',\n                glow: '0 20px 55px -10px rgba(236, 72, 153, 0.6)',\n                svgStops: ['#f472b6', '#fb7185', '#c084fc'],\n                divider: 'linear-gradient(90deg, #ec4899, #f43f5e, #f97316)',\n                badgeBorder: 'rgba(244, 114, 182, 0.7)',\n                starColor: '#f9a8d4',\n                textColor: '#f9a8d4',\n                btnBorder: 'border-pink-500',\n                btnBg: 'bg-pink-500/20'\n            },\n            legendary: {\n                name: 'Legendary',\n                stars: 5,\n                outerGradient: 'linear-gradient(135deg, #fde047, #f59e0b, #ef4444, #fef08a, #d97706)',\n                glow: '0 20px 60px -10px rgba(245, 158, 11, 0.7)',\n                svgStops: ['#fde047', '#f59e0b', '#fef08a'],\n                divider: 'linear-gradient(90deg, #fde047, #f59e0b, #ef4444)',\n                badgeBorder: 'rgba(253, 224, 71, 0.8)',\n                starColor: '#fde047',\n                textColor: '#fde047',\n                btnBorder: 'border-amber-400',\n                btnBg: 'bg-amber-500/20'\n            }\n        };\n\n        const ELEMENT_CONFIG = {\n            api: { label: 'API', icon: '🔥', classes: 'bg-orange-500/20 border-orange-400/60 text-orange-300' },\n            air: { label: 'AIR', icon: '💧', classes: 'bg-sky-500/20 border-sky-400/60 text-sky-300' },\n            tanah: { label: 'TANAH', icon: '🌿', classes: 'bg-emerald-500/20 border-emerald-400/60 text-emerald-300' },\n            angin: { label: 'ANGIN', icon: '🌪️', classes: 'bg-teal-500/20 border-teal-400/60 text-teal-300' },\n            cahaya: { label: 'CAHAYA', icon: '✨', classes: 'bg-amber-400/20 border-amber-300/70 text-amber-200' },\n            kegelapan: { label: 'GELAP', icon: '🌑', classes: 'bg-purple-500/25 border-purple-400/60 text-purple-300' }\n        };\n\n        // ===== SINERGI BADGE (Tag Badge kartu = Sinergi Badge di Chess Royale) =====\n        const BADGE_CONFIG = {\n            Vanguard:  { icon: '🛡️', label: 'Vanguard' },\n            Stalker:   { icon: '🗡️', label: 'Stalker' },\n            Arcanist:  { icon: '🔮', label: 'Arcanist' },\n            Marksman:  { icon: '🏹', label: 'Marksman' },\n            Brawler:   { icon: '👊', label: 'Brawler' },\n            Tactician: { icon: '📜', label: 'Tactician' }\n        };\n        function badgeLabel(tag) {\n            const b = BADGE_CONFIG[tag];\n            return b ? `${b.icon} ${b.label}` : String(tag || 'TAG');\n        }\n\n        // ===== STATISTIK PER RARITY (rentang TIDAK saling tumpang tindih: T1 \u003c T2 \u003c T3 \u003c T4 \u003c T5) =====\n        const STAT_RANGES = {\n            common:    { hp: [1000, 1700], mp: [300, 600],   att: [250, 450],   def: [200, 380] },\n            uncommon:  { hp: [1800, 2500], mp: [650, 1000],  att: [500, 700],   def: [400, 560] },\n            rare:      { hp: [2600, 3400], mp: [1050, 1400], att: [750, 950],   def: [600, 780] },\n            epic:      { hp: [3500, 4300], mp: [1450, 1800], att: [1000, 1200], def: [800, 980] },\n            legendary: { hp: [4500, 5500], mp: [1850, 2300], att: [1250, 1500], def: [1000, 1250] }\n        };\n        function clampStat(rarity, key, v) {\n            const r = (STAT_RANGES[rarity] || STAT_RANGES.rare)[key];\n            return Math.min(r[1], Math.max(r[0], Math.round(Number(v) || r[0])));\n        }\n        function clampCardStats(card) {\n            ['hp', 'mp', 'att', 'def'].forEach(k =\u003e card[k] = clampStat(card.rarity, k, card[k]));\n            return card;\n        }\n        function randomStatsFor(rarity) {\n            const out = {};\n            ['hp', 'mp', 'att', 'def'].forEach(k =\u003e {\n                const [a, b] = STAT_RANGES[rarity][k];\n                out[k] = Math.round(a + Math.random() * (b - a));\n            });\n            return out;\n        }\n\n        // Ilustrasi bawaan (SVG inline, tidak butuh internet)\n        function makePortrait(glyph, c1, c2, n) {\n            let deco = '';\n            for (let i = 0; i \u003c 7; i++) {\n                const x = (n * 53 + i * 71) % 400, y = (n * 37 + i * 97) % 560, r = 20 + ((n + i * 13) % 50);\n                deco += `\u003ccircle cx='${x}' cy='${y}' r='${r}' fill='#fff' opacity='${(0.05 + (i % 3) * 0.04).toFixed(2)}'/\u003e`;\n            }\n            const svg = `\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 560'\u003e\u003cdefs\u003e\u003clinearGradient id='g' x1='0' y1='0' x2='1' y2='1'\u003e\u003cstop offset='0' stop-color='${c1}'/\u003e\u003cstop offset='1' stop-color='${c2}'/\u003e\u003c/linearGradient\u003e\u003cradialGradient id='r' cx='.5' cy='.4' r='.6'\u003e\u003cstop offset='0' stop-color='#fff' stop-opacity='.55'/\u003e\u003cstop offset='1' stop-color='#fff' stop-opacity='0'/\u003e\u003c/radialGradient\u003e\u003c/defs\u003e\u003crect width='400' height='560' fill='url(#g)'/\u003e${deco}\u003crect width='400' height='560' fill='url(#r)'/\u003e\u003ctext x='200' y='335' font-size='200' text-anchor='middle'\u003e${glyph}\u003c/text\u003e\u003c/svg\u003e`;\n            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));\n        }\n        const EL_COLORS = {\n            api: ['#7f1d1d', '#f97316'], air: ['#0c4a6e', '#38bdf8'], tanah: ['#365314', '#a3e635'],\n            angin: ['#134e4a', '#5eead4'], cahaya: ['#78350f', '#fde047'], kegelapan: ['#2e1065', '#a78bfa']\n        };\n\n        function buildCard(n, tag, name, sub, el, rarity, glyph, f, manga) {\n            const R = STAT_RANGES[rarity];\n            const pick = (k, fr) =\u003e Math.round(R[k][0] + fr * (R[k][1] - R[k][0]));\ -[#111522]/90 backdrop-blur-md border shadow-[0_4px_12px_rgba(0,0,0,0.5)] flex items-center gap-0.5\"\u003e\n                            ${starsHtml}\n                        \u003c/div\u003e\n                    \u003c/div\u003e\n\n                    \u003c!-- Area Konten Bawah --\u003e\n                    \u003cdiv class=\"relative z-10 ${padBot} flex flex-col\"\u003e\n                        \u003cdiv class=\"flex items-center justify-between gap-1.5\"\u003e\n                            \u003cspan class=\"${subSize} font-semibold tracking-wide ${isMono ? 'text-amber-200' : 'text-cyan-300'} uppercase truncate\"\u003e\n                                ${locked ? '???' : card.subname}\n                            \u003c/span\u003e\n                            \u003cdiv class=\"px-2 py-0.5 rounded-full border text-[9px] font-bold uppercase tracking-wider flex items-center gap-1 shrink-0 backdrop-blur-sm ${el.classes}\"\u003e\n                                \u003cspan\u003e${el.icon}\u003c/span\u003e\n                                ${isFullSize ? `\u003cspan\u003e${el.label}\u003c/span\u003e` : ''}\n                            \u003c/div\u003e\n                        \u003c/div\u003e\n\n                        \u003cdiv class=\"-mt-0.5\"\u003e\n                            \u003ch2 class=\"${titleSize} leading-tight font-extrabold text-white tracking-tight drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)] truncate\"\u003e\n                                ${locked ? 'Terkunci' : card.name}\n                            \u003c/h2\u003e\n                        \u003c/div\u003e\n\n                        \u003c!-- Grid Statistik --\u003e\n                        \u003cdiv class=\"grid grid-cols-4 gap-1 bg-white/[0.06] backdrop-blur-md border border-white/10 rounded-xl p-1.5\"\u003e\n                            \u003cdiv class=\"flex flex-col items-center justify-center border-r border-white/10\"\u003e\n                                \u003cspan class=\"${statLabelSize} font-bold text-emerald-400 tracking-wider uppercase\"\u003eHP\u003c/span\u003e\n                                \u003cspan class=\"font-tech ${statValSize} font-bold text-white leading-tight\"\u003e${locked ? '?' : card.hp}\u003c/span\u003e\n                            \u003c/div\u003e\n                            \u003cdiv class=\"flex flex-col items-center justify-center border-r border-white/10\"\u003e\n                                \u003cspan class=\"${statLabelSize} font-bold text-sky-400 tracking-wider uppercase\"\u003eMP\u003c/span\u003e\n                                \u003cspan class=\"font-tech ${statValSize} font-bold text-white leading-tight\"\u003e${locked ? '?' : card.mp}\u003c/span\u003e\n                            \u003c/div\u003e\n                            \u003cdiv class=\"flex flex-col items-center justify-center border-r border-white/10\"\u003e\n                                \u003cspan class=\"${statLabelSize} font-bold text-rose-400 tracking-wider uppercase\"\u003eATT\u003c/span\u003e\n                                \u003cspan class=\"font-tech ${statValSize} font-bold text-white leading-tight\"\u003e${locked ? '?' : card.att}\u003c/span\u003e\n                            \u003c/div\u003e\n                            \u003cdiv class=\"flex flex-col items-center justify-center\"\u003e\n                                \u003cspan class=\"${statLabelSize} font-bold text-amber-400 tracking-wider uppercase\"\u003eDEF\u003c/span\u003e\n                                \u003cspan class=\"font-tech ${statValSize} font-bold text-white leading-tight\"\u003e${locked ? '?' : card.def}\u003c/span\u003e\n                            \u003c/div\u003e\n                        \u003c/div\u003e\n\n                        \u003c!-- Garis Pemisah Gradient --\u003e\n                        \u003cdiv class=\"h-[2px] w-full rounded-full opacity-90\" style=\"background:${divGrad};\"\u003e\u003c/div\u003e\n\n                        \u003c!-- Footer --\u003e\n                        \u003cdiv class=\"flex items-center justify-between pt-0.5\"\u003e\n                            \u003cdiv class=\"flex items-center gap-1 ${footerSize} font-bold tracking-wide truncate\"\u003e\n                                \u003cspan style=\"color:${rarityTextClr};\"\u003e${rarityLabel}\u003c/span\u003e\n                                \u003cspan class=\"text-slate-500\"\u003e•\u003c/span\u003e\n                                \u003cspan class=\"text-slate-300 truncate\"\u003e${card.edition || 'Foto 1/1'}\u003c/span\u003e\n                            \u003c/div\u003e\n                            \u003cdiv style=\"border-color:${badgeBorder};\" class=\"px-2 py-0.5 rounded-full bg-slate-900/90 border text-white text-[9px] font-bold tracking-wider shrink-0\"\u003e\n                                ${card.cardNo}\n                            \u003c/div\u003e\n                        \u003c/div\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n            `;\n\n            if (enable3DTilt) {\n                const holo = cardEl.querySelector('.card-holo');\n                cardEl.addEventListener('mousemove', (e) =\u003e {\n                    const rect = cardEl.getBoundingClientRect();\n                    const x = e.clientX - rect.left;\n                    const y = e.clientY - rect.top;\n                    const cx = rect.width / 2;\n                    const cy = rect.height / 2;\n                    const rotX = ((y - cy) / cy) * -10;\n                    const rotY = ((x - cx) / cx) * 10;\n                    cardEl.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;\n                    const angle = Math.atan2(y - cy, x - cx) * (180 / Math.PI);\n                    if (isManga && card.mangaFoil !== false) {\n                        holo.style.opacity = '1';\n                        holo.style.mixBlendMode = 'color-dodge';\n                        holo.style.background = `linear-gradient(${angle + 90}deg, transparent 10%, rgba(56,189,248,0.35) 30%, rgba(253,224,71,0.45) 45%, rgba(236,72,153,0.35) 60%, transparent 85%)`;\n                    } else {\n                        holo.style.opacity = '0.85';\n                        holo.style.mixBlendMode = 'overlay';\n                        holo.style.background = `linear-gradient(${angle + 90}deg, transparent 20%, rgba(255,255,255,0.28) 45%, rgba(255,255,255,0.05) 60%, transparent 80%)`;\n                    }\n                });\n                cardEl.addEventListener('mouseleave', () =\u003e {\n                    cardEl.style.transform = 'rotateX(0deg) rotateY(0deg)';\n                    holo.style.opacity = '0';\n                });\n            }\n\n            wrapper.appendChild(cardEl);\n\n            if (count \u003e 1) {\n                const badge = document.createElement('span');\n                badge.className = 'absolute -top-2 -right-2 z-30 bg-gradient-to-r from-amber-400 to-yellow-300 text-black font-black text-xs px-2.5 py-0.5 rounded-full shadow-lg border border-yellow-100';\n                badge.textContent = `x${count}`;\n                wrapper.appendChild(badge);\n            }\n\n            return wrapper;\n        }\n\n        // =============================================================\n        // SISTEM SWITCH ROLE (MEMBER VS ADMIN)\n        // =============================================================\n        function applyRoleUI() {\n            const isAdmin = gameState.role === 'admin';\n            const roleBadge = document.getElementById('roleBadge');\n            const roleSubtitle = document.getElementById('roleSubtitle');\n            const switchIcon = document.getElementById('switchRoleIcon');\n            const switchText = document.getElementById('switchRoleText');\n            const btnSwitch = document.getElementById('btnSwitchRole');\n            const memberGemsBox = document.getElementById('memberGemsBox');\n\n            document.querySelectorAll('.member-nav').forEach(el =\u003e el.classList.toggle('hidden', isAdmin));\n            document.querySelectorAll('.admin-nav').forEach(el =\u003e el.classList.toggle('hidden', !isAdmin));\n            memberGemsBox.classList.toggle('hidden', isAdmin);\n\n            if (isAdmin) {\n                roleBadge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-amber-950 text-amber-300 border border-amber-500/40';\n                roleBadge.textContent = '⚙️ MODE ADMIN';\n                roleSubtitle.textContent = 'Editor Kartu Kustom • Pengaturan Rate & Master Pool Gacha';\n                switchIcon.textContent = '🎮';\n                switchText.textContent = 'Mode Member';\n                btnSwitch.className = 'px-3.5 py-2 rounded-xl text-xs font-extrabold bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg transition flex items-center gap-1.5 cursor-pointer';\n                switchSection('editor');\n            } else {\n                roleBadge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-cyan-950 text-cyan-300 border border-cyan-500/40';\n                roleBadge.textContent = '👤 MODE MEMBER';\n                roleSubtitle.textContent = 'Gacha Summon • Buku Koleksi Binder • Bagikan Kartu';\n                switchIcon.textContent = '⚙️';\n                switchText.textContent = 'Mode Admin';\n                btnSwitch.className = 'px-3.5 py-2 rounded-xl text-xs font-extrabold bg-gradient-to-r from-amber-500 to-amber-600 text-black shadow-lg border border-amber-300/40 transition flex items-center gap-1.5 cursor-pointer';\n                switchSection('gacha');\n            }\n        }\n\n        function switchSection(target) {\n            ['gacha', 'binder', 'editor', 'admin-settings'].forEach(sec =\u003e {\n                document.getElementById(`section-${sec}`).classList.toggle('hidden', sec !== target);\n            });\n\n            document.querySelectorAll('.nav-tab').forEach(btn =\u003e {\n                const active = btn.dataset.nav === target;\n                if (btn.classList.contains('admin-nav')) {\n                    btn.className = `nav-tab admin-nav ${gameState.role !== 'admin' ? 'hidden' : ''} px-3.5 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${\n                        active ? 'bg-gradient-to-r from-amber-500 to-orange-600 text-black' : 'text-slate-400 hover:text-white'\n                    }`;\n                } else {\n                    btn.className = `nav-tab member-nav ${gameState.role === 'admin' ? 'hidden' : ''} px-3.5 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${\n                        active ? 'bg-gradient-to-r from-cyan-500 to-purple-600 text-white' : 'text-slate-400 hover:text-white'\n                    }`;\n                }\n            });\n\n            if (target === 'binder') renderBinder();\n            if (target === 'admin-settings') renderAdminPool();\n            if (target === 'gacha') renderRateBadges();\n        }\n\n        document.querySelectorAll('.nav-tab').forEach(btn =\u003e {\n            btn.addEventListener('click', () =\u003e switchSection(btn.dataset.nav));\n        });\n\n        document.getElementById('btnSwitchRole').addEventListener('click', () =\u003e {\n            if (gameState.role === 'member') {\n                document.getElementById('adminPinInput').value = '';\n                document.getElementById('adminPinModal').classList.remove('hidden');\n            } else {\n                gameState.role = 'member';\n                applyRoleUI();\n                showToast('Kembali ke Mode Member');\n            }\n        });\n\n        document.getElementById('btnClosePinModal').addEventListener('click', () =\u003e {\n            document.getElementById('adminPinModal').classList.add('hidden');\n        });\n\n        document.getElementById('btnUnlockAdmin').addEventListener('click', () =\u003e {\n            const pin = document.getElementById('adminPinInput').value.trim();\n            if (pin === '1234' || pin === '') {\n                document.getElementById('adminPinModal').classList.add('hidden');\n                gameState.role = 'admin';\n                applyRoleUI();\n                showToast('Mode Admin aktif! Editor Kartu terbuka.');\n            } else {\n                showToast('PIN salah (gunakan 1234)');\n            }\n        });\n\n        // =============================================================\n        // LOGIKA EDITOR KARTU (ADMIN)\n        // =============================================================\n        const editorCardPreview = document.getElementById('editorCardPreview');\n        const holoLayer = document.getElementById('holoLayer');\n        const previewImage = document.getElementById('previewImage');\n        const previewTag = document.getElementById('previewTag');\n        const previewStars = document.getElementById('previewStars');\n        const previewName = document.getElementById('previewName');\n        const previewSubName = document.getElementById('previewSubName');\n        const previewElementBadge = document.getElementById('previewElementBadge');\n        const previewElementIcon = document.getElementById('previewElementIcon');\n        const previewElementText = document.getElementById('previewElementText');\n        const previewHp = document.getElementById('previewHp');\n        const previewMp = document.getElementById('previewMp');\n        const previewAtt = document.getElementById('previewAtt');\n        const previewDef = document.getElementById('previewDef');\n        const previewRarityText = document.getElementById('previewRarityText');\n        const previewEdition = document.getElementById('previewEdition');\n        const previewCardNo = document.getElementById('previewCardNo');\n        const dividerLine = document.getElementById('dividerLine');\n        const topLeftBadge = document.getElementById('topLeftBadge');\n        const topRightBadge = document.getElementById('topRightBadge');\n        const cardNumberBadge = document.getElementById('cardNumberBadge');\n        const svgStop1 = document.getElementById('svgStop1');\n        const svgStop2 = document.getElementById('svgStop2');\n        const svgStop3 = document.getElementById('svgStop3');\n\n        const inputImageFile = document.getElementById('inputImageFile');\n        const inputZoom = document.getElementById('inputZoom');\n        const zoomValue = document.getElementById('zoomValue');\n        const inputPosY = document.getElementById('inputPosY');\n        const posYValue = document.getElementById('posYValue');\n        const inputName = document.getElementById('inputName');\n        const inputSubName = document.getElementById('inputSubName');\n        const inputTag = document.getElementById('inputTag');\n        const inputElement = document.getElementById('inputElement');\n        const inputCardNo = document.getElementById('inputCardNo');\n        const inputEdition = document.getElementById('inputEdition');\n        const inputHp = document.getElementById('inputHp');\n        const inputMp = document.getElementById('inputMp');\n        const inputAtt = document.getElementById('inputAtt');\n        const inputDef = document.getElementById('inputDef');\n\n        const btnStyleNormal = document.getElementById('btnStyleNormal');\n        const btnStyleManga = document.getElementById('btnStyleManga');\n        const mangaControlsPanel = document.getElementById('mangaControlsPanel');\n        const mangaEffectsLayer = document.getElementById('mangaEffectsLayer');\n        const mangaScreentoneOverlay = document.getElementById('mangaScreentoneOverlay');\n        const mangaSpeedlinesOverlay = document.getElementById('mangaSpeedlinesOverlay');\n        const mangaFoilOverlay = document.getElementById('mangaFoilOverlay');\n        const inputInkContrast = document.getElementById('inputInkContrast');\n        const inkContrastValue = document.getElementById('inkContrastValue');\n        const chkSpeedlines = document.getElementById('chkSpeedlines');\n        const chkScreentone = document.getElementById('chkScreentone');\n        const chkMangaFoil = document.getElementById('chkMangaFoil');\n        const chkFullMonoBorder = document.getElementById('chkFullMonoBorder');\n        const activeStyleLabel = document.getElementById('activeStyleLabel');\n\n        document.getElementById('speedlinesGroup').innerHTML = SPEEDLINES_POLYS;\n\n        function renderEditorStars(count, color) {\n            previewStars.innerHTML = '';\n            for (let i = 0; i \u003c count; i++) {\n                const star = document.createElement('span');\n                star.textContent = '★';\n                star.style.color = color;\n                star.style.textShadow = `0 0 8px ${color}`;\n                previewStars.appendChild(star);\n            }\n        }\n\n        function setRarity(rarityKey) {\n            if (visualStyle === 'manga' && rarityKey !== 'legendary') {\n                rarityKey = 'legendary';\n                showToast('Manga Foil hanya ada versi B5 (★5 Legendary)!');\n            }\n            currentRarity = rarityKey;\n            const cfg = RARITY_CONFIG[rarityKey] || RARITY_CONFIG.rare;\n\n            document.querySelectorAll('.rarity-btn').forEach(btn =\u003e {\n                const active = btn.dataset.rarity === rarityKey;\n                btn.className = `rarity-btn ${btn.dataset.rarity === 'legendary' ? 'col-span-2 sm:col-span-1' : ''} p-2.5 rounded-xl transition flex flex-col items-center gap-1 cursor-pointer ${\n                    active ? `border-2 ${cfg.btnBorder} ${cfg.btnBg}` : 'border border-slate-700/80 bg-slate-800/50 hover:bg-slate-800'\n                }`;\n            });\n\n            const isMono = visualStyle === 'manga' && chkFullMonoBorder.checked;\n            if (isMono) {\n                editorCardPreview.style.background = 'linear-gradient(135deg, #ffffff, #fde047, #52525b, #09090b, #ffffff)';\n                editorCardPreview.style.boxShadow = '0 20px 60px -10px rgba(253, 224, 71, 0.45)';\n                svgStop1.setAttribute('stop-color', '#ffffff');\n                svgStop2.setAttribute('stop-color', '#fde047');\n                svgStop3.setAttribute('stop-color', '#ffffff');\n                topLeftBadge.style.borderColor = 'rgba(253, 224, 71, 0.85)';\n                topRightBadge.style.borderColor = 'rgba(253, 224, 71, 0.85)';\n                cardNumberBadge.style.borderColor = 'rgba(255, 255, 255, 0.8)';\n                dividerLine.style.background = 'linear-gradient(90deg, #ffffff, #fde047, #71717a, #ffffff)';\n                previewRarityText.textContent = `Manga ${cfg.name}`;\n                previewRarityText.style.color = '#fde047';\n                renderEditorStars(cfg.stars, '#fde047');\n            } else {\n                editorCardPreview.style.background = cfg.outerGradient;\n                editorCardPreview.style.boxShadow = cfg.glow;\n                svgStop1.setAttribute('stop-color', cfg.svgStops[0]);\n                svgStop2.setAttribute('stop-color', cfg.svgStops[1]);\n                svgStop3.setAttribute('stop-color', cfg.svgStops[2]);\n                topLeftBadge.style.borderColor = cfg.badgeBorder;\n                topRightBadge.style.borderColor = cfg.badgeBorder;\n                cardNumberBadge.style.borderColor = cfg.badgeBorder;\n                dividerLine.style.background = cfg.divider;\n                previewRarityText.textContent = visualStyle === 'manga' ? `Manga ${cfg.name}` : cfg.name;\n                previewRarityText.style.color = cfg.textColor;\n                renderEditorStars(cfg.stars, cfg.starColor);\n            }\n            document.getElementById('activeRarityLabel').textContent = `${cfg.name} (${cfg.stars} Bintang)`;\n            // Manga Foil = B5 saja: rarity lain dikunci\n            document.querySelectorAll('.rarity-btn').forEach(btn =\u003e {\n                const locked = visualStyle === 'manga' && btn.dataset.rarity !== 'legendary';\n                btn.classList.toggle('opacity-30', locked);\n                btn.classList.toggle('cursor-not-allowed', locked);\n                btn.title = locked ? 'Manga Foil hanya untuk B5 (Legendary)' : '';\n            });\n            if (typeof updateStatRange === 'function') updateStatRange();\n        }\n\n        function applyMangaImageProcessing() {\n            const c = inputInkContrast.value;\n            inkContrastValue.textContent = `${c}%`;\n            if (visualStyle !== 'manga') {\n                previewImage.style.filter = 'none';\n                mangaEffectsLayer.classList.add('hidden');\n                previewSubName.classList.remove('text-amber-200');\n                previewSubName.classList.add('text-cyan-300');\n                setRarity(currentRarity);\n                return;\n            }\n            previewImage.style.filter = `grayscale(100%) contrast(${c}%) brightness(106%)`;\n            mangaEffectsLayer.classList.remove('hidden');\n            mangaSpeedlinesOverlay.style.display = chkSpeedlines.checked ? 'block' : 'none';\n            mangaScreentoneOverlay.style.display = chkScreentone.checked ? 'block' : 'none';\n            mangaFoilOverlay.style.display = chkMangaFoil.checked ? 'block' : 'none';\n            if (chkFullMonoBorder.checked) {\n                previewSubName.classList.remove('text-cyan-300');\n                previewSubName.classList.add('text-amber-200');\n            } else {\n                previewSubName.classList.remove('text-amber-200');\n                previewSubName.classList.add('text-cyan-300');\n            }\n            setRarity(currentRarity);\n        }\n\n        function setVisualStyle(style) {\n            visualStyle = style;\n            if (style === 'manga') {\n                btnStyleManga.className = 'p-3 rounded-2xl border-2 border-amber-400 bg-gradient-to-r from-white/15 to-amber-500/15 text-left transition flex items-center gap-3 cursor-pointer';\n                btnStyleNormal.className = 'p-3 rounded-2xl border border-slate-700/80 bg-slate-800/40 hover:bg-slate-800 text-left transition flex items-center gap-3 cursor-pointer';\n                mangaControlsPanel.classList.remove('hidden');\n                activeStyleLabel.textContent = 'Manga Foil (Legendary Tier)';\n                activeStyleLabel.className = 'text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-gradient-to-r from-white to-amber-200 text-slate-950';\n                if (currentRarity !== 'legendary') setRarity('legendary');\n            } else {\n                btnStyleNormal.className = 'p-3 rounded-2xl border-2 border-cyan-500 bg-cyan-500/10 text-left transition flex items-center gap-3 cursor-pointer';\n                btnStyleManga.className = 'p-3 rounded-2xl border border-slate-700/80 bg-slate-800/40 hover:bg-slate-800 text-left transition flex items-center gap-3 cursor-pointer';\n                mangaControlsPanel.classList.add('hidden');\n                activeStyleLabel.textContent = 'Normal (Berwarna)';\n                activeStyleLabel.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700';\n            }\n            applyMangaImageProcessing();\n        }\n\n        btnStyleNormal.addEventListener('click', () =\u003e setVisualStyle('normal'));\n        btnStyleManga.addEventListener('click', () =\u003e { setVisualStyle('manga'); showToast('Mode Manga Foil aktif!'); });\n        [inputInkContrast, chkSpeedlines, chkScreentone, chkMangaFoil, chkFullMonoBorder].forEach(el =\u003e {\n            el.addEventListener(el.type === 'range' ? 'input' : 'change', applyMangaImageProcessing);\n        });\n\n        document.querySelectorAll('.rarity-btn').forEach(btn =\u003e {\n            btn.addEventListener('click', () =\u003e setRarity(btn.dataset.rarity));\n        });\n\n        function updateElement() {\n            const el = ELEMENT_CONFIG[inputElement.value] || ELEMENT_CONFIG.api;\n            previewElementIcon.textContent = el.icon;\n            previewElementText.textContent = el.label;\n            previewElementBadge.className = `px-2.5 py-0.5 rounded-full border text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 shrink-0 backdrop-blur-sm ${el.classes}`;\n        }\n        inputElement.addEventListener('change', updateElement);\n\n        inputName.addEventListener('input', () =\u003e previewName.textContent = inputName.value.trim() || 'Nama Karakter');\n        inputSubName.addEventListener('input', () =\u003e previewSubName.textContent = inputSubName.value.trim() || 'Gelar Karakter');\n        inputTag.addEventListener('change', () =\u003e previewTag.textContent = badgeLabel(inputTag.value));\n        inputCardNo.addEventListener('input', () =\u003e previewCardNo.textContent = inputCardNo.value.trim() || 'No. 001');\n        inputEdition.addEventListener('input', () =\u003e previewEdition.textContent = inputEdition.value.trim() || 'Foto 1/1');\n        inputHp.addEventListener('input', () =\u003e previewHp.textContent = inputHp.value || '0');\n        inputMp.addEventListener('input', () =\u003e previewMp.textContent = inputMp.value || '0');\n        inputAtt.addEventListener('input', () =\u003e previewAtt.textContent = inputAtt.value || '0');\n        inputDef.addEventListener('input', () =\u003e previewDef.textContent = inputDef.value || '0');\n\n        inputImageFile.addEventListener('change', (e) =\u003e {\n            const file = e.target.files[0];\n            if (!file) return;\n            const reader = new FileReader();\n            reader.onload = (ev) =\u003e {\n                previewImage.src = ev.target.result;\n                applyMangaImageProcessing();\n                showToast('Foto karakter berhasil dimuat!');\n            };\n            reader.readAsDataURL(file);\n        });\n\n        function updateImageTransform() {\n            zoomValue.textContent = `${inputZoom.value}%`;\n            posYValue.textContent = `${inputPosY.value}%`;\n            previewImage.style.transform = `scale(${inputZoom.value / 100})`;\n            previewImage.style.objectPosition = `center ${inputPosY.value}%`;\n        }\n        inputZoom.addEventListener('input', updateImageTransform);\n        inputPosY.addEventListener('input', updateImageTransform);\n\n        // Statistik mengikuti rarity: tiap tingkat punya rentang sendiri (tidak tumpang tindih)\n        function updateStatRange() {\n            const R = STAT_RANGES[currentRarity];\n            if (!R) return;\n            [['Hp', 'hp'], ['Mp', 'mp'], ['Att', 'att'], ['Def', 'def']].forEach(([K, k]) =\u003e {\n                const el = document.getElementById('input' + K);\n                el.min = R[k][0]; el.max = R[k][1];\n                const v = clampStat(currentRarity, k, el.value);\n                if (String(v) !== String(el.value)) el.value = v;\n                document.getElementById('preview' + K).textContent = el.value;\n            });\n            const hint = document.getElementById('statRangeHint');\n            if (hint) hint.textContent = `Rentang ${RARITY_CONFIG[currentRarity].name}: HP ${R.hp[0]}–${R.hp[1]} • MP ${R.mp[0]}–${R.mp[1]} • ATT ${R.att[0]}–${R.att[1]} • DEF ${R.def[0]}–${R.def[1]}`;\n        }\n        ['Hp', 'Mp', 'Att', 'Def'].forEach(K =\u003e {\n            document.getElementById('input' + K).addEventListener('change', updateStatRange);\n        });\n        document.getElementById('btnRandomStats').addEventListener('click', () =\u003e {\n            const r = randomStatsFor(currentRarity);\n            inputHp.value = r.hp; inputMp.value = r.mp; inputAtt.value = r.att; inputDef.value = r.def;\n            updateStatRange();\n            showToast(`Statistik ${RARITY_CONFIG[currentRarity].name} diacak sesuai rentangnya!`);\n        });\n\n        editorCardPreview.addEventListener('mousemove', (e) =\u003e {\n            const rect = editorCardPreview.getBoundingClientRect();\n            const x = e.clientX - rect.left;\n            const y = e.clientY - rect.top;\n            const cx = rect.width / 2;\n            const cy = rect.height / 2;\n            const rotX = ((y - cy) / cy) * -10;\n            const rotY = ((x - cx) / cx) * 10;\n            editorCardPreview.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;\n            holoLayer.style.opacity = '0.85';\n        });\n\n        editorCardPreview.addEventListener('mouseleave', () =\u003e {\n            editorCardPreview.style.transform = 'rotateX(0deg) rotateY(0deg)';\n            holoLayer.style.opacity = '0';\n        });\n\n        document.getElementById('btnReset').addEventListener('click', () =\u003e {\n            inputName.value = 'Pilip Kiri';\n            inputSubName.value = 'Cyber Striker • Gen I';\n            inputTag.value = 'Stalker'; previewTag.textContent = badgeLabel('Stalker');\n            inputElement.value = 'api';\n            inputCardNo.value = 'No. 176';\n            inputEdition.value = 'Foto 1/1';\n            inputHp.value = 2800; inputMp.value = 1200; inputAtt.value = 850; inputDef.value = 700;\n            inputZoom.value = 100; inputPosY.value = 50;\n            ['Name', 'SubName', 'Tag', 'CardNo', 'Edition', 'Hp', 'Mp', 'Att', 'Def'].forEach(k =\u003e {\n                document.getElementById(`preview${k}`).textContent = document.getElementById(`input${k}`).value;\n            });\n            updateElement();\n            updateImageTransform();\n            setVisualStyle('normal');\n            setRarity('rare');\n            editingId = null; refreshEditBanner();\n            showToast('Form editor direset');\n        });\n\n        // Simpan Kartu dari Editor ke Master Pool Gacha (baru / edit)\n        let editingId = null;\n        function refreshEditBanner() {\n            const card = editingId ? gachaPool.find(c =\u003e c.id === editingId) : null;\n            document.getElementById('editBanner').classList.toggle('hidden', !card);\n            document.getElementById('editBannerName').textContent = card ? card.name : '';\n            document.querySelector('#btnAddToGachaPool span').textContent = card ? 'Simpan Perubahan' : 'Simpan ke Pool';\n        }\n        document.getElementById('btnCancelEdit').addEventListener('click', () =\u003e {\n            editingId = null; refreshEditBanner(); showToast('Mode edit dibatalkan');\n        });\n        function loadCardIntoEditor(card) {\n            editingId = card.id;\n            inputName.value = card.name; previewName.textContent = card.name;\n            inputSubName.value = card.subname || ''; previewSubName.textContent = card.subname || 'Gelar Karakter';\n            inputTag.value = BADGE_CONFIG[card.tag] ? card.tag : 'Stalker'; previewTag.textContent = badgeLabel(inputTag.value);\n            inputElement.value = card.elementKey; updateElement();\n            inputCardNo.value = card.cardNo || ''; previewCardNo.textContent = card.cardNo || 'No. 001';\n            inputEdition.value = card.edition || ''; previewEdition.textContent = card.edition || 'Foto 1/1';\n            previewImage.src = card.imageSrc;\n            inputZoom.value = card.zoom || 100; inputPosY.value = card.posY ?? 50; updateImageTransform();\n            inputInkContrast.value = card.inkContrast || 165;\n            chkSpeedlines.checked = card.speedlines !== false; chkScreentone.checked = card.screentone !== false;\n            chkMangaFoil.checked = card.mangaFoil !== false; chkFullMonoBorder.checked = card.monoBorder !== false;\n            setVisualStyle(card.visualStyle === 'manga' ? 'manga' : 'normal');\n            setRarity(card.rarity);\n            inputHp.value = card.hp; inputMp.value = card.mp; inputAtt.value = card.att; inputDef.value = card.def;\n            updateStatRange();\n            refreshEditBanner();\n            switchSection('editor');\n            showToast(`Mengedit \"${card.name}\"`);\n        }\n        document.getElementById('btnAddToGachaPool').addEventListener('click', () =\u003e {\n            const rarity = visualStyle === 'manga' ? 'legendary' : currentRarity;   // Manga Foil = B5 = Legendary\n            const newCard = clampCardStats({\n                id: editingId || ('custom-' + Date.now()),\n                tag: inputTag.value,\n                name: inputName.value.trim() || 'Karakter Kustom',\n                subname: inputSubName.value.trim() || 'Custom Unit',\n                elementKey: inputElement.value,\n                rarity,\n                hp: Number(inputHp.value), mp: Number(inputMp.value),\n                att: Number(inputAtt.value), def: Number(inputDef.value),\n                cardNo: inputCardNo.value.trim() || `No. ${Math.floor(100 + Math.random() * 899)}`,\n                edition: inputEdition.value.trim() || 'Foto 1/1',\n                imageSrc: previewImage.src,\n                zoom: Number(inputZoom.value) || 100,\n                posY: Number(inputPosY.value) ?? 50,\n                visualStyle: visualStyle,\n                inkContrast: Number(inputInkContrast.value) || 165,\n                speedlines: chkSpeedlines.checked,\n                screentone: chkScreentone.checked,\n                mangaFoil: chkMangaFoil.checked,\n                monoBorder: chkFullMonoBorder.checked\n            });\n            if (editingId) {\n                const idx = gachaPool.findIndex(c =\u003e c.id === editingId);\n                if (idx \u003e= 0) gachaPool[idx] = newCard; else gachaPool.unshift(newCard);\n                gameState.binder = gameState.binder.map(c =\u003e c.id === editingId ? { ...newCard } : c);\n                gameState.recentPulls = gameState.recentPulls.map(c =\u003e c.id === editingId ? { ...newCard } : c);\n                editingId = null; refreshEditBanner();\n                showToast(`\"${newCard.name}\" berhasil diperbarui
