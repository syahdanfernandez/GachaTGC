id));\n            for (let i = 0; i \u003c count; i++) {\n                let rarity = rollRarity();\n                if (count === 10 && i === 9 && !results.some(x =\u003e ['rare', 'epic', 'legendary'].includes(x.rarity))) {\n                    rarity = 'rare';\n                }\n                let matches = gachaPool.filter(c =\u003e c.rarity === rarity);\n                // Perlindungan pemula: selama belum punya 10 kartu BERBEDA, tiap tarikan diutamakan kartu baru\n                if (ownedIds.size \u003c LOADOUT_SIZE) {\n                    const fresh = matches.filter(c =\u003e !ownedIds.has(c.id));\n                    matches = fresh.length ? fresh : gachaPool.filter(c =\u003e !ownedIds.has(c.id));\n                }\n                const template = matches.length ? matches[Math.floor(Math.random() * matches.length)] : gachaPool[0];\n                ownedIds.add(template.id);\n                const pulled = { ...template };\n                results.push(pulled);\n                gameState.binder.push(pulled);\n            }\n\n            gameState.recentPulls = results;\n            updateCounts();\n            openSummonStage(results);\n        }\n\n        document.getElementById('btnPull1').addEventListener('click', () =\u003e runGacha(1, 100));\n        document.getElementById('btnPull5').addEventListener('click', () =\u003e runGacha(5, 500));\n        document.getElementById('btnPull10').addEventListener('click', () =\u003e runGacha(10, 1000));\n\n        function openSummonStage(cards) {\n            const modal = document.getElementById('summonModal');\n            const stage = document.getElementById('summonStage');\n            const btnClose = document.getElementById('btnCloseRitual');\n            stage.innerHTML = '';\n            btnClose.classList.add('hidden');\n            modal.classList.remove('hidden');\n\n            cards.forEach((card, idx) =\u003e {\n                const box = document.createElement('div');\n                box.className = 'w-44 sm:w-52 aspect-[2.5/3.65] flip-card-3d opacity-0 scale-90 transition-all duration-500';\n                box.innerHTML = `\n                    \u003cdiv class=\"flip-card-inner\"\u003e\n                        \u003cdiv class=\"flip-card-front bg-slate-900 border-2 border-purple-500 flex flex-col items-center justify-center\"\u003e\n                            \u003cspan class=\"text-3xl\"\u003e🎴\u003c/span\u003e\n                            \u003cspan class=\"text-[10px] font-orbitron text-slate-400 mt-1\"\u003e#${idx + 1}\u003c/span\u003e\n                        \u003c/div\u003e\n                        \u003cdiv class=\"flip-card-back\"\u003e\u003c/div\u003e\n                    \u003c/div\u003e\n                `;\n                const cardDom = buildUnifiedCardElement(card, { sizeClass: 'w-full' });\n                box.querySelector('.flip-card-back').appendChild(cardDom);\n                stage.appendChild(box);\n\n                setTimeout(() =\u003e {\n                    box.classList.remove('opacity-0', 'scale-90');\n                    setTimeout(() =\u003e {\n                        box.querySelector('.flip-card-inner').classList.add('is-flipped');\n                        sfx.playFlip();\n                    }, 220);\n                    if (idx === cards.length - 1) {\n                        setTimeout(() =\u003e btnClose.classList.remove('hidden'), 450);\n                    }\n                }, idx * 240);\n            });\n        }\n\n        document.getElementById('btnSkipRitual').addEventListener('click', () =\u003e {\n            document.querySelectorAll('#summonStage .flip-card-3d').forEach(box =\u003e {\n                box.classList.remove('opacity-0', 'scale-90');\n                box.querySelector('.flip-card-inner').classList.add('is-flipped');\n            });\n            document.getElementById('btnCloseRitual').classList.remove('hidden');\n        });\n\n        document.getElementById('btnCloseRitual').addEventListener('click', () =\u003e {\n            document.getElementById('summonModal').classList.add('hidden');\n            const grid = document.getElementById('recentPullsGrid');\n            grid.innerHTML = '';\n            gameState.recentPulls.forEach(card =\u003e {\n                const elem = buildUnifiedCardElement(card, { sizeClass: 'w-44 sm:w-52', enable3DTilt: true });\n                elem.addEventListener('click', () =\u003e openBinderInspect(card));\n                grid.appendChild(elem);\n            });\n        });\n\n        // Render Binder (2 Halaman)\n        function renderBinder() {\n            const left = document.getElementById('binderLeftGrid');\n            const right = document.getElementById('binderRightGrid');\n            left.innerHTML = ''; right.innerHTML = '';\n\n            const counts = {};\n            gameState.binder.forEach(c =\u003e counts[c.id] = (counts[c.id] || 0) + 1);\n\n            const total = gachaPool.length;\n            const unlocked = Object.keys(counts).length;\n            const pct = total ? Math.round((unlocked / total) * 100) : 0;\n            document.getElementById('binderPercentText').textContent = `${unlocked}/${total} (${pct}%)`;\n            document.getElementById('binderProgressBar').style.width = `${pct}%`;\n\n            gachaPool.forEach((card, i) =\u003e {\n                const cnt = counts[card.id] || 0;\n                const isLocked = cnt === 0;\n                const elem = buildUnifiedCardElement(card, {\n                    sizeClass: 'w-36 sm:w-44',\n                    locked: isLocked,\n                    count: cnt,\n                    enable3DTilt: !isLocked\n                });\n                if (!isLocked) {\n                    elem.addEventListener('click', () =\u003e openBinderInspect(card));\n                }\n                if (i % 2 === 0) left.appendChild(elem);\n                else right.appendChild(elem);\n            });\n        }\n\n        // Modal Preview 3D Binder & Bagikan Kartu\n        function openBinderInspect(card) {\n            activeInspectCard = card;\n            const stage = document.getElementById('inspectCardStage');\n            stage.innerHTML = '';\n            const fullCard = buildUnifiedCardElement(card, {\n                sizeClass: 'w-[300px] sm:w-[340px]',\n                enable3DTilt: true,\n                isFullSize: true\n            });\n            fullCard.querySelector('.card-tilt').id = 'inspectRenderTarget';\n            stage.appendChild(fullCard);\n            document.getElementById('binderInspectModal').classList.remove('hidden');\n        }\n\n        document.getElementById('btnCloseInspect').addEventListener('click', () =\u003e {\n            document.getElementById('binderInspectModal').classList.add('hidden');\n        });\n\n        // Render PNG Presisi Tinggi dengan Canvas 2D Native (Akurasi Teks, Bintang, Foil & Holografik)\n        function loadImgForCanvas(src) {\n            return new Promise((resolve) =\u003e {\n                const img = new Image();\n                if (!src.startsWith('data:')) {\n                    img.crossOrigin = 'anonymous';\n                }\n                img.onload = () =\u003e resolve(img);\n                img.onerror = () =\u003e {\n                    const fallback = new Image();\n                    fallback.onload = () =\u003e resolve(fallback);\n                    fallback.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(\n                        '\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"400\" height=\"600\"\u003e\u003crect width=\"100%\" height=\"100%\" fill=\"#1e293b\"/\u003e\u003ctext x=\"50%\" y=\"50%\" fill=\"#94a3b8\" font-size=\"24\" font-family=\"sans-serif\" text-anchor=\"middle\" dy=\".3em\"\u003eCard Image\u003c/text\u003e\u003c/svg\u003e'\n                    );\n                };\n                img.src = src;\n            });\n        }\n\n        function drawRoundRectPath(ctx, x, y, w, h, r) {\n            const rad = Math.max(0, Math.min(r, w / 2, h / 2));\n            ctx.beginPath();\n            ctx.moveTo(x + rad, y);\n            ctx.arcTo(x + w, y, x + w, y + h, rad);\n            ctx.arcTo(x + w, y + h, x, y + h, rad);\n            ctx.arcTo(x, y + h, x, y, rad);\n            ctx.arcTo(x, y, x + w, y, rad);\n            ctx.closePath();\n        }\n\n        function drawChamferFramePath(ctx, x, y, w, h) {\n            const sx = w / 360;\n            const sy = h / 525;\n            const px = (v) =\u003e x + v * sx;\n            const py = (v) =\u003e y + v * sy;\n            ctx.beginPath();\n            ctx.moveTo(px(28), py(10));\n            ctx.lineTo(px(332), py(10));\n            ctx.lineTo(px(350), py(28));\n            ctx.lineTo(px(350), py(497));\n            ctx.lineTo(px(332), py(515));\n            ctx.lineTo(px(28), py(515));\n            ctx.lineTo(px(10), py(497));\n            ctx.lineTo(px(10), py(28));\n            ctx.closePath();\n        }\n\n        function drawStarGlyph(ctx, cx, cy, outerR, innerR, fillStyle, glowColor) {\n            ctx.save();\n            ctx.beginPath();\n            for (let i = 0; i \u003c 10; i++) {\n                const r = i % 2 === 0 ? outerR : innerR;\n                const angle = -Math.PI / 2 + (i * Math.PI) / 5;\n                const x = cx + Math.cos(angle) * r;\n                const y = cy + Math.sin(angle) * r;\n                if (i === 0) ctx.moveTo(x, y);\n                else ctx.lineTo(x, y);\n            }\n            ctx.closePath();\n            if (glowColor) {\n                ctx.shadowColor = glowColor;\n                ctx.shadowBlur = 8;\n            }\n            ctx.fillStyle = fillStyle;\n            ctx.fill();\n            ctx.restore();\n        }\n\n        function drawHolographicAndFoilLayers(ctx, ix, iy, iw, ih, isManga, hasFoil) {\n            // Foil & Holografik dinaikkan tipis-tipis dari v7 agar kilau prismatik lebih terasa namun tetap jernih\n            if (hasFoil) {\n                ctx.save();\n                ctx.globalCompositeOperation = 'source-over';\n\n                const prismGrad = ctx.createLinearGradient(ix, iy, ix + iw, iy + ih);\n                prismGrad.addColorStop(0.00, 'rgba(253, 224, 71, 0.13)');\n                prismGrad.addColorStop(0.26, 'rgba(56, 189, 248, 0.19)');\n                prismGrad.addColorStop(0.50, 'rgba(168, 85, 247, 0.21)');\n                prismGrad.addColorStop(0.76, 'rgba(236, 72, 153, 0.18)');\n                prismGrad.addColorStop(1.00, 'rgba(253, 224, 71, 0.13)');\n                ctx.fillStyle = prismGrad;\n                ctx.fillRect(ix, iy, iw, ih);\n\n                // Garis diagonal mikro-foil (-45 deg) dinaikkan tipis\n                const stripeCanvas = document.createElement('canvas');\n                stripeCanvas.width = 14;\n                stripeCanvas.height = 14;\n                const sCtx = stripeCanvas.getContext('2d');\n                sCtx.strokeStyle = 'rgba(255, 255, 255, 0.21)';\n                sCtx.lineWidth = 1.7;\n                sCtx.beginPath();\n                sCtx.moveTo(-3.5, 10.5);\n                sCtx.lineTo(10.5, -3.5);\n                sCtx.moveTo(3.5, 17.5);\n                sCtx.lineTo(17.5, 3.5);\n                sCtx.stroke();\n                const stripePat = ctx.createPattern(stripeCanvas, 'repeat');\n                if (stripePat) {\n                    ctx.fillStyle = stripePat;\n                    ctx.fillRect(ix, iy, iw, ih);\n                }\n\n                ctx.restore();\n            }\n\n            // Kilau holografik diagonal terarah (naik tipis-tipis agar lebih bercahaya tanpa menyilaukan wajah)\n            ctx.save();\n            ctx.globalCompositeOperation = 'screen';\n            const holoSheen = ctx.createLinearGradient(ix + iw * 0.06, iy, ix + iw * 0.94, iy + ih);\n            holoSheen.addColorStop(0.00, 'rgba(255, 255, 255, 0.00)');\n            holoSheen.addColorStop(0.28, 'rgba(56, 189, 248, 0.09)');\n            holoSheen.addColorStop(0.44, 'rgba(255, 255, 255, 0.10)');\n            holoSheen.addColorStop(0.54, isManga ? 'rgba(253, 224, 71, 0.18)' : 'rgba(255, 255, 255, 0.15)');\n            holoSheen.addColorStop(0.72, 'rgba(236, 72, 153, 0.10)');\n            holoSheen.addColorStop(1.00, 'rgba(255, 255, 255, 0.00)');\n            ctx.fillStyle = holoSheen;\n            ctx.fillRect(ix, iy, iw, ih);\n            ctx.restore();\n        }\n\n        async function captureOwnedCardBlob() {\n            const card = activeInspectCard;\n            if (!card) return null;\n\n            // Resolusi cetak/ekspor HD tajam (720 x 1051, rasio presis 2.5 : 3.65)\n            const W = 720;\n            const H = 1051;\n            const canvas = document.createElement('canvas');\n            canvas.width = W;\n            canvas.height = H;\n            const ctx = canvas.getContext('2d');\n\n            const cfg = RARITY_CONFIG[card.rarity] || RARITY_CONFIG.rare;\n            const el = ELEMENT_CONFIG[card.elementKey] || ELEMENT_CONFIG.api;\n            const isManga = card.visualStyle === 'manga';\n            const isMono = isManga && (card.monoBorder !== false);\n            const hasFoil = isManga ? (card.mangaFoil !== false) : (card.rarity === 'epic' || card.rarity === 'legendary');\n\n            // 1. Outer Border Gradient (radius 48px)\n            const outerGrad = ctx.createLinearGradient(0, 0, W, H);\n            if (isMono) {\n                outerGrad.addColorStop(0.0, '#ffffff');\n                outerGrad.addColorStop(0.25, '#fde047');\n                outerGrad.addColorStop(0.55, '#52525b');\n                outerGrad.addColorStop(0.8, '#09090b');\n                outerGrad.addColorStop(1.0, '#ffffff');\n            } else {\n                const stops = cfg.svgStops || ['#38bdf8', '#c084fc', '#38bdf8'];\n                outerGrad.addColorStop(0.0, stops[0]);\n                outerGrad.addColorStop(0.5, stops[1]);\n                outerGrad.addColorStop(1.0, stops[2]);\n            }\n\n            ctx.save();\n            drawRoundRectPath(ctx, 0, 0, W, H, 48);\n            ctx.fillStyle = outerGrad;\n            ctx.fill();\n\n            // 2. Inner Card Clip (inset 12px -\u003e radius 38px)\n            const pad = 12;\n            const ix = pad, iy = pad, iw = W - pad * 2, ih = H - pad * 2;\n            drawRoundRectPath(ctx, ix, iy, iw, ih, 38);\n            ctx.clip();\n\n            ctx.fillStyle = '#ffffff';\n            ctx.fillRect(ix, iy, iw, ih);\n\n            // 3. Gambar Karakter dengan object-cover, zoom, posY, dan filter Manga\n            const img = await loadImgForCanvas(card.imageSrc);\n            if (img && img.naturalWidth \u003e 0 && img.naturalHeight \u003e 0) {\n                const zoomScale = (card.zoom || 100) / 100;\n                const posYRatio = (card.posY ?? 50) / 100;\n\n                const imgAspect = img.naturalWidth / img.naturalHeight;\n                const boxAspect = iw / ih;\n                let baseW, baseH;\n                if (imgAspect \u003e boxAspect) {\n                    baseH = ih;\n                    baseW = ih * imgAspect;\n                } else {\n                    baseW = iw;\n                    baseH = iw / imgAspect;\n                }\n\n                const drawW = baseW * zoomScale;\n                const drawH = baseH * zoomScale;\n                const drawX = ix + (iw - drawW) / 2;\n                const overflowY = drawH - ih;\n                const drawY = iy - overflowY * posYRatio;\n\n                ctx.save();\n                if (isManga) {\n                    const contrastVal = card.inkContrast || 165;\n                    ctx.filter = `grayscale(100%) contrast(${contrastVal}%) brightness(106%)`;\n                } else {\n                    ctx.filter = 'none';\n                }\n                ctx.drawImage(img, drawX, drawY, drawW, drawH);\n                ctx.restore();\n            }\n\n            // 4. Layer Efek Manga (Screentone & Speedlines)\n            if (isManga) {\n                if (card.screentone !== false) {\n                    const stCanvas = document.createElement('canvas');\n                    stCanvas.width = 8;\n                    stCanvas.height = 8;\n                    const stCtx = stCanvas.getContext('2d');\n                    stCtx.fillStyle = 'rgba(0, 0, 0, 0.42)';\n                    stCtx.beginPath();\n                    stCtx.arc(4, 4, 2.3, 0, Math.PI * 2);\n                    stCtx.fill();\n                    const pat = ctx.createPattern(stCanvas, 'repeat');\n                    if (pat) {\n                        ctx.save();\n                        ctx.globalAlpha = 0.58;\n                        ctx.fillStyle = pat;\n                        ctx.fillRect(ix, iy, iw, ih);\n                        ctx.restore();\n                    }\n                }\n\n                if (card.speedlines !== false) {\n                    ctx.save();\n                    ctx.globalAlpha = 0.72;\n                    ctx.fillStyle = '#090b10';\n                    const cx = 360, cy = 460, totalLines = 72;\n                    for (let i = 0; i \u003c totalLines; i++) {\n                        const angle = (i / totalLines) * Math.PI * 2;\n                        const innerR = 270 + (i % 4) * 28;\n                        const outerR = 680;\n                        const spread = 0.014 + (i % 3) * 0.005;\n                        ctx.beginPath();\n                        ctx.moveTo(cx + Math.cos(angle) * innerR, cy + Math.sin(angle) * innerR);\n                        ctx.lineTo(cx + Math.cos(angle - spread) * outerR, cy + Math.sin(angle - spread) * outerR);\n                        ctx.lineTo(cx + Math.cos(angle + spread) * outerR, cy + Math.sin(angle + spread) * outerR);\n                        ctx.closePath();\n                        ctx.fill();\n                    }\n                    ctx.restore();\n                }\n\n                // Inner dark vignette dibuat lebih ringan agar kartu tidak terlalu gelap\n                ctx.save();\n                const edgeGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.38, W / 2, H / 2, W * 0.85);\n                edgeGrad.addColorStop(0, 'rgba(0,0,0,0)');\n                edgeGrad.addColorStop(0.65, 'rgba(0,0,0,0.12)');\n                edgeGrad.addColorStop(1, 'rgba(0,0,0,0.34)');\n                ctx.fillStyle = edgeGrad;\n                ctx.fillRect(ix, iy, iw, ih);\n                ctx.restore();\n            }\n\n            // 5. Gradient Vignette Atas (multi-stop panjang agar transisi sangat halus/smooth) & Bawah\n            const topGradH = 340;\n            const topGrad = ctx.createLinearGradient(0, iy, 0, iy + topGradH);\n            topGrad.addColorStop(0.00, 'rgba(0,0,0,0.24)');\n            topGrad.addColorStop(0.35, 'rgba(0,0,0,0.11)');\n            topGrad.addColorStop(0.68, 'rgba(0,0,0,0.03)');\n            topGrad.addColorStop(1.00, 'rgba(0,0,0,0.00)');\n            ctx.fillStyle = topGrad;\n            ctx.fillRect(ix, iy, iw, topGradH);\n\n            const botStart = iy + ih * 0.42;\n            const botGrad = ctx.createLinearGradient(0, botStart, 0, iy + ih);\n            botGrad.addColorStop(0, 'rgba(9,11,16,0)');\n            botGrad.addColorStop(0.35, 'rgba(9,11,16,0.88)');\n            botGrad.addColorStop(1, 'rgba(9,11,16,0.98)');\n            ctx.fillStyle = botGrad;\n            ctx.fillRect(ix, botStart, iw, iy + ih - botStart);\n\n            // 6. Efek Foil & Holografik (di atas gambar & vignette, di bawah teks agar teks tetap kontras & tajam)\n            drawHolographicAndFoilLayers(ctx, ix, iy, iw, ih, isManga, hasFoil);\n\n            // 7. SVG Chamfered Inner Frame\n            ctx.save();\n            const frameGrad = ctx.createLinearGradient(ix, iy, ix + iw, iy + ih);\n            if (isMono) {\n                frameGrad.addColorStop(0, '#ffffff');\n                frameGrad.addColorStop(0.5, '#fde047');\n                frameGrad.addColorStop(1, '#ffffff');\n            } else {\n                const s = cfg.svgStops || ['#38bdf8', '#c084fc', '#38bdf8'];\n                frameGrad.addColorStop(0, s[0]);\n                frameGrad.addColorStop(0.5, s[1]);\n                frameGrad.addColorStop(1, s[2]);\n            }\n            drawChamferFramePath(ctx, ix, iy, iw, ih);\n            ctx.strokeStyle = frameGrad;\n            ctx.lineWidth = 3.5;\n            ctx.stroke();\n            ctx.restore();\n\n            // 8. Baris Atas: Pill Tag Kiri & Pill Bintang Kanan (Digambar dengan vektor bintang presisi)\n            const badgeBorderColor = isMono ? 'rgba(253, 224, 71, 0.85)' : cfg.badgeBorder;\n            const starClr = isMono ? '#fde047' : cfg.starColor;\n            const topRowY = iy + 36;\n            const pillH = 54;\n\n            // Tag Kiri\n            const tagText = badgeLabel(card.tag).toUpperCase();\n            ctx.save();\n            ctx.font = '800 21px Inter, sans-serif';\n            const tagW = Math.max(112, Math.ceil(ctx.measureText(tagText).width) + 52);\n            const tagX = ix + 34;\n            const tagY = topRowY;\n            drawRoundRectPath(ctx, tagX, tagY, tagW, pillH, pillH / 2);\n            ctx.fillStyle = 'rgba(17, 21, 34, 0.92)';\n            ctx.fill();\n            ctx.strokeStyle = badgeBorderColor;\n            ctx.lineWidth = 2.5;\n            ctx.stroke();\n\n            ctx.fillStyle = '#ffffff';\n            ctx.textAlign = 'center';\n            ctx.textBaseline = 'middle';\n            ctx.fillText(tagText, tagX + tagW / 2, tagY + pillH / 2 + 0.5);\n            ctx.restore();\n\n            // Bintang Kanan (menggambar bentuk bintang 5-sudut yang seragam & simetris)\n            const starCount = Math.max(1, Math.min(5, cfg.stars || 3));\n            const starSpacing = 26;\n            const starOuterR = 10.5;\n            const starInnerR = 4.6;\n            const starsGroupW = (starCount - 1) * starSpacing + starOuterR * 2;\n            const starBoxW = Math.max(116, starsGroupW + 40);\n            const starBoxX = ix + iw - 34 - starBoxW;\n            const starBoxY = topRowY;\n\n            ctx.save();\n            drawRoundRectPath(ctx, starBoxX, starBoxY, starBoxW, pillH, pillH / 2);\n            ctx.fillStyle = 'rgba(17, 21, 34, 0.92)';\n            ctx.fill();\n            ctx.strokeStyle = badgeBorderColor;\n            ctx.lineWidth = 2.5;\n            ctx.stroke();\n\n            const firstStarCx = starBoxX + (starBoxW - starsGroupW) / 2 + starOuterR;\n            const starCy = starBoxY + pillH / 2;\n            for (let sIdx = 0; sIdx \u003c starCount; sIdx++) {\n                drawStarGlyph(ctx, firstStarCx + sIdx * starSpacing, starCy, starOuterR, starInnerR, starClr, starClr);\n            }\n            ctx.restore();\n\n            // 9. Area Bawah: Perhitungan Koordinat Vertikal dari Bawah ke Atas agar Jarak & Perataan Rapi\n            const sidePad = 38;\n            const contentX = ix + sidePad;\n            const contentW = iw - sidePad * 2;\n            const rightEdgeX = ix + iw - sidePad;\n            const cardBottomEdge = iy + ih - 34;\n\n            // A. Footer paling bawah\n            const footerH = 44;\n            const footerCenterY = cardBottomEdge - footerH / 2;\n            const rarityLabel = isManga ? `Manga ${cfg.name}` : cfg.name;\n            const rarityTextClr = isMono ? '#fde047' : cfg.textColor;\n            const editionStr = card.edition || 'Foto 1/1';\n            const cardNoText = card.cardNo || 'No. 001';\n\n            // Badge Nomor Kartu di kanan bawah\n            ctx.save();\n            ctx.font = '700 19px Inter, sans-serif';\n            const noW = Math.max(106, Math.ceil(ctx.measureText(cardNoText).width) + 34);\n            const noX = rightEdgeX - noW;\n            const noY = footerCenterY - footerH / 2;\n            drawRoundRectPath(ctx, noX, noY, noW, footerH, footerH / 2);\n            ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';\n            ctx.fill();\n            ctx.strokeStyle = badgeBorderColor;\n            ctx.lineWidth = 2.2;\n            ctx.stroke();\n\n            ctx.fillStyle = '#ffffff';\n            ctx.textAlign = 'center';\n            ctx.textBaseline = 'middle';\n            ctx.fillText(cardNoText, noX + noW / 2, footerCenterY + 0.5);\n            ctx.restore();\n\n            // Teks Rarity • Edisi di kiri bawah (dibatasi agar tidak menabrak badge nomor)\n            const maxFooterTextW = (noX - 16) - contentX;\n            ctx.save();\n            ctx.font = '700 20px Inter, sans-serif';\n            ctx.textAlign = 'left';\n            ctx.textBaseline = 'middle';\n\n            const sepText = '  •  ';\n            const wRarity = ctx.measureText(rarityLabel).width;\n            const wSep = ctx.measureText(sepText).width;\n            const wEd = ctx.measureText(editionStr).width;\n\n            let curX = contentX;\n            ctx.fillStyle = rarityTextClr;\n            if (wRarity + wSep + wEd \u003c= maxFooterTextW) {\n                ctx.fillText(rarityLabel, curX, footerCenterY + 0.5);\n                curX += wRarity;\n                ctx.fillStyle = '#64748b';\n                ctx.fillText(sepText, curX, footerCenterY + 0.5);\n                curX += wSep;\n                ctx.fillStyle = '#cbd5e1';\n                ctx.fillText(editionStr, curX, footerCenterY + 0.5);\n            } else {\n                const combinedFooter = `${rarityLabel} • ${editionStr}`;\n                ctx.fillText(combinedFooter, curX, footerCenterY + 0.5, maxFooterTextW);\n            }\n            ctx.restore();\n\n            // B. Divider Line tepat di atas footer\n            const divY = footerCenterY - footerH / 2 - 18;\n            ctx.save();\n            const divGrad = ctx.createLinearGradient(contentX, divY, rightEdgeX, divY);\n            if (isMono) {\n                divGrad.addColorStop(0.0, '#ffffff');\n                divGrad.addColorStop(0.35, '#fde047');\n                divGrad.addColorStop(0.7, '#71717a');\n                divGrad.addColorStop(1.0, '#ffffff');\n            } else {\n                divGrad.addColorStop(0, cfg.svgStops?.[0] || '#38bdf8');\n                divGrad.addColorStop(0.5, cfg.svgStops?.[1] || '#a855f7');\n                divGrad.addColorStop(1, '#ec4899');\n            }\n            drawRoundRectPath(ctx, contentX, divY, contentW, 4, 2);\n            ctx.fillStyle = divGrad;\n            ctx.fill();\n            ctx.restore();\n\n            // C. Stats Grid (HP, MP, ATT, DEF) di atas divider\n            const statBoxH = 98;\n            const statBoxY = divY - 18 - statBoxH;\n            ctx.save();\n            drawRoundRectPath(ctx, contentX, statBoxY, contentW, statBoxH, 22);\n            ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';\n            ctx.fill();\n            ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';\n            ctx.lineWidth = 2;\n            ctx.stroke();\n\n            const statsData = [\n                { label: 'HP', val: String(card.hp ?? 0), color: '#34d399' },\n                { label: 'MP', val: String(card.mp ?? 0), color: '#38bdf8' },\n                { label: 'ATT', val: String(card.att ?? 0), color: '#fb7185' },\n                { label: 'DEF', val: String(card.def ?? 0), color: '#fbbf24' }\n            ];\n            const colW = contentW / 4;\n            statsData.forEach((st, idx) =\u003e {\n                const colCenterX = contentX + colW * idx + colW / 2;\n                if (idx \u003e 0) {\n                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';\n                    ctx.lineWidth = 1.5;\n                    ctx.beginPath();\n                    ctx.moveTo(contentX + colW * idx, statBoxY + 18);\n                    ctx.lineTo(contentX + colW * idx, statBoxY + statBoxH - 18);\n                    ctx.stroke();\n                }\n                ctx.textAlign = 'center';\n                ctx.textBaseline = 'middle';\n                ctx.font = '700 17px Inter, sans-serif';\n                ctx.fillStyle = st.color;\n                ctx.fillText(st.label, colCenterX, statBoxY + 31);\n\n                ctx.font = '700 28px Rajdhani, Orbitron, sans-serif';\n                ctx.fillStyle = '#ffffff';\n                ctx.fillText(st.val, colCenterX, statBoxY + 67);\n            });\n            ctx.restore();\n\n            // D. Nama Karakter Besar rata kiri di atas Stats Grid\n            const nameCenterY = statBoxY - 36;\n            ctx.save();\n            ctx.font = '800 50px Inter, sans-serif';\n            ctx.textAlign = 'left';\n            ctx.textBaseline = 'middle';\n            ctx.fillStyle = '#ffffff';\n            ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';\n            ctx.shadowBlur = 12;\n            ctx.fillText(card.name || 'Karakter', contentX, nameCenterY, contentW);\n            ctx.restore();\n\n            // E. Subname (kiri) & Element Badge (kanan) sejajar horizontal rapi di atas Nama Karakter\n            const subCenterY = nameCenterY - 48;\n            const elText = `${el.icon} ${el.label}`;\n            ctx.save();\n            ctx.font = '700 18px Inter, sans-serif';\n            const elPillW = Math.max(96, Math.ceil(ctx.measureText(elText).width) + 32);\n            const elPillH = 38;\n            const elPillX = rightEdgeX - elPillW;\n            const elPillY = subCenterY - elPillH / 2;\n\n            drawRoundRectPath(ctx, elPillX, elPillY, elPillW, elPillH, elPillH / 2);\n            ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';\n            ctx.fill();\n            ctx.strokeStyle = isMono ? 'rgba(253, 224, 71, 0.72)' : 'rgba(251, 146, 60, 0.72)';\n            ctx.lineWidth = 2;\n            ctx.stroke();\n\n            ctx.fillStyle = isMono ? '#fde047' : '#fdba74';\n            ctx.textAlign = 'center';\n            ctx.textBaseline = 'middle';\n            ctx.fillText(elText, elPillX + elPillW / 2, subCenterY + 0.5);\n\n            // Subname kiri dengan batas lebar aman sebelum badge elemen\n            const subText = (card.subname || '').toUpperCase();\n            const maxSubW = Math.max(80, (elPillX - 16) - contentX);\n            ctx.font = '700 20px Inter, sans-serif';\n            ctx.textAlign = 'left';\n            ctx.textBaseline = 'middle';\n            ctx.fillStyle = isMono ? '#fde68a' : '#67e8f9';\n            ctx.fillText(subText, contentX, subCenterY + 0.5, maxSubW);\n            ctx.restore();\n\n            ctx.restore();\n\n            const dataUrl = canvas.toDataURL('image/png');\n            return new Promise(resolve =\u003e canvas.toBlob(blob =\u003e resolve({ blob, dataUrl }), 'image/png'));\n        }\n\n        // Fitur Bagikan Kartu yang Sudah Didapat (Web Share API + Fallback Unduh)\n        document.getElementById('btnShareCard').addEventListener('click', async () =\u003e {\n            if (!activeInspectCard) return;\n            showToast('Menyiapkan gambar kartu untuk dibagikan...');\n            try {\n                const result = await captureOwnedCardBlob();\n                if (!result) return;\n\n                const safeName = (activeInspectCard.name || 'kartu').replace(/[^a-z0-9_-]/gi, '_').toLowerCase();\n                const file = new File([result.blob], `card_${safeName}.png`, { type: 'image/png' });\n                const shareText = `Lihat kartu ${activeInspectCard.name} (${RARITY_CONFIG[activeInspectCard.rarity]?.name || 'Rare'}) yang baru saya dapatkan di CardForge & Gacha Studio!`;\n\n                if (navigator.canShare && navigator.canShare({ files: [file] })) {\n                    await navigator.share({\n                        title: `Kartu Koleksi: ${activeInspectCard.name}`,\n                        text: shareText,\n                        files: [file]\n                    });\n                    showToast('Kartu berhasil dibagikan!');\n                } else {\n                    const link = document.createElement('a');\n                    link.download = `share_card_${safeName}.png`;\n                    link.href = result.dataUrl;\n                    link.click();\n                    if (navigator.clipboard) {\n                        await navigator.clipboard.writeText(shareText).catch(() =\u003e {});\n                    }\n                    showToast('Gambar kartu diunduh & teks info disalin untuk dibagikan!');\n                }\n            } catch (err) {\n                if (err.name !== 'AbortError') {\n                    showToast('Gagal membagikan gambar kartu.');\n                }\n            }\n        });\n\n        document.getElementById('btnDownloadOwnedCard').addEventListener('click', async () =\u003e {\n            if (!activeInspectCard) return;\n            showToast('Menyimpan PNG kartu koleksi...');\n            try {\n                const result = await captureOwnedCardBlob();\n                if (!result) return;\n                const safeName = (activeInspectCard.name || 'kartu').replace(/[^a-z0-9_-]/gi, '_').toLowerCase();\n                const link = document.createElement('a');\n                link.download = `koleksi_${safeName}.png`;\n                link.href = result.dataUrl;\n                link.click();\n                showToast('Kartu berhasil disimpan sebagai PNG!');\n            } catch (err) {\n                showToast('Gagal menyimpan gambar kartu.');\n            }\n        });\n\n        // =============================================================\n        // PENGATURAN RATE & POOL (ADMIN)\n        // =============================================================\n        const rateKeys = ['common', 'uncommon', 'rare', 'epic', 'legendary'];\n        rateKeys.forEach(k =\u003e {\n            const cap = k[0].toUpperCase() + k.slice(1);\n            const rng = document.getElementById(`rng${cap}`);\n            const lbl = document.getElementById(`lbl${cap}`);\n            rng.addEventListener('input', () =\u003e {\n                lbl.textContent = `${rng.value}%`;\n                const sum = rateKeys.reduce((acc, key) =\u003e acc + Number(document.getElementById(`rng${key[0].toUpperCase() + key.slice(1)}`).value), 0);\n                document.getElementById('rateSumBadge').textContent = `Total: ${sum}%`;\n            });\n        });\n\n        document.getElementById('btnSaveRates').addEventListener('click', () =\u003e {\n            const vals = {};\n            let sum = 0;\n            rateKeys.forEach(k =\u003e {\n                vals[k] = Number(document.getElementById(`rng${k[0].toUpperCase() + k.slice(1)}`).value);\n                sum += vals[k];\n            });\n            if (sum !== 100) { showToast(`Total rate harus 100% (sekarang ${sum}%)`); return; }\n            gameState.rates = vals;\n            renderRateBadges();\n            showToast('Rate Gacha disimpan!');\n        });\n\n        function renderRateBadges() {\n            const r = gameState.rates;\n            document.getElementById('gachaRateBadges').innerHTML = `\n                \u003cspan class=\"px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-700 text-slate-300\"\u003eCommon ${r.common}%\u003c/span\u003e\n                \u003cspan class=\"px-2.5 py-1 rounded-lg bg-emerald-950 border border-emerald-500/40 text-emerald-300\"\u003eUncommon ${r.uncommon}%\u003c/span\u003e\n                \u003cspan class=\"px-2.5 py-1 rounded-lg bg-purple-950 border border-purple-500/40 text-purple-300\"\u003eRare ${r.rare}%\u003c/span\u003e\n                \u003cspan class=\"px-2.5 py-1 rounded-lg bg-pink-950 border border-pink-500/40 text-pink-300\"\u003eEpic ${r.epic}%\u003c/span\u003e\n                \u003cspan class=\"px-2.5 py-1 rounded-lg bg-amber-950 border border-amber-400/50 text-amber-300\"\u003eLegendary ${r.legendary}%\u003c/span\u003e\n            `;\n        }\n\n        function renderAdminPool() {\n            document.getElementById('adminPoolCount').textContent = gachaPool.length;\n            const list = document.getElementById('adminPoolList');\n            list.innerHTML = '';\n            gachaPool.forEach(c =\u003e {\n                const wrap = document.createElement('div');\n                wrap.className = 'flex flex-col items-center gap-2';\n                wrap.appendChild(buildUnifiedCardElement(c, { sizeClass: 'w-44 sm:w-48', enable3DTilt: true }));\n                const row = document.createElement('div');\n                row.className = 'flex gap-2';\n                const bEdit = document.createElement('button');\n                bEdit.type = 'button';\n                bEdit.className = 'px-3 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-[11px] font-bold cursor-pointer';\n                bEdit.textContent = '✏️ Edit';\n                bEdit.addEventListener('click', () =\u003e loadCardIntoEditor(c));\n                const bDel = document.createElement('button');\n                bDel.type = 'button';\n                bDel.className = 'px-3 py-1.5 rounded-lg bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-500/40 text-[11px] font-bold cursor-pointer';\n                bDel.textContent = '🗑️ Hapus';\n                let armed = false;\n                bDel.addEventListener('click', () =\u003e {\n                    if (gachaPool.length \u003c= LOADOUT_SIZE) { showToast(`Pool minimal ${LOADOUT_SIZE} kartu agar Loadout bisa disusun!`); return; }\n                    if (!armed) {\n                        armed = true; bDel.textContent = 'Yakin?';\n                        setTimeout(() =\u003e { armed = false; bDel.textContent = '🗑️ Hapus'; }, 2500);\n                        return;\n                    }\n                    gachaPool = gachaPool.filter(x =\u003e x.id !== c.id);\n                    gameState.binder = gameState.binder.filter(x =\u003e x.id !== c.id);\n                    if (editingId === c.id) { editingId = null; refreshEditBanner(); }\n                    renderAdminPool(); updateCounts();\n                    showToast(`\"${c.name}\" dihapus dari pool`);\n                });\n                row.append(bEdit, bDel);\n                wrap.appendChild(row);\n                list.appendChild(wrap);\n            });\n        }\n\n        document.getElementById('btnResetPool').addEventListener('click', () =\u003e {\n            gachaPool = JSON.parse(JSON.stringify(DEFAULT_POOL));\n            renderAdminPool();\n            updateCounts();\n            showToast('Pool Gacha direset ke bawaan');\n        });\n\n        // Background Particles\n        const canvas = document.getElementById('bg-canvas');\n        const ctx = canvas.getContext('2d');\n        function resizeBg() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }\n        window.addEventListener('resize', resizeBg);\n        resizeBg();\n        const dots = Array.from({ length: 30 }, () =\u003e ({\n            x: Math.random() * canvas.width,\n            y: Math.random() * canvas.height,\n            r: Math.random() * 2 + 0.5,\n            vx: (Math.random() - 0.5) * 0.35,\n            vy: (Math.random() - 0.5) * 0.35,\n            color: ['#38bdf8', '#a855f7', '#ec4899', '#fbbf24'][Math.floor(Math.random() * 4)]\n        }));\n        (function drawDots() {\n            ctx.clearRect(0, 0, canvas.width, canvas.height);\n            dots.forEach(d =\u003e {\n                d.x = (d.x + d.vx + canvas.width) % canvas.width;\n                d.y = (d.y + d.vy + canvas.height) % canvas.height;\n                ctx.globalAlpha = 0.45;\n                ctx.fillStyle = d.color;\n                ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();\n            });\n            requestAnimationFrame(drawDots);\n        })();\n\n        // Inisialisasi Awal\n        setRarity('rare');\n        updateElement();\n        updateStatRange();\n        updateCounts();\n        renderRateBadges();\n        applyRoleUI();\n\n        // ===== API untuk Chess Royale (dipanggil dari halaman induk) =====\n        window.CFAPI = {\n            getBinder: () =\u003e gameState.binder.map(c =\u003e ({ ...c })),\n            getPool: () =\u003e gachaPool.map(c =\u003e ({ ...c })),\n            getGems: () =\u003e gameState.gems,\n            addGems: (n, reason) =\u003e {\n                gameState.gems += n;\n                updateCounts();\n                showToast(`+${n.toLocaleString()} Poin Gacha${reason ? ' • ' + reason : ''}`);\n            }\n        };\n    \u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n",chess:"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"id\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"UTF-8\" /\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" /\u003e\n  \u003ctitle\u003eCard Chess: Squad Royale (2v2v2v2)\u003c/title\u003e\n  \u003cscript src=\"https://cdn.tailwindcss.com/3.4.17\"\u003e\u003c/script\u003e\n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n  \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap\" rel=\"stylesheet\"\u003e\n  \u003cstyle\u003e\n    :root {\n      --bg-app: #080c14;\n      --card-bg: #111827;\n      --card-border: #1f293d;\n      --accent-gold: #f59e0b;\n    }\n\n    body {\n      font-family: 'Plus Jakarta Sans', sans-serif;\n      background-color: var(--bg-app);\n      color: #f3f4f6;\n      overflow-x: hidden;\n      user-select: none;\n    }\n\n    .font-display {\n      font-family: 'Outfit', sans-serif;\n    }\n\n    ::-webkit-scrollbar {\n      width: 5px;\n      height: 5px;\n    }\n    ::-webkit-scrollbar-track {\n      background: #0b1120;\n    }\n    ::-webkit-scrollbar-thumb {\n      background: #374151;\n      border-radius: 9999px;\n    }\n\n    .game-card {\n      transition: transform 0.15s ease, box-shadow 0.15s ease;\n      cursor: grab;\n    }\n    .game-card:active {\n      cursor: grabbing;\n    }\n    .game-card:hover {\n      transform: translateY(-2px);\n      z-index: 20;\n    }\n\n    @keyframes flashHit {\n      0%, 100% { filter: brightness(1); }\n      50% { filter: brightness(2.4) saturate(2); transform: scale(0.94); }\n    }\n    @keyframes mergePop {\n      0% { transform: scale(0.7); filter: brightness(2); }\n      70% { transform: scale(1.1); }\n      100% { transform: scale(1); filter: brightness(1); }\n    }\n    @keyframes floatUp {\n      0% { opacity: 1; transform: translateY(0) scale(0.8); }\n      40% { opacity: 1; transform: translateY(-18px) scale(1.1); }\n      100% { opacity: 0; transform: translateY(-36px) scale(0.9); }\n    }\n\n    .anim-hit { animation: flashHit 0.25s ease-in-out; }\n    .anim-merge { animation: mergePop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }\n\n    .floating-text {\n      position: absolute;\n      top: 15%;\n      left: 50%;\n      transform: translateX(-50%);\n      pointer-events: none;\n      font-weight: 800;\n      font-size: 11px;\n      text-shadow: 0 1px 3px rgba(0,0,0,0.9);\n      animation: floatUp 0.8s ease-out forwards;\n      z-index: 60;\n      white-space: nowrap;\n    }\n\n    .board-slot {\n      background: #0d1322;\n      border: 1px dashed #22304a;\n      transition: all 0.15s ease;\n    }\n    .board-slot.drag-over, .board-slot.valid-target:hover {\n      border-color: #f59e0b;\n      background: rgba(245, 158, 11, 0.1);\n    }\n\n    @keyframes mythicPulse {\n      0%, 100% { box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); border-color: #fbbf24; }\n      50% { box-shadow: 0 0 24px rgba(239, 68, 68, 0.75); border-color: #f87171; }\n    }\n    .mythic-10-badge {\n      animation: mythicPulse 1.6s infinite ease-in-out;\n    }\n\n    .tier-1 { border-color: #4b5563; }\n    .tier-2 { border-color: #059669; }\n    .tier-3 { border-color: #2563eb; }\n    .tier-4 { border-color: #7c3aed; }\n    .tier-5 { border-color: #d97706; box-shadow: 0 0 10px rgba(217, 119, 6, 0.25); }\n\n    /* Bingkai berdasarkan pemilik kartu */\n    .game-card.owner-me { border-width: 2px; border-color: #38bdf8; background: linear-gradient(160deg, rgba(14,70,110,0.55), rgba(15,23,42,0.95)); box-shadow: 0 0 0 1px #fbbf24, 0 0 8px rgba(56,189,248,0.35); }\n    .game-card.owner-partner { border-width: 2px; border-color: #14b8a6; background: linear-gradient(160deg, rgba(13,100,92,0.55), rgba(15,23,42,0.95)); box-shadow: 0 0 8px rgba(20,184,166,0.4); }\n    .game-card.owner-enemy { border-width: 2px; border-color: #ef4444; background: linear-gradient(160deg, rgba(127,29,29,0.6), rgba(15,23,42,0.95)); box-shadow: 0 0 8px rgba(239,68,68,0.45); }\n    .tier-dot-1 { color:#9ca3af } .tier-dot-2 { color:#34d399 } .tier-dot-3 { color:#60a5fa } .tier-dot-4 { color:#a78bfa } .tier-dot-5 { color:#fbbf24 }\n    #attack-layer { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 45; }\n    .atk-line { stroke: #ef4444; stroke-width: 2.5; stroke-linecap: round; filter: drop-shadow(0 0 4px #ef4444); animation: atkFade 0.6s ease-out forwards; }\n    @keyframes atkFade { 0% { opacity: 1; } 100% { opacity: 0; } }\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody class=\"min-h-screen flex flex-col bg-[#080c14]\"\u003e\n\n  \u003c!-- MAIN MENU SCREEN --\u003e\n  \u003cdiv id=\"screen-menu\" class=\"fixed inset-0 bg-[#080c14] z-50 flex items-center justify-center p-4\"\u003e\n    \u003cdiv class=\"max-w-md w-full bg-[#111827] border border-slate-800 rounded-3xl p-8 shadow-2xl text-center space-y-6\"\u003e\n      \u003cdiv class=\"w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center shadow-lg text-3xl\"\u003e\n        👑\n      \u003c/div\u003e\n      \u003cdiv\u003e\n        \u003ch1 class=\"font-display font-extrabold text-2xl text-amber-400 tracking-wide mb-1\"\u003eCARD CHESS ROYALE\u003c/h1\u003e\n        \u003cp class=\"text-xs text-slate-400\"\u003eVersi Kartu 2v2v2v2 • Auto-Battler • 10 Sinergi Mythic\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"space-y-3\"\u003e\n        \u003cbutton id=\"btn-loadout\" onclick=\"openLoadout()\" class=\"w-full py-3 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-emerald-500/50 text-emerald-300 font-display font-extrabold text-sm tracking-wide transition\"\u003e\n          🎒 Loadout 10 Kartu (\u003cspan id=\"loadout-count\"\u003e0\u003c/span\u003e/10)\n        \u003c/button\u003e\n        \u003cp id=\"loadout-hint\" class=\"text-[11px] text-rose-300 leading-snug\"\u003e\u003c/p\u003e\n        \u003cbutton id=\"btn-mode-ai\" onclick=\"startGameMode('ai')\" class=\"w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-display font-extrabold text-sm tracking-wide shadow-lg shadow-orange-600/20 transition transform active:scale-98\"\u003e\n          🤖 Lawan AI (Solo vs 3 Tim AI)\n        \u003c/button\u003e\n        \u003cbutton id=\"btn-mode-online\" onclick=\"startGameMode('online')\" class=\"w-full py-3.5 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-300 font-display font-bold text-sm tracking-wide transition transform active:scale-98\"\u003e\n          🌐 Main Online (Mabar 2v2 Room)\n        \u003c/button\u003e\n        \u003cbutton onclick=\"openRosterGallery()\" class=\"w-full py-2.5 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-amber-500/40 text-amber-300 text-xs font-bold transition\"\u003e\n          📚 Lihat Roster & Sinergi\n        \u003c/button\u003e\n        \u003cbutton onclick=\"toggleSynergyGuide()\" class=\"w-full py-2.5 px-4 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 text-xs font-semibold transition\"\u003e\n          📖 Panduan Sinergi & Aturan\n        \u003c/button\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003c!-- ONLINE ROOM LOBBY SCREEN --\u003e\n  \u003cdiv id=\"screen-room\" class=\"fixed inset-0 bg-[#080c14] z-50 hidden items-center justify-center p-4 overflow-y-auto\"\u003e\n  \u003cdiv class=\"max-w-lg w-full bg-[#111827] border border-cyan-950/80 rounded-3xl p-6 shadow-2xl text-center space-y-4\"\u003e\n    \u003cdiv class=\"text-3xl\"\u003e🌐\u003c/div\u003e\n    \u003ch2 class=\"font-display font-bold text-lg text-cyan-300\"\u003eLobi Room Online (2v2v2v2)\u003c/h2\u003e\n    \u003cp class=\"text-xs text-slate-400\"\u003eBuat room baru atau masukkan kode room teman. Maksimal 8 pemain.\u003c/p\u003e\n    \u003cdiv class=\"grid grid-cols-1 sm:grid-cols-2 gap-2\"\u003e\n      \u003cinput id=\"cf-player-name\" maxlength=\"24\" placeholder=\"Nama pemain\" class=\"w-full rounded-xl bg-slate-900 border border-slate-700 p-3 text-sm text-white outline-none focus:border-cyan-400\" /\u003e\n      \u003cinput id=\"cf-room-code\" maxlength=\"6\" placeholder=\"KODE ROOM\" class=\"w-full rounded-xl bg-slate-900 border border-slate-700 p-3 text-sm font-mono uppercase tracking-widest text-white outline-none focus:border-cyan-400\" /\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"grid grid-cols-2 gap-2\"\u003e\n      \u003cbutton onclick=\"cfCreateRoom()\" class=\"py-3 rounded-xl bg-cyan-700 hover:bg-cyan-600 text-white text-xs font-bold\"\u003e＋ Buat Room\u003c/button\u003e\n      \u003cbutton onclick=\"cfJoinRoom()\" class=\"py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold\"\u003eGabung Room\u003c/button\u003e\n    \u003c/div\u003e\n    \u003cdiv id=\"cf-room-panel\" class=\"hidden bg-slate-900 border border-slate-800 rounded-2xl p-4 text-left space-y-3\"\u003e\n      \u003cdiv class=\"flex justify-between items-center\"\u003e\u003cspan class=\"text-xs text-slate-400\"\u003eKode undangan\u003c/span\u003e\u003cspan id=\"cf-room-code-label\" class=\"font-mono text-xl font-black text-amber-400\"\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv id=\"cf-room-status\" class=\"text-xs text-cyan-300\"\u003eMenunggu pemain…\u003c/div\u003e\n      \u003cdiv id=\"cf-room-players\" class=\"grid grid-cols-2 gap-2\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"grid grid-cols-2 gap-2\"\u003e\n        \u003cbutton id=\"cf-ready-btn\" onclick=\"cfToggleReady()\" class=\"py-3 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold\"\u003e✓ Saya Siap\u003c/button\u003e\n        \u003cbutton id=\"cf-start-btn\" onclick=\"cfStartRoom()\" class=\"py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold\"\u003eMulai Room\u003c/button\u003e\n      \u003c/div\u003e\n      \u003cp class=\"text-[10px] text-slate-500\"\u003eLobby dan status kesiapan tersimpan online. Sinkronisasi aksi dan simulasi pertarungan antar-8 klien masih memerlukan tahap integrasi gameplay.\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv id=\"cf-room-error\" class=\"text-xs text-rose-300 min-h-4\"\u003e\u003c/div\u003e\n    \u003cbutton onclick=\"cfLeaveRoom()\" class=\"w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold\"\u003eKeluar / Kembali\u003c/button\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n\u003c!-- TOP HEADER --\u003e\n  \u003cheader class=\"bg-[#0b101c] border-b border-slate-800/80 px-4 py-2.5 sticky top-0 z-30 shadow-md\"\u003e\n    \u003cdiv class=\"max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3\"\u003e\n      \u003cdiv class=\"flex items-center gap-3\"\u003e\n        \u003cdiv class=\"w-9 h-9 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center shadow-md font-display font-bold text-slate-950 text-base\"\u003e\n          👑\n        \u003c/div\u003e\n        \u003cdiv\u003e\n          \u003ch1 class=\"font-display font-bold text-sm sm:text-base tracking-wide text-amber-400 leading-none mb-1\"\u003e\n            CARD CHESS ROYALE\n          \u003c/h1\u003e\n          \u003cdiv class=\"flex items-center gap-2 text-xs text-slate-400 font-medium\"\u003e\n            \u003cspan id=\"round-badge\" class=\"bg-slate-800/90 text-amber-300 px-2 py-0.5 rounded-md font-semibold\"\u003eRonde 1\u003c/span\u003e\n            \u003cspan id=\"prep-timer\" class=\"hidden\"\u003e\u003c/span\u003e\n            \u003cspan id=\"phase-badge\" class=\"bg-emerald-950/80 text-emerald-400 border border-emerald-700/40 px-2 py-0.5 rounded-md font-semibold\"\u003eFase Persiapan\u003c/span\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003c!-- 4 Teams HP Scoreboard --\u003e\n      \u003cdiv id=\"teams-scoreboard\" class=\"grid grid-cols-2 sm:grid-cols-4 gap-2 flex-1 max-w-xl\"\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"flex items-center gap-2\"\u003e\n        \u003cbutton onclick=\"openRosterGallery()\" class=\"px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-amber-500/40 text-xs font-semibold text-amber-300 transition\"\u003e\n          📚 Lihat Roster & Sinergi\n        \u003c/button\u003e\n        \u003cbutton onclick=\"toggleSynergyGuide()\" class=\"px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition\"\u003e\n          📖 Panduan Sinergi\n        \u003c/button\u003e\n        \u003cbutton onclick=\"backToMenu()\" class=\"px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-rose-950/80 border border-slate-700 hover:border-rose-700 text-xs font-semibold text-slate-300 hover:text-rose-300 transition\"\u003e\n          🚪 Keluar\n        \u003c/button\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/header\u003e\n\n  \u003cdiv id=\"toast-container\" class=\"fixed top-20 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4\"\u003e\u003c/div\u003e\n\n  \u003c!-- MAIN CONTAINER --\u003e\n  \u003cmain class=\"flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 grid grid-cols-1 lg:grid-cols-12 gap-3.5\"\u003e\n\n    \u003c!-- LEFT SIDEBAR --\u003e\n    \u003caside class=\"lg:col-span-3 flex flex-col gap-3 order-2 lg:order-1\"\u003e\n      \u003cdiv class=\"bg-[#111827] border border-slate-800/80 rounded-2xl p-3.5 shadow-sm\"\u003e\n        \u003cdiv class=\"flex items-center justify-between mb-2.5\"\u003e\n          \u003ch2 class=\"text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5\"\u003e\n            \u003cspan\u003e⚡\u003c/span\u003e Sinergi Tim Aktif\n          \u003c/h2\u003e\n          \u003cspan id=\"board-cap-badge\" class=\"text-xs font-bold px-2 py-0.5 rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/20\"\u003e\n            0 / 3 Unit\n          \u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdiv id=\"synergy-list\" class=\"space-y-1.5 max-h-60 lg:max-h-[310px] overflow-y-auto pr-1\"\u003e\n          \u003cp class=\"text-xs text-slate-500 italic py-4 text-center\"\u003eTaruh kartu ke papan untuk mengaktifkan elemen & badge.\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"bg-[#111827] border border-cyan-950/60 rounded-2xl p-3.5 shadow-sm\"\u003e\n        \u003cdiv class=\"flex items-center justify-between mb-2\"\u003e\n          \u003cdiv class=\"flex items-center gap-2\"\u003e\n            \u003cspan class=\"w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse\"\u003e\u003c/span\u003e\n            \u003ch3 class=\"text-xs font-bold text-cyan-300 uppercase tracking-wider\"\u003eRekan Tim: AI Aria\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cspan id=\"partner-lvl-badge\" class=\"text-[11px] bg-slate-800 px-2 py-0.5 rounded text-slate-300\"\u003eLv. 1\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cp id=\"partner-synergy-summary\" class=\"text-xs text-slate-400 mb-3 leading-relaxed\"\u003eFokus Rekan: Menyusun formasi awal...\u003c/p\u003e\n        \u003cdiv class=\"grid grid-cols-2 gap-2\"\u003e\n          \u003cbutton id=\"btn-view-my-board\" onclick=\"switchBoardView('player')\" class=\"py-2 px-2 rounded-xl text-xs font-bold bg-cyan-600 text-white shadow transition\"\u003e🛡️ Papan Kamu\u003c/button\u003e\n          \u003cbutton id=\"btn-view-partner-board\" onclick=\"switchBoardView('partner')\" class=\"py-2 px-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition\"\u003e👁️ Intip Rekan\u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"bg-[#111827] border border-slate-800/80 rounded-2xl p-3.5 shadow-sm flex-1 flex flex-col min-h-[130px]\"\u003e\n        \u003ch3 class=\"text-xs font-bold uppercase tracking-wider text-slate-400 mb-2\"\u003e📜 Log Aktivitas Tim\u003c/h3\u003e\n        \u003cdiv id=\"event-log\" class=\"text-[11px] space-y-1.5 overflow-y-auto max-h-36 pr-1 text-slate-300 font-mono\"\u003e\n          \u003cdiv class=\"text-amber-400\"\u003e[Sistem] Selamat datang di Card Chess 2v2v2v2!\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/aside\u003e\n\n    \u003c!-- CENTER ARENA --\u003e\n    \u003csection class=\"lg:col-span-6 flex flex-col gap-3 order-1 lg:order-2\"\u003e\n      \u003cdiv class=\"bg-[#111827] border border-slate-800/80 rounded-2xl px-3.5 py-2.5 flex items-center justify-between\"\u003e\n        \u003cdiv class=\"flex items-center gap-2\"\u003e\n          \u003cspan class=\"text-xs font-medium text-slate-400\"\u003eTampilan:\u003c/span\u003e\n          \u003cspan id=\"current-view-label\" class=\"text-xs font-bold text-cyan-400\"\u003ePapan Utama Kamu\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdiv id=\"battle-status-banner\" class=\"text-xs font-bold text-amber-400\"\u003eSusun formasi & belanja kartu\u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003c!-- MAIN ARENA BOARD (12 petak Prep, 24 petak Battle) --\u003e\n      \u003cdiv class=\"bg-gradient-to-b from-[#0f172a] via-[#0d1322] to-[#0f172a] border border-slate-700/60 rounded-3xl p-3.5 shadow-xl relative\"\u003e\n        \u003cdiv class=\"mb-3\"\u003e\n          \u003cdiv class=\"flex items-center justify-between text-xs font-semibold text-slate-400 mb-1.5 px-1\"\u003e\n            \u003cspan id=\"enemy-board-title\" class=\"text-rose-400\"\u003e⚔️ Wilayah Musuh\u003c/span\u003e\n            \u003cdiv id=\"enemy-synergy-mini\" class=\"text-slate-500 text-[11px] text-right max-w-[65%]\"\u003eSiap Bertarung\u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv id=\"enemy-board-container\" class=\"space-y-1.5\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"my-3 flex flex-col items-center gap-1.5\"\u003e\n          \u003cdiv id=\"awakening-banner\" class=\"hidden w-full py-1.5 px-3 rounded-xl bg-gradient-to-r from-amber-600/30 via-rose-600/40 to-amber-600/30 border border-amber-400/60 text-center text-xs font-display font-extrabold text-amber-300 tracking-wide mythic-10-badge\"\u003e\n            🌟 MYTHIC 10 SYNERGY AKTIF!\n          \u003c/div\u003e\n          \u003cdiv class=\"w-full flex items-center gap-3\"\u003e\n            \u003cdiv class=\"h-px flex-1 bg-gradient-to-r from-transparent via-amber-500/30 to-transparent\"\u003e\u003c/div\u003e\n            \u003cspan id=\"center-divider-text\" class=\"text-[10px] font-display uppercase tracking-widest text-amber-400 px-3 py-1 rounded-full bg-slate-900 border border-amber-500/20\"\u003e\n              Papan 12 Petak • Gabung 24 Petak Saat Perang\n            \u003c/span\u003e\n            \u003cdiv class=\"h-px flex-1 bg-gradient-to-r from-transparent via-amber-500/30 to-transparent\"\u003e\u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv\u003e\n          \u003cdiv class=\"flex items-center justify-between text-xs font-semibold text-slate-400 mb-1.5 px-1\"\u003e\n            \u003cspan id=\"ally-board-title\" class=\"text-cyan-400\"\u003e🛡️ Papan Kamu (12 Petak)\u003c/span\u003e\n            \u003cspan id=\"ally-count-badge\" class=\"text-slate-500 text-[11px]\"\u003e0/3 Unit\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv id=\"ally-board-container\" class=\"space-y-1.5\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003c!-- BENCH & SIGIL INVENTORY --\u003e\n      \u003cdiv class=\"bg-[#111827] border border-slate-800/80 rounded-2xl p-3.5 shadow-sm space-y-3\"\u003e\n        \u003cdiv class=\"flex flex-wrap items-center justify-between gap-2 pb-2.5 border-b border-slate-800/80\"\u003e\n          \u003cdiv class=\"flex items-center gap-2\"\u003e\n            \u003cspan class=\"text-xs font-bold uppercase tracking-wider text-amber-400\"\u003e🔮 Tas Sigil:\u003c/span\u003e\n            \u003cspan class=\"text-[10px] text-slate-400\"\u003e(Drag Sigil ke Hero (1 Sigil per elemen) atau klik Sigil lalu klik Hero)\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv id=\"sigil-inventory\" class=\"flex flex-wrap items-center gap-1.5\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv\u003e\n          \u003cdiv class=\"flex items-center justify-between mb-2\"\u003e\n            \u003cdiv class=\"flex items-center gap-2\"\u003e\n              \u003ch3 class=\"text-xs font-bold uppercase tracking-wider text-slate-300\"\u003e🎒 Bangku Cadangan (Bench)\u003c/h3\u003e\n              \u003cspan id=\"bench-count\" class=\"text-[11px] text-slate-400\"\u003e(0/8)\u003c/span\u003e\n            \u003c/div\u003e\n            \u003cspan class=\"text-[11px] text-slate-500\"\u003eDrag & Drop kartu ke papan atau bench\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv id=\"player-bench\" class=\"grid grid-cols-4 sm:grid-cols-8 gap-2\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- RIGHT SIDEBAR: SHOP & ECONOMY --\u003e\n    \u003caside class=\"lg:col-span-3 flex flex-col gap-3 order-3\"\u003e\n      \u003cdiv class=\"bg-[#111827] border border-slate-800/80 rounded-2xl p-3.5 shadow-sm\"\u003e\n        \u003cdiv class=\"flex items-center justify-between mb-3\"\u003e\n          \u003cdiv class=\"flex items-center gap-2.5 bg-amber-500/10 border border-amber-500/20 px-3 py-2 rounded-xl\"\u003e\n            \u003cspan class=\"text-lg\"\u003e🪙\u003c/span\u003e\n            \u003cdiv\u003e\n              \u003cdiv class=\"text-[10px] text-amber-300/80 uppercase font-semibold\"\u003eGold Kamu\u003c/div\u003e\n              \u003cdiv id=\"player-gold\" class=\"text-lg font-extrabold text-amber-400 leading-none\"\u003e12\u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"text-right\"\u003e\n            \u003cdiv class=\"text-xs text-slate-400\"\u003eCommander Lv.\u003cspan id=\"player-level\" class=\"font-bold text-white\"\u003e1\u003c/span\u003e\u003c/div\u003e\n            \u003cdiv class=\"text-xs text-emerald-400\"\u003eKapasitas: \u003cspan id=\"player-cap\"\u003e3\u003c/span\u003e Kartu\u003c/div\u003e\n            \u003cdiv class=\"text-[10px] text-amber-300/70 mt-0.5\"\u003eBunga +1G / 10G\u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"grid grid-cols-2 gap-2 mb-3\"\u003e\n          \u003cbutton onclick=\"refreshShop()\" class=\"py-2.5 px-2.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-sky-300 flex items-center justify-center gap-1.5 transition\"\u003e\n            \u003cspan\u003e🔄 Refresh\u003c/span\u003e\n            \u003cspan class=\"text-amber-400\"\u003e(2G)\u003c/span\u003e\n          \u003c/button\u003e\n          \u003cbutton onclick=\"buyLevelUp()\" class=\"py-2.5 px-2.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-emerald-300 flex items-center justify-center gap-1.5 transition\"\u003e\n            \u003cspan\u003e⬆️ Naik Lv 🎁T5\u003c/span\u003e\n            \u003cspan id=\"lvl-up-cost\" class=\"text-amber-400\"\u003e(4G)\u003c/span\u003e\n          \u003c/button\u003e\n        \u003c/div\u003e\n\n        \u003cbutton id=\"btn-start-combat\" onclick=\"onStartButton()\" class=\"w-full py-3 px-4 rounded-xl bg-gradient-to-r from-amber-500 via-orange-500 to-rose-600 hover:from-amber-400 hover:to-rose-500 text-slate-950 font-display font-extrabold text-sm tracking-wide shadow-lg shadow-orange-600/20 transition transform active:scale-98 flex items-center justify-center gap-2\"\u003e\n          \u003cspan id=\"btn-start-label\"\u003e⚔️ MULAI PERTARUNGAN 2V2\u003c/span\u003e\n        \u003c/button\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"bg-[#111827] border border-slate-800/80 rounded-2xl p-3.5 shadow-sm\"\u003e\n        \u003cdiv class=\"flex items-center justify-between mb-2\"\u003e\n          \u003ch3 class=\"text-xs font-bold uppercase tracking-wider text-amber-400\"\u003e🏪 Toko Kartu & Sigil\u003c/h3\u003e\n          \u003cbutton onclick=\"openSigilDraftModal()\" class=\"text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 transition\"\u003e\n            + Klaim Sigil Gratis (\u003cspan id=\"free-sigil-count\"\u003e0\u003c/span\u003e)\n          \u003c/button\u003e\n        \u003c/div\u003e\n        \u003cdiv id=\"shop-cards\" class=\"grid grid-cols-1 gap-2\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv id=\"card-inspector\" class=\"bg-[#111827] border border-slate-800/80 rounded-2xl p-3.5 shadow-sm\"\u003e\n        \u003ch3 class=\"text-xs font-bold uppercase tracking-wider text-slate-400 mb-2\"\u003e🔍 Detail Kartu & Aksi\u003c/h3\u003e\n        \u003cdiv id=\"inspector-content\" class=\"text-xs text-slate-400 py-4 text-center\"\u003e\n          Klik kartu untuk jual (harga beli) atau beri rekan (-1G). Tiap kartu: 1 Sigil per elemen, elemen sendiri boleh.\n eState = {};\n    // =========================================================================\n    // JEMBATAN GACHA: kartu hasil gacha jadi Hero (pool gabungan sampai 80 kartu)\n    // =========================================================================\n    const DEFAULT_ROSTER = HERO_ROSTER.slice();\n    let HERO_POOL = null; // daftar kartu gabungan semua pemain (boleh ada duplikat = banyak salinan)\n    const G_ELEM = { api: 'Api', air: 'Air', tanah: 'Tanah', angin: 'Angin', cahaya: 'Cahaya', kegelapan: 'Kegelapan' };\n    const G_TIER = { common: 1, uncommon: 2, rare: 3, epic: 4, legendary: 5 };\n    const G_SKILL = {\n      Api: ['Inferno Strike', 'cleave_burn', 'Serangan api & Burn.'],\n      Air: ['Tidal Surge', 'aoe_slow', 'Gelombang air memperlambat musuh.'],\n      Tanah: ['Earthquake', 'stun_cleave', 'Guncangan tanah menghantam musuh.'],\n      Angin: ['Gale Slash', 'multi_hit', 'Tebasan angin beruntun.'],\n      Cahaya: ['Holy Burst', 'team_shield', 'Ledakan cahaya suci.'],\n      Kegelapan: ['Shadow Reap', 'crit_steal', 'Menuai nyawa dalam bayangan.']\n    };\n    function hashStr(str) { let h = 0; for (const ch of String(str)) h = (h * 31 + ch.charCodeAt(0)) \u003e\u003e\u003e 0; return h; }\n    function gachaToHero(c) {\n      const key = String(c.id || c.name);\n      const h = hashStr(key);\n      const el = G_ELEM[String(c.elementKey || '').toLowerCase()] || Object.keys(ELEMENTS)[h % Object.keys(ELEMENTS).length];\n      const tier = G_TIER[c.rarity] || 1;\n      const att = Math.max(1, c.att || 100), def = c.def || 0, mp = c.mp || 0;\n      const r = def / att, m = mp / att;\n      let badge = 'Marksman';\n      if (BADGES[c.tag]) badge = c.tag;               // Tag Badge kartu = Sinergi Badge\n      else if (r \u003e= 0.85) badge = 'Vanguard';\n      else if (m \u003e= 1.4) badge = 'Arcanist';\n      else if (r \u003e= 0.65) badge = 'Brawler';\n      else if (r \u003c= 0.5) badge = 'Stalker';\n      const front = ['Vanguard', 'Brawler', 'Stalker'].includes(badge);\n      const sk = G_SKILL[el];\n      const atk = Math.round(att * 0.15);\n      const src = String(c.imageSrc || '').replace(/\"/g, '%22');\n      return {\n        id: 'g_' + key, name: c.name || 'Kartu', tier, element: el, badge, pos: front ? 'front' : 'back',\n        hp: Math.round((c.hp || 1000) * 0.45), atk, speed: +(0.9 + (h % 5) * 0.1).toFixed(2), maxMana: 70 + tier * 6,\n        avatar: src ? `\u003cimg src=\"${src}\" alt=\"\" style=\"width:30px;height:30px;object-fit:cover;border-radius:6px;display:block;margin:0 auto\" onerror=\"this.outerHTML='🃏'\"\u003e` : '🃏',\n        skillName: sk[0], skillType: sk[1], skillVal: Math.round(atk * 1.6 + tier * 20), skillDesc: sk[2]\n      };\n    }\n    // loadouts: array berisi daftar kartu gacha tiap pemain (maks 10 per pemain, 8 pemain = 80 kartu)\n    function setGachaLoadouts(loadouts) {\n      if (document.getElementById('screen-menu').classList.contains('hidden')) return false; // sedang bermain\n      const flat = [], byId = {};\n      loadouts.forEach(l =\u003e (l || []).slice(0, 10).forEach(c =\u003e {\n        const hero = gachaToHero(c);\n        if (!byId[hero.id]) byId[hero.id] = hero;\n        flat.push(byId[hero.id]);\n      }));\n      if (flat.length === 0) return false;\n      HERO_ROSTER.length = 0;\n      Object.values(byId).forEach(hh =\u003e HERO_ROSTER.push(hh));\n      HERO_POOL = flat;\n      return { total: flat.length, unique: Object.keys(byId).length };\n    }\n    function resetToDefaultRoster() {\n      if (document.getElementById('screen-menu').classList.contains('hidden')) return false;\n      HERO_ROSTER.length = 0;\n      DEFAULT_ROSTER.forEach(hh =\u003e HERO_ROSTER.push(hh));\n      HERO_POOL = null;\n      return true;\n    }\n\n\n    // =========================================================================\n    // LOADOUT 10 KARTU (hanya di menu Chess Royale) + JEMBATAN KE GACHA STUDIO\n    // =========================================================================\n    const LOADOUT_SIZE = 10;\n    const PLACE_POINTS = { 1: 1500, 2: 1000, 3: 600, 4: 300 };   // poin gacha per posisi akhir tim\n    const LOADOUT_RW = { common: 10, uncommon: 9, rare: 8, epic: 7, legendary: 6 };\n    function cf() { try { const pw = window.parent; return (pw && pw !== window && pw.CF) ? pw.CF : null; } catch (e) { return null; } }\n    function ownedCards() {\n      const c = cf(); if (!c) return [];\n      const m = new Map();\n      c.binder().forEach(x =\u003e { if (!m.has(x.id)) m.set(x.id, { card: x, count: 0 }); m.get(x.id).count++; });\n      return [...m.values()];\n    }\n    function pruneLoadout() {\n      const c = cf(); if (!c) return [];\n      const owned = new Set(ownedCards().map(o =\u003e o.card.id));\n      c.loadout = [...new Set(c.loadout.filter(id =\u003e owned.has(id)))].slice(0, LOADOUT_SIZE);   // unik & hanya yang dimiliki\n      return c.loadout;\n    }\n    function loadoutReady() { const c = cf(); return !c || pruneLoadout().length === LOADOUT_SIZE; }\n    function refreshMenuState() {\n      const c = cf();\n      const n = c ? pruneLoadout().length : 0;\n      document.getElementById('loadout-count').textContent = c ? n : '-';\n      const ready = loadoutReady();\n      ['btn-mode-ai', 'btn-mode-online'].forEach(id =\u003e {\n        const b = document.getElementById(id); if (!b) return;\n        b.disabled = !ready; b.style.opacity = ready ? '' : '0.4'; b.style.cursor = ready ? '' : 'not-allowed';\n      });\n      const hint = document.getElementById('loadout-hint');\n      if (hint) hint.textContent = ready ? '' : `🔒 Susun Loadout ${LOADOUT_SIZE} kartu berbeda dulu untuk bisa main (kini ${n}/${LOADOUT_SIZE}).`;\n      if (c && c.changed) c.changed();\n    }\n    function openLoadout() {\n      if (!cf()) { showToast('Loadout butuh Gacha Studio.', 'rose'); return; }\n      renderLoadout();\n      const m = document.getElementById('loadout-modal'); m.classList.remove('hidden'); m.classList.add('f
