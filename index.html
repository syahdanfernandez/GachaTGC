-emerald-500', rare: 'border-sky-500', epic: 'border-fuchsia-500', legendary: 'border-amber-400' };\n      body.innerHTML += owned.map(({ card: k, count }) =\u003e {\n        const on = sel.has(k.id), bg = BADGES[k.tag];\n        const src = String(k.imageSrc || '').replace(/\"/g, '%22');\n        return `\u003cdiv onclick=\"toggleLoadoutCard('${String(k.id).replace(/'/g, \"\\\\'\")}')\" class=\"relative cursor-pointer rounded-xl border-2 ${rarityBg[k.rarity] || 'border-slate-600'} bg-slate-900 p-1.5 text-[10px] ${on ? 'ring-2 ring-emerald-400 shadow-[0_0_14px_rgba(52,211,153,.5)]' : 'opacity-80 hover:opacity-100'}\"\u003e\n          \u003cspan class=\"absolute top-2 left-2 bg-black/70 px-1.5 rounded font-bold text-amber-300\"\u003eT${G_TIER[k.rarity] || 1}\u003c/span\u003e\n          ${count \u003e 1 ? `\u003cspan class=\"absolute top-2 right-2 bg-black/70 px-1.5 rounded font-bold text-slate-200\"\u003e×${count}\u003c/span\u003e` : ''}\n          ${on ? '\u003cspan class=\"absolute bottom-[62px] right-2 bg-emerald-500 text-slate-950 rounded-full w-5 h-5 text-center font-black\"\u003e✓\u003c/span\u003e' : ''}\n          \u003cimg src=\"${src}\" alt=\"\" class=\"w-full h-24 object-cover rounded-lg bg-slate-800\" onerror=\"this.style.visibility='hidden'\"\u003e\n          \u003cdiv class=\"font-bold text-white mt-1 truncate\"\u003e${k.name}\u003c/div\u003e\n          \u003cdiv class=\"text-slate-400\"\u003e${bg ? bg.icon + ' ' + bg.name : ''} • ${(G_ELEM[String(k.elementKey).toLowerCase()] || '-')}\u003c/div\u003e\n          \u003cdiv class=\"text-slate-500\"\u003e❤️${k.hp} ⚔️${k.att} 🛡️${k.def}\u003c/div\u003e\u003c/div\u003e`;\n      }).join('');\n    }\n    function weightedUniquePick(pool, n) {\n      const left = pool.slice(), out = [];\n      while (out.length \u003c n && left.length) {\n        const w = left.map(x =\u003e LOADOUT_RW[x.rarity] || 5), sum = w.reduce((a, b) =\u003e a + b, 0);\n        let r = Math.random() * sum, i = 0;\n        for (; i \u003c left.length; i++) { r -= w[i]; if (r \u003c= 0) break; }\n        out.push(left.splice(Math.min(i, left.length - 1), 1)[0]);   // tanpa pengembalian → tidak ada kartu kembar dalam 1 loadout\n      }\n      return out;\n    }\n    function prepareLoadouts() {\n      const c = cf(); if (!c) return true;\n      if (!loadoutReady()) { showToast(`Susun Loadout ${LOADOUT_SIZE} kartu berbeda dulu!`, 'rose'); openLoadout(); return false; }\n      const owned = new Map(ownedCards().map(o =\u003e [o.card.id, o.card]));\n      const mine = c.loadout.map(id =\u003e owned.get(id)).filter(Boolean);\n      const pool = c.pool();\n      const loadouts = [mine];\n      for (let i = 0; i \u003c 7; i++) loadouts.push(weightedUniquePick(pool, LOADOUT_SIZE));   // pemain lain: boleh sama dgn kamu, tapi unik di loadout-nya sendiri\n      return setGachaLoadouts(loadouts) !== false;\n    }\n\n    // ----- Roster & Sinergi: di luar game = SEMUA kartu Gacha; di dalam game = hanya roster yang dipasang pemain -----\n    function inGame() { return document.getElementById('screen-menu').classList.contains('hidden'); }\n    function rosterSource() {\n      if (inGame()) {\n        if (HERO_POOL) {\n          const counts = {}; HERO_POOL.forEach(h =\u003e counts[h.id] = (counts[h.id] || 0) + 1);\n          return { heroes: HERO_ROSTER.slice(), counts, note: `🎮 Di dalam game: hanya roster yang dipasang para pemain — ${HERO_POOL.length} kartu loadout (${HERO_ROSTER.length} unik). ×N = berapa pemain memasangnya.` };\n        }\n        return { heroes: HERO_ROSTER.slice(), counts: null, note: `Roster default (${HERO_ROSTER.length} hero)` };\n      }\n      const c = cf();\n      if (c) { const heroes = c.pool().map(gachaToHero); return { heroes, counts: null, note: `📚 Di luar game: SEMUA kartu Gacha Studio (${heroes.length} kartu).` }; }\n      return { heroes: DEFAULT_ROSTER.slice(), counts: null, note: `Roster default (${DEFAULT_ROSTER.length} hero)` };\n    }\n\n    let draggedItem = null;\n\n    function startGameMode(mode) {\n      if (!prepareLoadouts()) return;\n      isOnlineMode = false;\n      if (mode === 'online') {\n        document.getElementById('screen-room').classList.remove('hidden');\n        document.getElementById('screen-room').classList.add('flex');\n        return;\n      }\n      launchGameSession();\n    }\n\n    function closeOnlineRoom() {\n      document.getElementById('screen-room').classList.add('hidden');\n      document.getElementById('screen-room').classList.remove('flex');\n    }\n\n    let isOnlineMode = false, prepTimerId = null, prepTimeLeft = 0;\n    const ONLINE_PREP_SECONDS = 45;\n    // ONLINE: pertarungan hanya mulai jika SEMUA pemain klik \"Siap\" atau waktu habis.\n    let readySet = {}, readyTimeouts = [];\n    let cfRoomSnapshot = null;\n    function cfOnlineBridge(){ try { return window.parent.CF && window.parent.CF.online ? window.parent.CF.online : null; } catch(e){ return null; } }\n    function cfRoomError(msg){ const el=document.getElementById('cf-room-error'); if(el) el.textContent=msg||''; }\n    function cfRenderRoom(data){\n      cfRoomSnapshot=data||cfRoomSnapshot; if(!cfRoomSnapshot) return;\n      const panel=document.getElementById('cf-room-panel'); panel.classList.remove('hidden');\n      document.getElementById('cf-room-code-label').textContent='#'+cfRoomSnapshot.code;\n      document.getElementById('cf-room-status').textContent=`${cfRoomSnapshot.players.length}/8 pemain • ${cfRoomSnapshot.status==='playing'?'Room dimulai':'Menunggu pemain'}`;\n      document.getElementById('cf-room-players').innerHTML=Array.from({length:8},(_,i)=\u003e{const p=cfRoomSnapshot.players.find(x=\u003ex.seat===i+1);return `\u003cdiv class=\"rounded-lg border border-slate-800 p-2 text-[11px] ${p?'bg-slate-800':'bg-slate-950 text-slate-600'}\"\u003e\u003cdiv class=\"font-bold\"\u003e${p?`Tim ${p.team} • ${p.display_name}`:`Slot ${i+1} kosong`}\u003c/div\u003e\u003cdiv class=\"text-[10px] ${p&&p.is_ready?'text-emerald-400':'text-slate-500'}\"\u003e${p?(p.is_ready?'SIAP':'Belum siap'):'Menunggu'}\u003c/div\u003e\u003c/div\u003e`}).join('');\n      const me=cfRoomSnapshot.players.find(p=\u003ep.user_id===cfRoomSnapshot.user_id);\n      document.getElementById('cf-ready-btn').textContent=me&&me.is_ready?'Batal Siap':'✓ Saya Siap';\n      document.getElementById('cf-start-btn').disabled=!(cfRoomSnapshot.is_host&&cfRoomSnapshot.players.length===8&&cfRoomSnapshot.players.every(p=\u003ep.is_ready));\n      document.getElementById('cf-start-btn').style.opacity=document.getElementById('cf-start-btn').disabled?'.45':'1';\n    }\n    async function cfCreateRoom(){cfRoomError('');try{const b=cfOnlineBridge();if(!b)throw Error('Koneksi induk belum siap.');const name=document.getElementById('cf-player-name').value.trim();if(!name)throw Error('Masukkan nama pemain.');cfRenderRoom(await b.createRoom(name));}catch(e){cfRoomError(e.message||String(e));}}\n    async function cfJoinRoom(){cfRoomError('');try{const b=cfOnlineBridge();if(!b)throw Error('Koneksi induk belum siap.');const name=document.getElementById('cf-player-name').value.trim(),code=document.getElementById('cf-room-code').value.trim();if(!name||!code)throw Error('Isi nama dan kode room.');cfRenderRoom(await b.joinRoom(code,name));}catch(e){cfRoomError(e.message||String(e));}}\n    async function cfToggleReady(){cfRoomError('');try{const b=cfOnlineBridge();const me=cfRoomSnapshot.players.find(p=\u003ep.user_id===cfRoomSnapshot.user_id);cfRenderRoom(await b.setReady(cfRoomSnapshot.room_id,!(me&&me.is_ready)));}catch(e){cfRoomError(e.message||String(e));}}\n    async function cfStartRoom(){cfRoomError('');try{const b=cfOnlineBridge();await b.startRoom(cfRoomSnapshot.room_id);cfRoomError('Room berhasil dimulai. Integrasi sinkronisasi gameplay antar pemain adalah tahap berikutnya.');}catch(e){cfRoomError(e.message||String(e));}}\n    async function cfLeaveRoom(){try{const b=cfOnlineBridge();if(b)await b.leaveRoom();}catch(e){}cfRoomSnapshot=null;document.getElementById('cf-room-panel').classList.add('hidden');closeOnlineRoom();}\n    window.cfApplyRoomSnapshot=cfRenderRoom;\n    // Tim yang sudah mati tidak dihitung lagi → jumlah \"siap\" ikut berkurang\n    function activePlayerIds() {\n      return Object.values(gameState.players).filter(p =\u003e !gameState.teams[p.teamId].eliminated).map(p =\u003e p.id);\n    }\n    function updateStartButton() {\n      const btn = document.getElementById('btn-start-combat');\n      const lbl = document.getElementById('btn-start-label');\n      if (!btn || !lbl) return;\n      if (!isOnlineMode) { lbl.textContent = '⚔️ MULAI PERTARUNGAN 2V2'; btn.disabled = false; btn.style.opacity = ''; return; }\n      const ids = activePlayerIds(), n = ids.filter(id =\u003e readySet[id]).length;\n      if (readySet.p1) { lbl.textContent = `⏳ Menunggu pemain lain... (${n}/${ids.length} siap)`; btn.disabled = true; btn.style.opacity = '0.6'; }\n      else { lbl.textContent = `✅ SIAP BERTARUNG (${n}/${ids.length} siap)`; btn.disabled = false; btn.style.opacity = ''; }\n    }\n    function markReady(pid) {\n      if (!gameState || gameState.phase !== 'PREP' || !isOnlineMode || readySet[pid]) return;\n      readySet[pid] = true;\n      updateStartButton();\n      if (pid !== 'p1') addLog(`[Online] ${gameState.players[pid].name} siap bertarung.`, 'text-slate-400');\n      if (activePlayerIds().every(id =\u003e readySet[id])) {\n        stopPrepTimer();\n        showToast('✅ Semua pemain siap! Pertarungan dimulai.', 'emerald');\n        startCombatPhase();\n      }\n    }\n    function onStartButton() {\n      if (isOnlineMode) { markReady('p1'); showToast('Kamu siap. Menunggu pemain lain...', 'amber'); }\n      else startCombatPhase();\n    }\n    function stopPrepTimer() {\n      readyTimeouts.forEach(clearTimeout); readyTimeouts = [];\n      if (prepTimerId) { clearInterval(prepTimerId); prepTimerId = null; }\n      const el = document.getElementById('prep-timer');\n      if (el) el.classList.add('hidden');\n    }\n    function startPrepTimer() {\n      stopPrepTimer();\n      if (!isOnlineMode) return;\n      prepTimeLeft = ONLINE_PREP_SECONDS;\n      readySet = {};\n      // Tidak ada lagi simulasi pemain online palsu. Status siap berasal dari room Realtime.\n      updateStartButton();\n      const el = document.getElementById('prep-timer');\n      const paint = () =\u003e {\n        el.classList.remove('hidden');\n        el.textContent = `⏱️ ${prepTimeLeft}s`;\n        el.className = `px-2 py-0.5 rounded-md font-bold ${prepTimeLeft \u003c= 10 ? 'bg-rose-900 text-rose-200 animate-pulse' : 'bg-slate-800 text-amber-300'}`;\n      };\n      paint();\n      prepTimerId = setInterval(() =\u003e {\n        if (!gameState || gameState.phase !== 'PREP') { stopPrepTimer(); return; }\n        prepTimeLeft--;\n        if (prepTimeLeft \u003c= 0) {\n          stopPrepTimer();\n          showToast('⏱️ Waktu habis! Pertarungan dimulai otomatis.', 'rose');\n          startCombatPhase();\n          return;\n        }\n        paint();\n      }, 1000);\n    }\n\n    function launchOnlineGame() {\n      showToast('Gunakan lobby online untuk membuat atau bergabung ke room.', 'cyan');\n      document.getElementById('screen-room').classList.remove('hidden');\n      document.getElementById('screen-room').classList.add('flex');\n    }\n\n    function launchGameSession() {\n      document.getElementById('screen-menu').classList.add('hidden');\n      initGame();\n    }\n\n    function backToMenu() {\n      if (combatInterval) clearInterval(combatInterval);\n      stopPrepTimer();\n      clearRoundModalTimer(); hideRoundModal();\n      document.getElementById('screen-menu').classList.remove('hidden');\n      refreshMenuState();\n    }\n\n    function createInitialPlayers() {\n      const configs = [\n        { id: 'p1', name: 'Kamu', teamId: 'team_cyan', isHuman: true, isPartner: false },\n        { id: 'p2', name: 'AI Aria (Rekan)', teamId: 'team_cyan', isHuman: false, isPartner: true },\n        { id: 'p3', name: 'AI Ignis', teamId: 'team_red', isHuman: false, isPartner: false },\n        { id: 'p4', name: 'AI Crimson', teamId: 'team_red', isHuman: false, isPartner: false },\n        { id: 'p5', name: 'AI Sylvan', teamId: 'team_green', isHuman: false, isPartner: false },\n        { id: 'p6', name: 'AI Zephyr', teamId: 'team_green', isHuman: false, isPartner: false },\n        { id: 'p7', name: 'AI Malakor', teamId: 'team_purple', isHuman: false, isPartner: false },\n        { id: 'p8', name: 'AI Vespera', teamId: 'team_purple', isHuman: false, isPartner: false }\n      ];\n\n      const players = {};\n      configs.forEach(cfg =\u003e {\n        players[cfg.id] = {\n          ...cfg,\n          gold: 12,\n          level: 1,\n          board: Array(12).fill(null),\n          bench: Array(8).fill(null),\n          sigils: [],\n          freeSigilClaims: 0,\n          shop: []\n        };\n      });\n      return players;\n    }\n\n    function initGame() {\n      gameState = {\n        round: 1,\n        phase: 'PREP',\n        viewTarget: 'p1',\n        selectedCard: null,\n        selectedSigilIdx: null,\n        freeSigilClaimedRound: 0,\n        teams: {\n          team_cyan: { id: 'team_cyan', name: 'Tim Kamu (Biru)', color: 'cyan', hp: 100, members: ['p1', 'p2'], eliminated: false },\n          team_red: { id: 'team_red', name: 'Tim Merah', color: 'rose', hp: 100, members: ['p3', 'p4'], eliminated: false },\n          team_green: { id: 'team_green', name: 'Tim Hijau', color: 'emerald', hp: 100, members: ['p5', 'p6'], eliminated: false },\n          team_purple: { id: 'team_purple', name: 'Tim Ungu', color: 'purple', hp: 100, members: ['p7', 'p8'], eliminated: false }\n        },\n        players: createInitialPlayers(),\n        combatState: {\n          allyGrid: Array(24).fill(null),\n          enemyGrid: Array(24).fill(null),\n          allyUnits: [],\n          enemyUnits: [],\n          allySynergies: null,\n          enemyTeamId: null,\n          opp1Name: '',\n          opp2Name: '',\n          turnCount: 0\n        }\n      };\n\n      Object.values(gameState.players).forEach(p =\u003e {\n        p.shop = generateShopForLevel(p.level);\n        if (!p.isHuman) runAIPrepTurn(p);\n      });\n\n      populateSynergyGuideModal();\n      renderAll();\n      addLog('Ronde 1 dimulai! Drag kartu dari shop ke bench atau papan.', 'text-amber-400');\n    }\n\n    let uidCounter = 1;\n    function createCardInstance(templateId, star = 1, extraElements = [], invested = 0) {\n      const tpl = HERO_ROSTER.find(h =\u003e h.id === templateId);\n      const mult = star === 1 ? 1 : (star === 2 ? 1.8 : 3.2);\n      return {\n        uid: 'c_' + (uidCounter++),\n        templateId: tpl.id,\n        name: tpl.name,\n        tier: tpl.tier,\n        element: tpl.element,\n        extraElements: [...extraElements],\n        invested: invested,\n        badge: tpl.badge,\n        pos: tpl.pos,\n        avatar: tpl.avatar,\n        star: star,\n        maxHp: Math.round(tpl.hp * mult),\n        atk: Math.round(tpl.atk * mult),\n        speed: tpl.speed,\n        maxMana: tpl.maxMana,\n        skillName: tpl.skillName,\n        skillType: tpl.skillType,\n        skillVal: Math.round(tpl.skillVal * mult),\n        skillDesc: tpl.skillDesc,\n        justMerged: false\n      };\n    }\n\n    function generateShopForLevel(level) {\n      const odds = LEVEL_ODDS[Math.min(level, 6)].odds;\n      const shop = [];\n      for (let i = 0; i \u003c 5; i++) {\n        if (i === 4 && Math.random() \u003c 0.25) {\n          const elemKeys = Object.keys(ELEMENTS);\n          const randEl = elemKeys[Math.floor(Math.random() * elemKeys.length)];\n          shop.push({ isSigil: true, element: randEl, tier: 3, name: `Sigil ${randEl}`, avatar: ELEMENTS[randEl].icon });\n          continue;\n        }\n        const roll = Math.random() * 100;\n        let acc = 0;\n        let chosenTier = 1;\n        for (let t = 0; t \u003c odds.length; t++) {\n          acc += odds[t];\n          if (roll \u003c= acc) { chosenTier = t + 1; break; }\n        }\n        const src = (HERO_POOL && HERO_POOL.length) ? HERO_POOL : HERO_ROSTER;\n        let pool = src.filter(h =\u003e h.tier === chosenTier);\n        if (!pool.length) {\n          const tiers = [...new Set(src.map(h =\u003e h.tier))].sort((a, b) =\u003e Math.abs(a - chosenTier) - Math.abs(b - chosenTier));\n          pool = src.filter(h =\u003e h.tier === tiers[0]);\n        }\n        shop.push(pool[Math.floor(Math.random() * pool.length)]);\n      }\n      return shop;\n    }\n\n    function checkAndMergePlayerCards(player) {\n      let keepChecking = true;\n      while (keepChecking) {\n        keepChecking = false;\n        const groups = {};\n        player.board.forEach((c, idx) =\u003e {\n          if (c && c.star \u003c 3) {\n            const key = `${c.templateId}_${c.star}`;\n            if (!groups[key]) groups[key] = [];\n            groups[key].push({ loc: 'board', idx, card: c });\n          }\n        });\n        player.bench.forEach((c, idx) =\u003e {\n          if (c && c.star \u003c 3) {\n            const key = `${c.templateId}_${c.star}`;\n            if (!groups[key]) groups[key] = [];\n            groups[key].push({ loc: 'bench', idx, card: c });\n          }\n        });\n\n        for (const key in groups) {\n          if (groups[key].length \u003e= 3) {\n            const toMerge = groups[key].slice(0, 3);\n            const base = toMerge[0].card;\n            const combinedSigils = [];\n            toMerge.forEach(item =\u003e {\n              (item.card.extraElements || []).forEach(el =\u003e {\n                if (!combinedSigils.includes(el)) combinedSigils.push(el);\n              });\n            });\n\n            const newStar = base.star + 1;\n            const upgraded = createCardInstance(base.templateId, newStar, combinedSigils, toMerge.reduce((n, it) =\u003e n + (it.card.invested || 0), 0));\n            upgraded.justMerged = true;\n\n            toMerge.forEach(item =\u003e {\n              if (item.loc === 'board') player.board[item.idx] = null;\n              else player.bench[item.idx] = null;\n            });\n\n            if (toMerge[0].loc === 'board') player.board[toMerge[0].idx] = upgraded;\n            else player.bench[toMerge[0].idx] = upgraded;\n\n            keepChecking = true;\n            if (player.isHuman) {\n              showToast(`✨ UPGRADE! ${upgraded.name} menjadi ★${newStar}!`, 'amber');\n              addLog(`[Upgrade] ${upgraded.name} bergabung jadi ★${newStar}!`, 'text-amber-300');\n            }\n            break;\n          }\n        }\n      }\n    }\n\n    function buyCardFromShop(shopIdx) {\n      if (gameState.phase !== 'PREP') return;\n      const p1 = gameState.players.p1;\n      const item = p1.shop[shopIdx];\n      if (!item || p1.gold \u003c item.tier) {\n        showToast('Gold tidak cukup!', 'rose');\n        return;\n      }\n\n      if (item.isSigil) {\n        p1.gold -= item.tier;\n        p1.shop[shopIdx] = null;\n        p1.sigils.push(item.element);\n        showToast(`🔮 Membeli Sigil ${item.element}! Drag Sigil ke Hero.`, 'amber');\n        renderAll();\n        return;\n      }\n\n      const emptyBench = p1.bench.findIndex(s =\u003e s === null);\n      if (emptyBench === -1) {\n        showToast('Bangku cadangan penuh!', 'rose');\n        return;\n      }\n\n      p1.gold -= item.tier;\n      p1.shop[shopIdx] = null;\n      p1.bench[emptyBench] = createCardInstance(item.id, 1, [], item.tier);\n      checkAndMergePlayerCards(p1);\n      renderAll();\n    }\n\n    // Tiap kartu bisa dipasang 1 Sigil per elemen (elemen boleh berbeda dari elemen asli Hero)\n    function equipSigilToCard(card, sigilEl) {\n      if (!card.extraElements) card.extraElements = [];\n      if (card.extraElements.includes(sigilEl)) {\n        showToast(`${card.name} sudah memakai Sigil ${sigilEl}! (maks 1 Sigil per elemen)`, 'rose');\n        return false;\n      }\n      card.extraElements.push(sigilEl);\n      showToast(`✨ Sigil ${sigilEl} terpasang pada ${card.name}!`, 'emerald');\n      addLog(`[Sigil] Memasang Sigil ${sigilEl} pada ${card.name}.`, 'text-amber-300');\n      return true;\n    }\n\n    function openSigilDraftModal() {\n      if (gameState.phase !== 'PREP') return;\n      if (!(gameState.players.p1.freeSigilClaims \u003e 0)) {\n        showToast('Klaim Sigil gratis hanya didapat setiap naik Level!', 'rose');\n        return;\n      }\n      const elemKeys = Object.keys(ELEMENTS);\n      const shuffled = [...elemKeys].sort(() =\u003e Math.random() - 0.5).slice(0, 3);\n      const container = document.getElementById('sigil-draft-options');\n      container.innerHTML = shuffled.map(elKey =\u003e {\n        const el = ELEMENTS[elKey];\n        return `\n          \u003cbutton onclick=\"claimSigilChoice('${elKey}')\" class=\"rounded-2xl border ${el.border} ${el.bg} hover:brightness-125 p-3.5 flex flex-col items-center gap-1.5 transition\"\u003e\n            \u003cspan class=\"text-3xl\"\u003e${el.icon}\u003c/span\u003e\n            \u003cspan class=\"font-bold text-sm ${el.color}\"\u003eSigil ${el.name}\u003c/span\u003e\n            \u003cspan class=\"text-[10px] text-slate-300 text-center\"\u003e+1 Sinergi ${el.name}\u003c/span\u003e\n          \u003c/button\u003e\n        `;\n      }).join('');\n      const modal = document.getElementById('sigil-draft-modal');\n      modal.classList.remove('hidden');\n      modal.classList.add('flex');\n    }\n\n    function claimSigilChoice(elKey) {\n      const me = gameState.players.p1;\n      if (!(me.freeSigilClaims \u003e 0)) { closeSigilDraftModal(); return; }\n      me.freeSigilClaims--;\n      me.sigils.push(elKey);\n      closeSigilDraftModal();\n      showToast(`🔮 Menerima Sigil ${elKey}!`, 'amber');\n      renderAll();\n    }\n\n    function closeSigilDraftModal() {\n      const modal = document.getElementById('sigil-draft-modal');\n      modal.classList.add('hidden');\n      modal.classList.remove('flex');\n    }\n\n    function refreshShop() {\n      if (gameState.phase !== 'PREP') return;\n      const p1 = gameState.players.p1;\n      if (p1.gold \u003c 2) { showToast('Butuh 2 Gold!', 'rose'); return; }\n      p1.gold -= 2;\n      p1.shop = generateShopForLevel(p1.level);\n      renderAll();\n    }\n\n    // Setiap Commander naik level → bonus 1 kartu T5\n    function grantFreeT5(player) {\n      const src = (HERO_POOL && HERO_POOL.length) ? HERO_POOL : HERO_ROSTER;\n      let pool = src.filter(h =\u003e h.tier === 5);\n      if (!pool.length) { const mt = Math.max(...src.map(h =\u003e h.tier)); pool = src.filter(h =\u003e h.tier === mt); }\n      const hero = pool[Math.floor(Math.random() * pool.length)];\n      const slot = player.bench.findIndex(x =\u003e x === null);\n      if (slot === -1) { player.gold += 5; return { hero, placed: false }; }\n      player.bench[slot] = createCardInstance(hero.id, 1, [], hero.tier);\n      checkAndMergePlayerCards(player);\n      return { hero, placed: true };\n    }\n\n    function buyLevelUp() {\n      if (gameState.phase !== 'PREP') return;\n      const p1 = gameState.players.p1;\n      if (p1.level \u003e= 6) { showToast('Level sudah maksimal (Lv.6)!', 'amber'); return; }\n      const cost = LEVEL_ODDS[p1.level].cost;\n      if (p1.gold \u003c cost) { showToast(`Butuh ${cost} Gold!`, 'rose'); return; }\n      p1.gold -= cost;\n      p1.level += 1;\n      p1.freeSigilClaims = (p1.freeSigilClaims || 0) + 1;\n      const bonus = grantFreeT5(p1);\n      showToast(bonus.placed ? `⬆️ Commander Lv.${p1.level}! +1 Sigil Gratis • 🎁 Bonus T5: ${bonus.hero.name}` : `⬆️ Commander Lv.${p1.level}! Bangku penuh → bonus T5 diganti +5 Gold`, 'emerald');\n      addLog(`[Level Up] Lv.${p1.level}: bonus kartu T5 ${bonus.hero.name}${bonus.placed ? ' masuk bangku.' : ' (bangku penuh, +5 Gold).'}`, 'text-amber-300');\n      renderAll();\n    }\n\n    // Drag and Drop handlers\n    function handleDragStart(e, source, index) {\n      draggedItem = { source, index };\n      e.dataTransfer.setData('text/plain', JSON.stringify(draggedItem));\n    }\n\n    function handleDragOver(e) {\n      e.preventDefault();\n    }\n\n    function handleDrop(e, targetLoc, targetIdx) {\n      e.preventDefault();\n      if (!draggedItem) return;\n      const p1 = gameState.players.p1;\n\n      // If dropping a sigil from inventory onto a board/bench card\n      if (draggedItem.source === 'sigil') {\n        const sigilEl = p1.sigils[draggedItem.index];\n        const targetCard = targetLoc === 'board' ? p1.board[targetIdx] : p1.bench[targetIdx];\n        if (targetCard && sigilEl) {\n          if (equipSigilToCard(targetCard, sigilEl)) {\n            p1.sigils.splice(draggedItem.index, 1);\n          }\n        }\n        draggedItem = null;\n        renderAll();\n        return;\n      }\n\n      const fromArr = draggedItem.source === 'board' ? p1.board : p1.bench;\n      const toArr = targetLoc === 'board' ? p1.board : p1.bench;\n      const moving = fromArr[draggedItem.index];\n      const dest = toArr[targetIdx];\n      if (!moving) return;\n\n      if (draggedItem.source === 'bench' && targetLoc === 'board' && !dest) {\n        const count = p1.board.filter(Boolean).length;\n        const maxCap = LEVEL_ODDS[p1.level].cap;\n        if (count \u003e= maxCap) {\n          showToast(`Kapasitas papan penuh (${count}/${maxCap})!`, 'rose');\n          draggedItem = null;\n          return;\n        }\n      }\n\n      toArr[targetIdx] = moving;\n      fromArr[draggedItem.index] = dest;\n      draggedItem = null;\n      checkAndMergePlayerCards(p1);\n      renderAll();\n    }\n\n    function calculateSynergies(boards) {\n      const boardList = Array.isArray(boards[0]) ? boards : [boards];\n      const elemCounts = {};\n      const badgeCounts = {};\n      Object.keys(ELEMENTS).forEach(k =\u003e elemCounts[k] = 0);\n      Object.keys(BADGES).forEach(k =\u003e badgeCounts[k] = 0);\n\n      boardList.forEach(singleBoard =\u003e {\n        const seenTemplates = new Set();\n        singleBoard.forEach(card =\u003e {\n          if (!card) return;\n          if (!seenTemplates.has(card.templateId)) {\n            seenTemplates.add(card.templateId);\n            elemCounts[card.element]++;\n            badgeCounts[card.badge]++;\n          }\n          (card.extraElements || []).forEach(sigEl =\u003e {\n            if (elemCounts[sigEl] !== undefined) elemCounts[sigEl]++;\n          });\n        });\n      });\n\n      const activeList = [];\n      Object.entries(elemCounts).forEach(([el, count]) =\u003e {\n        if (count \u003e 0) {\n          const info = ELEMENTS[el];\n          const tier = count \u003e= 10 ? 4 : (count \u003e= 6 ? 3 : (count \u003e= 4 ? 2 : (count \u003e= 2 ? 1 : 0)));\n          activeList.push({ type: 'element', key: el, name: info.name, icon: info.icon, color: info.color, count, tier, thresholds: info.thresholds, desc: info.desc });\n        }\n      });\n      Object.entries(badgeCounts).forEach(([bg, count]) =\u003e {\n        if (count \u003e 0) {\n          const info = BADGES[bg];\n          const tier = count \u003e= 4 ? 2 : (count \u003e= 2 ? 1 : 0);\n          activeList.push({ type: 'badge', key: bg, name: info.name, icon: info.icon, color: info.color, count, tier, thresholds: info.thresholds, desc: info.desc });\n        }\n      });\n      activeList.sort((a, b) =\u003e (b.tier - a.tier) || (b.count - a.count));\n      return { elemCounts, badgeCounts, activeList };\n    }\n\n    function runAIPrepTurn(aiPlayer) {\n      const team = gameState.teams[aiPlayer.teamId];\n      if (team.eliminated) return;\n\n      if (gameState.round \u003e 1) aiPlayer.shop = generateShopForLevel(aiPlayer.level);\n      const lvlCost = LEVEL_ODDS[aiPlayer.level].cost;\n      if (aiPlayer.level \u003c 6 && aiPlayer.gold \u003e= lvlCost + 4) {\n        aiPlayer.gold -= lvlCost;\n        aiPlayer.level += 1;\n        grantFreeT5(aiPlayer);\n      }\n\n      for (let i = 0; i \u003c aiPlayer.shop.length; i++) {\n        const item = aiPlayer.shop[i];\n        if (!item || aiPlayer.gold \u003c item.tier) continue;\n        if (item.isSigil) {\n          aiPlayer.gold -= item.tier;\n          aiPlayer.shop[i] = null;\n          aiPlayer.sigils.push(item.element);\n          continue;\n        }\n\n        const emptyBench = aiPlayer.bench.findIndex(s =\u003e s === null);\n        if (emptyBench !== -1) {\n          aiPlayer.gold -= item.tier;\n          aiPlayer.shop[i] = null;\n          aiPlayer.bench[emptyBench] = createCardInstance(item.id, 1);\n          checkAndMergePlayerCards(aiPlayer);\n        }\n      }\n\n      optimizeAIBoard(aiPlayer);\n\n      while (aiPlayer.sigils.length \u003e 0) {\n        const sigEl = aiPlayer.sigils.pop();\n        const candidate = aiPlayer.board.find(c =\u003e c && c.element === sigEl && !(c.extraElements || []).includes(sigEl))\n          || aiPlayer.board.find(c =\u003e c && !(c.extraElements || []).includes(sigEl));\n        if (candidate) {\n          if (!candidate.extraElements) candidate.extraElements = [];\n          candidate.extraElements.push(sigEl);\n        }\n      }\n    }\n\n    function optimizeAIBoard(aiPlayer) {\n      const maxCap = LEVEL_ODDS[aiPlayer.level].cap;\n      const allUnits = [...aiPlayer.board, ...aiPlayer.bench].filter(Boolean);\n      allUnits.sort((a, b) =\u003e (b.star - a.star) || (b.tier - a.tier));\n\n      const fielded = allUnits.slice(0, maxCap);\n      const benched = allUnits.slice(maxCap, maxCap + 8);\n      const newBoard = Array(12).fill(null);\n\n      let frontIdx = 0, midIdx = 4, backIdx = 8;\n      fielded.forEach(u =\u003e {\n        if ((u.badge === 'Vanguard' || u.badge === 'Brawler') && frontIdx \u003c 4) newBoard[frontIdx++] = u;\n        else if ((u.badge === 'Marksman' || u.badge === 'Arcanist') && backIdx \u003c 12) newBoard[backIdx++] = u;\n        else if (midIdx \u003c 8) newBoard[midIdx++] = u;\n        else if (frontIdx \u003c 4) newBoard[frontIdx++] = u;\n        else if (backIdx \u003c 12) newBoard[backIdx++] = u;\n      });\n\n      aiPlayer.board = newBoard;\n      aiPlayer.bench = Array(8).fill(null);\n      benched.forEach((u, i) =\u003e aiPlayer.bench[i] = u);\n    }\n\n    // =========================================================================\n    // MERGED 24-TILE BATTLE ENGINE WITH MELEE MOVEMENT RANGE & FLOATING TEXT\n    // =========================================================================\n\n    let combatInterval = null;\n\n    function mergeBoardsTo24Tiles(leftBoard12, rightBoard12, side, leftOwner, rightOwner) {\n      const combinedSyn = calculateSynergies([leftBoard12, rightBoard12]);\n      const grid24 = Array(24).fill(null);\n      const units = [];\n\n      const terraCount = combinedSyn.elemCounts.Tanah;\n      const shieldPct = terraCount \u003e= 10 ? 1.50 : (terraCount \u003e= 6 ? 0.50 : (terraCount \u003e= 4 ? 0.30 : (terraCount \u003e= 2 ? 0.15 : 0)));\n      const aeroCount = combinedSyn.elemCounts.Angin;\n      const spdBonus = aeroCount \u003e= 10 ? 3.00 : (aeroCount \u003e= 6 ? 0.80 : (aeroCount \u003e= 4 ? 0.45 : (aeroCount \u003e= 2 ? 0.20 : 0)));\n      const dodgeChance = aeroCount \u003e= 10 ? 0.60 : (aeroCount \u003e= 6 ? 0.30 : (aeroCount \u003e= 4 ? 0.20 : (aeroCount \u003e= 2 ? 0.10 : 0)));\n      const stalkerCount = combinedSyn.badgeCounts.Stalker;\n      const critChance = stalkerCount \u003e= 4 ? 0.55 : (stalkerCount \u003e= 2 ? 0.25 : 0.05);\n      const critMult = stalkerCount \u003e= 4 ? 1.95 : (stalkerCount \u003e= 2 ? 1.40 : 1.25);\n      const arcanistCount = combinedSyn.badgeCounts.Arcanist;\n      const spellMult = arcanistCount \u003e= 4 ? 1.80 : (arcanistCount \u003e= 2 ? 1.35 : 1.0);\n      const brawlerHp = combinedSyn.badgeCounts.Brawler \u003e= 4 ? 1000 : (combinedSyn.badgeCounts.Brawler \u003e= 2 ? 450 : 0);\n      const cahayaCount = combinedSyn.elemCounts.Cahaya;\n      const revivesLeft = cahayaCount \u003e= 10 ? 2 : (cahayaCount \u003e= 2 ? 1 : 0);\n\n      const mapCard = (card, row, col, ownerName) =\u003e {\n        if (!card) return;\n        const gridIdx = row * 8 + col;\n        const extraHp = card.badge === 'Brawler' ? brawlerHp : 0;\n        const totalMaxHp = card.maxHp + extraHp;\n        const unit = {\n          ...card,\n          uid: 'u_' + side + '_' + gridIdx,\n          x: col,\n          y: side === 'ally' ? 3 + row : 2 - row,\n          side,\n          ownerName,\n          gridIdx,\n          row,\n          col,\n          hp: totalMaxHp,\n          maxHp: totalMaxHp,\n          shield: Math.round(totalMaxHp * shieldPct),\n          mana: (card.badge === 'Arcanist' || combinedSyn.elemCounts.Air \u003e= 10) ? card.maxMana : 0,\n          speed: card.speed * (1 + spdBonus),\n          dodgeChance,\n          critChance,\n          critMult,\n          spellMult,\n          revivesLeft,\n          stunTicks: 0,\n          burnTicks: 0,\n          burnDmgPerTick: 0,\n          floatingTexts: [] // For damage & heal popups\n        };\n        grid24[gridIdx] = unit;\n        units.push(unit);\n      };\n\n      for (let r = 0; r \u003c 3; r++) {\n        for (let c = 0; c \u003c 4; c++) {\n          mapCard(leftBoard12[r * 4 + c], r, c, leftOwner);\n        }\n      }\n      for (let r = 0; r \u003c 3; r++) {\n        for (let c = 0; c \u003c 4; c++) {\n          mapCard(rightBoard12[r * 4 + c], r, c + 4, rightOwner);\n        }\n      }\n\n      return { grid24, units, combinedSyn };\n    }\n\n    function startCombatPhase() {\n      if (gameState.phase !== 'PREP') return;\n      stopPrepTimer();\n      gameState.phase = 'COMBAT';\n      gameState.selectedCard = null;\n      gameState.viewTarget = 'p1';\n\n      Object.values(gameState.players).forEach(p =\u003e {\n        p.board.forEach(c =\u003e { if (c) c.justMerged = false; });\n      });\n\n      const aliveTeams = Object.values(gameState.teams).filter(t =\u003e !t.eliminated && t.id !== 'team_cyan');\n      const oppTeam = aliveTeams[Math.floor(Math.random() * aliveTeams.length)];\n      const opp1 = gameState.players[oppTeam.members[0]];\n      const opp2 = gameState.players[oppTeam.members[1]];\n\n      const p1 = gameState.players.p1;\n      const p2 = gameState.players.p2;\n\n      const allyMerged = mergeBoardsTo24Tiles(p1.board, p2.board, 'ally', p1.name, p2.name);\n      const enemyMerged = mergeBoardsTo24Tiles(opp1.board, opp2.board, 'enemy', opp1.name, opp2.name);\n\n      const sharedGrid = Array(48).fill(null);\n      [...allyMerged.units, ...enemyMerged.units].forEach(u =\u003e { sharedGrid[u.y * 8 + u.x] = u; });\n\n      gameState.combatState = {\n        grid: sharedGrid,\n        allyUnits: allyMerged.units,\n        enemyUnits: enemyMerged.units,\n        allySynergies: allyMerged.combinedSyn,\n        enemySynergies: enemyMerged.combinedSyn,\n        enemyTeamId: oppTeam.id,\n        opp1Name: opp1.name,\n        opp2Name: opp2.name,\n        turnCount: 0\n      };\n\n      const mythic10 = allyMerged.combinedSyn.activeList.find(s =\u003e s.type === 'element' && s.count \u003e= 10);\n      const banner = document.getElementById('awakening-banner');\n      if (mythic10) {\n        banner.textContent = `🌟 MYTHIC 10 ${mythic10.name.toUpperCase()} AWAKENING AKTIF DI 24 PETAK! 🌟`;\n        banner.classList.remove('hidden');\n      } else {\n        banner.classList.add('hidden');\n      }\n\n      addLog(`⚔️ 24 Petak Bersatu! Perang melawan ${oppTeam.name}!`, 'text-amber-400');\n      renderAll();\n\n      combatInterval = setInterval(stepUnifiedCombat, 650);\n    }\n\n    function stepUnifiedCombat() {\n      const cs = gameState.combatState;\n      cs.turnCount++;\n\n      const aliveAllies = cs.allyUnits.filter(u =\u003e u.hp \u003e 0);\n      const aliveEnemies = cs.enemyUnits.filter(u =\u003e u.hp \u003e 0);\n\n      if (aliveAllies.length === 0 || aliveEnemies.length === 0 || cs.turnCount \u003e 70) {\n        clearInterval(combatInterval);\n        finishUnifiedCombatRound();\n        return;\n      }\n\n      // Satu putaran: SEMUA unit bergiliran beraksi (urut speed), lalu papan digambar sekali.\n      cs.attacks = [];\n      const order = [...aliveAllies, ...aliveEnemies].sort((a, b) =\u003e b.speed - a.speed);\n      order.forEach(actor =\u003e {\n        if (actor.hp \u003c= 0) return;\n        actor.energy = (actor.energy || 0) + actor.speed;\n        let acts = 0;\n        while (actor.energy \u003e= 1 && acts \u003c 4 && actor.hp \u003e 0) {\n          actor.energy -= 1;\n          acts++;\n          unitAct(actor, cs);\n        }\n      });\n      renderCombatBoard();\n    }\n\n    function unitAct(actor, cs) {\n      const allies = (actor.side === 'ally' ? cs.allyUnits : cs.enemyUnits).filter(u =\u003e u.hp \u003e 0);\n      const enemies = (actor.side === 'ally' ? cs.enemyUnits : cs.allyUnits).filter(u =\u003e u.hp \u003e 0);\n      if (enemies.length === 0) return;\n\n      if (actor.burnTicks \u003e 0) {\n        actor.hp = Math.max(0, actor.hp - actor.burnDmgPerTick);\n        addFloatingText(actor, `-${actor.burnDmgPerTick}`, 'rose');\n        actor.burnTicks--;\n        if (actor.hp === 0) handleDeathOrRevive(actor);\n                return;\n      }\n\n      if (actor.stunTicks \u003e 0) {\n        actor.stunTicks--;\n                return;\n      }\n\n      // Papan 6x8 bersatu: unit boleh melangkah ke petak kosong mana pun, termasuk wilayah lawan.\n      const unitDist = (a, b) =\u003e Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));\n      const isMelee = actor.badge === 'Vanguard' || actor.badge === 'Brawler' || actor.badge === 'Stalker';\n      const target = enemies.reduce((prev, curr) =\u003e unitDist(actor, curr) \u003c unitDist(actor, prev) ? curr : prev);\n\n      if (isMelee && unitDist(actor, target) \u003e 1) {\n        const grid = cs.grid;\n        const curDist = unitDist(actor, target);\n        const curMan = Math.abs(actor.x - target.x) + Math.abs(actor.y - target.y);\n        let best = null, bestScore = null;\n        for (let dy = -1; dy \u003c= 1; dy++) {\n          for (let dx = -1; dx \u003c= 1; dx++) {\n            if (!dx && !dy) continue;\n            const nx = actor.x + dx, ny = actor.y + dy;\n            if (nx \u003c 0 || nx \u003e 7 || ny \u003c 0 || ny \u003e 5) continue;\n            const occ = grid[ny * 8 + nx];\n            if (occ && occ.hp \u003e 0) continue;\n            const nd = Math.max(Math.abs(nx - target.x), Math.abs(ny - target.y));\n            const nm = Math.abs(nx - target.x) + Math.abs(ny - target.y);\n            const score = nd * 100 + nm;\n            if (nd \u003e curDist || (nd === curDist && nm \u003e= curMan)) continue;\n            if (best === null || score \u003c bestScore) { best = [nx, ny]; bestScore = score; }\n          }\n        }\n        if (best) {\n          grid[actor.y * 8 + actor.x] = null;\n          actor.x = best[0]; actor.y = best[1];\n          grid[actor.y * 8 + actor.x] = actor;\n          addFloatingText(actor, 'Maju', 'amber');\n        }\n        // Belum dalam jangkauan pukul: tidak boleh menyerang dari jauh\n                return;\n      }\n\n      const atkColor = actor.side === 'enemy' ? '#ef4444' : (actor.ownerName === 'Kamu' ? '#38bdf8' : '#22c55e');\n      const atkEntry = { a: actor.uid, t: target.uid, color: atkColor, skill: false };\n      cs.attacks.push(atkEntry);\n\n      if (Math.random() \u003c (target.dodgeChance || 0)) {\n        addFloatingText(target, 'Dodge', 'sky');\n                return;\n      }\n\n      let dmg = actor.atk;\n      if (Math.random() \u003c actor.critChance) dmg = Math.round(dmg * actor.critMult);\n\n      applyDamageToUnit(actor, target, dmg);\n\n      const sideSyn = actor.side === 'ally' ? cs.allySynergies : cs.enemySynergies;\n      const airBonusMana = (actor.side === 'ally' && sideSyn.elemCounts.Air \u003e= 2) ? 15 : 0;\n      actor.mana = Mat      renderSigilInventory();\n      renderBench();\n      renderShop();\n      renderInspector();\n    }\n\n    function renderScoreboard() {\n      const container = document.getElementById('teams-scoreboard');\n      const colorMap = {\n        cyan: 'border-cyan-500/40 bg-cyan-950/20 text-cyan-300',\n        rose: 'border-rose-500/40 bg-rose-950/20 text-rose-300',\n        emerald: 'border-emerald-500/40 bg-emerald-950/20 text-emerald-300',\n        purple: 'border-purple-500/40 bg-purple-950/20 text-purple-300'\n      };\n      const barMap = { cyan: 'bg-cyan-400', rose: 'bg-rose-500', emerald: 'bg-emerald-500', purple: 'bg-purple-500' };\n\n      container.innerHTML = Object.values(gameState.teams).map(team =\u003e `\n        \u003cdiv class=\"rounded-xl border px-2.5 py-1.5 ${colorMap[team.color]} ${team.eliminated ? 'opacity-40 grayscale' : ''}\"\u003e\n          \u003cdiv class=\"flex items-center justify-between text-[11px] font-bold mb-1\"\u003e\n            \u003cspan class=\"truncate\"\u003e${team.name}\u003c/span\u003e\n            \u003cspan\u003e${team.eliminated ? '💀' : `❤️${team.hp}`}\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"w-full h-1 bg-slate-900 rounded-full overflow-hidden\"\u003e\n            \u003cdiv class=\"h-full ${barMap[team.color]} transition-all\" style=\"width: ${team.hp}%\"\u003e\u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      `).join('');\n    }\n\n    function renderTopControls() {\n      const p1 = gameState.players.p1;\n      document.getElementById('round-badge').textContent = `Ronde ${gameState.round}`;\n      const phaseBadge = document.getElementById('phase-badge');\n      if (gameState.phase === 'PREP') {\n        phaseBadge.textContent = 'Fase Persiapan';\n        phaseBadge.className = 'bg-emerald-950/80 text-emerald-400 border border-emerald-700/40 px-2 py-0.5 rounded-md font-semibold';\n      } else {\n        phaseBadge.textContent = '⚔️ Pertempuran 2v2';\n        phaseBadge.className = 'bg-rose-950/80 text-rose-400 border border-rose-700/40 px-2 py-0.5 rounded-md font-semibold animate-pulse';\n      }\n\n      document.getElementById('player-gold').textContent = p1.gold;\n      document.getElementById('player-level').textContent = p1.level;\n      const fsc = document.getElementById('free-sigil-count');\n      if (fsc) fsc.textContent = p1.freeSigilClaims || 0;\n      document.getElementById('player-cap').textContent = LEVEL_ODDS[p1.level].cap;\n      document.getElementById('lvl-up-cost').textContent = p1.level \u003e= 6 ? '(MAX)' : `(${LEVEL_ODDS[p1.level].cost}G)`;\n    }\n\n    function renderSynergyPanel() {\n      const p1 = gameState.players.p1;\n      const p2 = gameState.players.p2;\n      const { activeList } = gameState.phase === 'COMBAT'\n        ? gameState.combatState.allySynergies\n        : calculateSynergies([p1.board, p2.board]);\n\n      const viewed = gameState.players[gameState.viewTarget];\n      const count = viewed.board.filter(Boolean).length;\n      document.getElementById('board-cap-badge').textContent = `${count} / ${LEVEL_ODDS[viewed.level].cap} Unit`;\n\n      const listEl = document.getElementById('synergy-list');\n      if (activeList.length === 0) {\n        listEl.innerHTML = `\u003cp class=\"text-xs text-slate-500 italic py-4 text-center\"\u003eTaruh kartu ke 12 petak untuk mengaktifkan sinergi tim.\u003c/p\u003e`;\n        return;\n      }\n\n      listEl.innerHTML = activeList.map(syn =\u003e {\n        const isMythic10 = syn.type === 'element' && syn.count \u003e= 10;\n        const maxGoal = syn.type === 'element' ? 10 : 4;\n        const open = !!openSyn['ally:' + syn.type + ':' + syn.key];\n        return `\n          \u003cdiv onclick=\"toggleSynDetail('ally:${syn.type}:${syn.key}')\" class=\"cursor-pointer rounded-xl border ${isMythic10 ? 'border-amber-400 bg-amber-950/40 mythic-10-badge' : 'border-slate-800/80 hover:border-slate-600 bg-slate-900/40'} p-2\"\u003e\n            \u003cdiv class=\"flex items-center justify-between text-xs\"\u003e\n              \u003cdiv class=\"flex items-center gap-1.5 font-semibold ${syn.color}\"\u003e\n                \u003cspan\u003e${syn.icon}\u003c/span\u003e\n                \u003cspan\u003e${syn.name}\u003c/span\u003e\n                ${isMythic10 ? '\u003cspan class=\"text-[9px] bg-amber-400 text-slate-950 px-1 rounded font-extrabold\"\u003eMYTHIC 10\u003c/span\u003e' : ''}\n              \u003c/div\u003e\n              \u003cspan class=\"font-bold text-white bg-slate-950 px-1.5 py-0.5 rounded\"\u003e${syn.count}/${maxGoal} ${open ? '▲' : '▼'}\u003c/span\u003e\n            \u003c/div\u003e\n            ${open ? synDetailHTML(syn) : ''}\n          \u003c/div\u003e\n        `;\n      }).join('');\n    }\n\n    // ===== Deskripsi sinergi (klik untuk buka/tutup) =====\n    let openSyn = {};\n    function synDetailHTML(syn) {\n      const levels = syn.thresholds.map(t =\u003e `\u003cspan class=\"px-1.5 py-0.5 rounded ${syn.count \u003e= t ? 'bg-amber-400 text-slate-950 font-extrabold' : 'bg-slate-800 text-slate-400'}\"\u003e${t}\u003c/span\u003e`).join(' ');\n      return `\u003cdiv class=\"mt-1.5 pt-1.5 border-t border-slate-700/60 text-[10px] text-slate-300 text-left space-y-1\"\u003e\n        \u003cdiv\u003e${syn.desc}\u003c/div\u003e\n        \u003cdiv class=\"flex items-center gap-1 flex-wrap\"\u003e\u003cspan class=\"text-slate-500\"\u003eTingkat:\u003c/span\u003e ${levels}\u003c/div\u003e\n      \u003c/div\u003e`;\n    }\n    function toggleSynDetail(key) {\n      openSyn[key] = !openSyn[key];\n      renderSynergyPanel();\n      if (gameState.phase === 'COMBAT') renderEnemySynergyMini();\n    }\n    function renderEnemySynergyMini() {\n      const cs = gameState.combatState;\n      const el = document.getElementById('enemy-synergy-mini');\n      if (!cs || !cs.enemySynergies || !el) return;\n      const list = cs.enemySynergies.activeList;\n      if (list.length === 0) { el.innerHTML = 'Musuh tanpa sinergi'; return; }\n      const chips = list.map(syn =\u003e {\n        const open = !!openSyn['enemy:' + syn.type + ':' + syn.key];\n        return `\u003cbutton onclick=\"toggleSynDetail('enemy:${syn.type}:${syn.key}')\" class=\"px-1.5 py-0.5 rounded-lg border ${open ? 'border-rose-400 bg-rose-950/60' : 'border-rose-900/70 bg-slate-900/70 hover:border-rose-500'} ${syn.color} text-[10px] font-semibold\"\u003e${syn.icon} ${syn.name} ${syn.count}\u003c/button\u003e`;\n      }).join('');\n      const details = list.filter(syn =\u003e openSyn['enemy:' + syn.type + ':' + syn.key]).map(syn =\u003e\n        `\u003cdiv class=\"mt-1 rounded-lg border border-rose-900/60 bg-slate-950/70 p-1.5\"\u003e\u003cdiv class=\"font-bold ${syn.color} text-[10px]\"\u003e${syn.icon} ${syn.name} (${syn.count})\u003c/div\u003e${synDetailHTML(syn)}\u003c/div\u003e`).join('');\n      el.innerHTML = `\u003cdiv class=\"flex flex-wrap justify-end gap-1\"\u003e${chips}\u003c/div\u003e${details}`;\n    }\n\n    function renderPartnerPanel() {\n      const p2 = gameState.players.p2;\n      document.getElementById('partner-lvl-badge').textContent = `Lv. ${p2.level}`;\n      const { activeList } = calculateSynergies(p2.board);\n      const topSyn = activeList.slice(0, 2).map(s =\u003e `${s.icon}${s.name}(${s.count})`).join(', ');\n      document.getElementById('partner-synergy-summary').textContent = topSyn ? `Sinergi AI Aria: ${topSyn}` : 'AI Aria menyusun kartu...';\n\n      const btnMy = document.getElementById('btn-view-my-board');\n      const btnPartner = document.getElementById('btn-view-partner-board');\n      if (gameState.viewTarget === 'p1') {\n        btnMy.className = 'py-2 px-2 rounded-xl text-xs font-bold bg-cyan-600 text-white shadow transition';\n        btnPartner.className = 'py-2 px-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition';\n        document.getElementById('current-view-label').textContent = 'Papan 12 Petak Kamu';\n      } else {\n        btnPartner.className = 'py-2 px-2 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow transition';\n        btnMy.className = 'py-2 px-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition';\n        document.getElementById('current-view-label').textContent = '👁️ Papan 12 Petak AI Aria';\n      }\n    }\n\n    function renderCardHTML(card, options = {}) {\n      const { isCombat = false, compact = false } = options;\n      const el = ELEMENTS[card.element];\n      const bg = BADGES[card.badge];\n      const stars = '★'.repeat(card.star);\n      const extraIcons = (card.extraElements || []).map(e =\u003e ELEMENTS[e]?.icon || '').join('');\n      const owner = options.owner || (card.side === 'enemy' ? 'enemy' : (card.ownerName && card.ownerName !== 'Kamu' ? 'partner' : 'me'));\n\n      const hpPct = isCombat ? Math.max(0, Math.round((card.hp / card.maxHp) * 100)) : 100;\n      const manaPct = isCombat ? Math.min(100, Math.round((card.mana / card.maxMana) * 100)) : 0;\n\n      const floatingHtml = (card.floatingTexts || []).map(ft =\u003e `\n        \u003cdiv class=\"floating-text text-${ft.color === 'rose' ? 'rose-400' : (ft.color === 'emerald' ? 'emerald-400' : (ft.color === 'sky' ? 'sky-300' : 'amber-300'))}\"\u003e${ft.text}\u003c/div\u003e\n      `).join('');\n\n      return `\n        \u003cdiv data-uid=\"${card.uid}\" class=\"game-card owner-${owner} relative w-full h-full rounded-xl border tier-${card.tier} bg-slate-900/95 p-1 flex flex-col justify-between shadow-sm ${card.justMerged ? 'anim-merge' : ''}\"\u003e\n          ${floatingHtml}\n          \u003cdiv class=\"flex items-center justify-between text-[9px] leading-none\"\u003e\n            \u003cspan\u003e${el.icon}${extraIcons}\u003c/span\u003e\n            \u003cspan class=\"font-extrabold text-amber-300\"\u003e${stars}\u003c/span\u003e\n            \u003cspan\u003e${bg.icon}\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"text-center my-0.5\"\u003e\n            \u003cdiv class=\"${compact ? 'text-sm' : 'text-base'} leading-none mb-0.5\"\u003e${card.avatar}\u003c/div\u003e\n            \u003cdiv class=\"text-[9px] font-bold text-white truncate\"\u003e\u003cspan class=\"tier-dot-${card.tier}\"\u003eT${card.tier}\u003c/span\u003e ${card.name}\u003c/div\u003e\n          \u003c/div\u003e\n          ${isCombat ? `\n            \u003cdiv class=\"space-y-0.5\"\u003e\n              \u003cdiv class=\"w-full h-1 bg-slate-950 rounded-full overflow-hidden\"\u003e\n                \u003cdiv class=\"h-full bg-emerald-400\" style=\"width: ${hpPct}%\"\u003e\u003c/div\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"w-full h-1 bg-slate-950 rounded-full overflow-hidden\"\u003e\n                \u003cdiv class=\"h-full bg-sky-400\" style=\"width: ${manaPct}%\"\u003e\u003c/div\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n          ` : `\n            \u003cdiv class=\"flex items-center justify-between text-[8px] text-slate-400 bg-slate-950/60 rounded px-1 py-0.5\"\u003e\n              \u003cspan\u003e❤️${card.maxHp}\u003c/span\u003e\n              \u003cspan\u003e⚔️${card.atk}\u003c/span\u003e\n            \u003c/div\u003e\n          `}\n        \u003c/div\u003e\n      `;\n    }\n\n    function renderPrepBoard() {\n      const viewed = gameState.players[gameState.viewTarget];\n      const isMyBoard = gameState.viewTarget === 'p1';\n      const prepOwner = isMyBoard ? 'me' : (gameState.viewTarget === 'p2' ? 'partner' : 'enemy');\n\n      document.getElementById('center-divider-text').textContent = 'Papan 12 Petak (3x4) • Gabung Jadi 24 Petak (3x8) Saat Perang';\n      document.getElementById('battle-status-banner').textContent = isMyBoard ? 'Susun 12 petak & pasang Sigil' : 'Mengintip 12 petak AI Aria';\n\n      document.getElementById('enemy-board-title').textContent = '⚔️ Wilayah Musuh (12 + 12 = 24 Petak Saat Perang)';\n      document.getElementById('enemy-synergy-mini').textContent = 'Siap Bertarung';\n      document.getElementById('enemy-board-container').innerHTML = `\n        \u003cdiv class=\"grid grid-cols-4 gap-1.5 opacity-60\"\u003e\n          ${Array(4).fill(0).map((_, i) =\u003e `\u003cdiv class=\"board-slot h-11 rounded-xl flex items-center justify-center text-[10px] text-slate-500\"\u003eBaris Depan Musuh ${i + 1}\u003c/div\u003e`).join('')}\n        \u003c/div\u003e\n      `;\n\n      document.getElementById('ally-board-title').textContent = isMyBoard ? '🛡️ Papan 12 Petak Kamu (Depan • Tengah • Belakang)' : '🤖 Papan 12 Petak AI Aria (Rekan Tim)';\n\n      const rowNames = ['Depan (Frontline)', 'Tengah (Midline)', 'Belakang (Backline)'];\n      const allyContainer = document.getElementById('ally-board-container');\n\n      let html = '';\n      for (let r = 0; r \u003c 3; r++) {\n        html += `\u003cdiv class=\"text-[9px] text-slate-400 font-semibold px-1\"\u003e${rowNames[r]}\u003c/div\u003e`;\n        html += `\u003cdiv class=\"grid grid-cols-4 gap-1.5\"\u003e`;\n        for (let c = 0; c \u003c 4; c++) {\n          const idx = r * 4 + c;\n          const card = viewed.board[idx];\n          html += `\n            \u003cdiv ondragover=\"handleDragOver(event)\" ondrop=\"handleDrop(event, 'board', ${idx})\" class=\"board-slot h-20 rounded-xl p-1 flex items-center justify-center ${isMyBoard ? 'valid-target' : ''}\"\u003e\n              ${card ? `\u003cdiv draggable=\"true\" ondragstart=\"handleDragStart(event, 'board', ${idx})\" ${isMyBoard ? `onclick=\"selectOwnCard('board', ${idx})\"` : ''} class=\"w-full h-full ${isMyBoard && gameState.selectedCard && gameState.selectedCard.source === 'board' && gameState.selectedCard.index === idx ? 'ring-2 ring-amber-400 rounded-xl' : ''}\"\u003e${renderCardHTML(card, { owner: prepOwner })}\u003c/div\u003e` : `\u003cspan class=\"text-[10px] text-slate-600\"\u003e${idx + 1}\u003c/span\u003e`}\n            \u003c/div\u003e\n          `;\n        }\n        html += `\u003c/div\u003e`;\n      }\n      allyContainer.innerHTML = html;\n\n      const count = viewed.board.filter(Boolean).length;\n      document.getElementById('ally-count-badge').textContent = `${count}/${LEVEL_ODDS[viewed.level].cap} Unit Aktif`;\n    }\n\n    function renderCombatBoard() {\n      const cs = gameState.combatState;\n      document.getElementById('center-divider-text').textContent = '⚔️ MEDAN TEMPUR 24 PETAK (3 BARIS x 8 KOLOM) BERSATU';\n      document.getElementById('battle-status-banner').textContent = `24 Petak Tim vs 24 Petak Musuh!`;\n\n      document.getElementById('enemy-board-title').textContent = `⚔️ 24 Petak Musuh (${cs.opp1Name} + ${cs.opp2Name})`;\n      document.getElementById('ally-board-title').textContent = `🛡️ 24 Petak Tim (Kamu + AI Aria)`;\n\n      let enemyHTML = '';\n      for (let r = 0; r \u003c 3; r++) {\n        enemyHTML += `\u003cdiv class=\"grid grid-cols-8 gap-1\"\u003e`;\n        for (let c = 0; c \u003c 8; c++) {\n          const u = cs.grid[r * 8 + c];\n          const dividerBorder = c === 3 ? 'border-r-2 border-r-rose-500/40' : '';\n          enemyHTML += `\n            \u003cdiv class=\"board-slot ${dividerBorder} h-16 rounded-lg p-0.5 flex items-center justify-center\"\u003e\n              ${u && u.hp \u003e 0 ? renderCardHTML(u, { isCombat: true, compact: true }) : ''}\n            \u003c/div\u003e\n          `;\n        }\n        enemyHTML += `\u003c/div\u003e`;\n      }\n      document.getElementById('enemy-board-container').innerHTML = enemyHTML;\n\n      let allyHTML = '';\n      for (let r = 0; r \u003c 3; r++) {\n        allyHTML += `\u003cdiv class=\"grid grid-cols-8 gap-1\"\u003e`;\n        for (let c = 0; c \u003c 8; c++) {\n          const u = cs.grid[(r + 3) * 8 + c];\n          const dividerBorder = c === 3 ? 'border-r-2 border-r-cyan-400/50' : '';\n          allyHTML += `\n            \u003cdiv class=\"board-slot ${dividerBorder} h-16 rounded-lg p-0.5 flex items-center justify-center\"\u003e\n              ${u && u.hp \u003e 0 ? renderCardHTML(u, { isCombat: true, compact: true }) : ''}\n            \u003c/div\u003e\n          `;\n        }\n        allyHTML += `\u003c/div\u003e`;\n      }\n      document.getElementById('ally-board-container').innerHTML = allyHTML;\n\n      (cs.attacks || []).forEach(at =\u003e drawAttackLine(at));\n      cs.attacks = [];\n      if (!cs.enemySynRendered) { renderEnemySynergyMini(); cs.enemySynRendered = true; }\n    }\n\n    function drawAttackLine(at) {\n      const layer = document.getElementById('attack-layer');\n      const ea = document.querySelector(`[data-uid=\"${at.a}\"]`);\n      const et = document.querySelector(`[data-uid=\"${at.t}\"]`);\n      if (!layer || !ea || !et) return;\n      const ra = ea.getBoundingClientRect(), rt = et.getBoundingClientRect();\n      const ns = 'http://www.w3.org/2000/svg';\n      const x1 = ra.left + ra.width / 2, y1 = ra.top + ra.height / 2;\n      const x2 = rt.left + rt.width / 2, y2 = rt.top + rt.height / 2;\n      const color = at.skill ? '#e879f9' : at.color;\n      const line = document.createElementNS(ns, 'line');\n      line.setAttribute('x1', x1); line.setAttribute('y1', y1);\n      line.setAttribute('x2', x2); line.setAttribute('y2', y2);\n      line.setAttribute('class', 'atk-line');\n      line.style.stroke = color;\n      line.style.strokeWidth = at.skill ? 4.5 : 2.5;\n      if (at.skill) line.style.strokeDasharray = '6 3';\n      const dot = document.createElementNS(ns, 'circle');\n      dot.setAttribute('cx', x2); dot.setAttribute('cy', y2); dot.setAttribute('r', at.skill ? 6 : 4);\n      dot.setAttribute('class', 'atk-line');\n      dot.style.fill = color; dot.style.stroke = 'none';\n      layer.appendChild(line); layer.appendChild(dot);\n      setTimeout(() =\u003e { line.remove(); dot.remove(); }, 600);\n    }\n\n    // ===== Galeri Roster =====\n    function synCounts(heroes) {\n      const el = {}, bg = {};\n      heroes.forEach(h =\u003e { el[h.element] = (el[h.element] || 0) + 1; bg[h.badge] = (bg[h.badge] || 0) + 1; });\n      return { el, bg };\n    }\n    function openRosterGallery() {\n      const body = document.getElementById('roster-body');\n      const src = rosterSource(), heroesAll = src.heroes, sc = synCounts(heroesAll);\n      let html = `\u003cdiv class=\"text-xs text-amber-300 bg-amber-950/30 border border-amber-500/30 rounded-xl p-2\"\u003e${src.note}\u003c/div\u003e`;\n      for (let t = 1; t \u003c= 5; t++) {\n        const heroes = heroesAll.filter(h =\u003e h.tier === t);\n        if (!heroes.length) continue;\n        html += `\u003cdiv\u003e\u003ch3 class=\"font-display font-bold text-sm mb-2 tier-dot-${t}\"\u003eTier ${t} (${heroes.length} hero)\u003c/h3\u003e\u003cdiv class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2\"\u003e`;\n        heroes.forEach(h =\u003e {\n          const el = ELEMENTS[h.element], bg = BADGES[h.badge];\n          html += `\u003cdiv class=\"rounded-xl border tier-${t} bg-slate-900/90 p-2.5 text-xs space-y-1\"\u003e\n            \u003cdiv class=\"flex items-center gap-2\"\u003e\u003cspan class=\"text-2xl\"\u003e${h.avatar}\u003c/span\u003e\n              \u003cdiv\u003e\u003cdiv class=\"font-bold text-white\"\u003e${h.name}${src.counts ? ` \u003cspan class=\"text-amber-300\"\u003e×${src.counts[h.id] || 1}\u003c/span\u003e` : ''}\u003c/div\u003e\n              \u003cdiv class=\"text-[10px] ${el.color}\"\u003e${el.icon} ${el.name} • ${bg.icon} ${bg.name} • ${h.pos === 'front' ? 'Depan' : 'Belakang'}\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n            \u003cdiv class=\"text-[10px] text-slate-400\"\u003e❤️ ${h.hp} &nbsp; ⚔️ ${h.atk} &nbsp; ⚡ ${h.speed} &nbsp; 🔷 Mana ${h.maxMana}\u003c/div\u003e\n            \u003cdiv class=\"text-[11px] text-amber-300 font-semibold\"\u003e${h.skillName}\u003c/div\u003e\n            \u003cdiv class=\"text-[10px] text-slate-300\"\u003e${h.skillDesc}\u003c/div\u003e\u003c/div\u003e`;\n        });\n        html += `\u003c/div\u003e\u003c/div\u003e`;\n      }\n      html += `\u003cdiv\u003e\u003ch3 class=\"font-display font-bold text-sm mb-2 text-amber-400\"\u003eSinergi Elemen\u003c/h3\u003e\u003cdiv class=\"grid grid-cols-1 sm:grid-cols-2 gap-2\"\u003e` +\n        Object.values(ELEMENTS).map(e =\u003e `\u003cdiv class=\"rounded-xl border ${e.border} ${e.bg} p-2.5 text-[11px]\"\u003e\u003cdiv class=\"font-bold ${e.color}\"\u003e${e.icon} ${e.name} \u003cspan class=\"text-slate-400 font-normal\"\u003e(${e.thresholds.join(' / ')})\u003c/span\u003e \u003cspan class=\"text-amber-300 font-normal\"\u003e• ${sc.el[e.name] || 0} kartu\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"text-slate-300\"\u003e${e.desc}\u003c/div\u003e\u003c/div\u003e`).join('') +\n        `\u003c/div\u003e\u003c/div\u003e\u003cdiv\u003e\u003ch3 class=\"font-display font-bold text-sm mb-2 text-sky-300\"\u003eSinergi Badge\u003c/h3\u003e\u003cdiv class=\"grid grid-cols-1 sm:grid-cols-2 gap-2\"\u003e` +\n        Object.values(BADGES).map(b =\u003e `\u003cdiv class=\"rounded-xl border border-slate-700 bg-slate-900/80 p-2.5 text-[11px]\"\u003e\u003cdiv class=\"font-bold ${b.color}\"\u003e${b.icon} ${b.name} \u003cspan class=\"text-slate-400 font-normal\"\u003e(${b.thresholds.join(' / ')})\u003c/span\u003e \u003cspan class=\"text-amber-300 font-normal\"\u003e• ${sc.bg[b.name] || 0} kartu\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"text-slate-300\"\u003e${b.desc}\u003c/div\u003e\u003c/div\u003e`).join('') +\n        `\u003c/div\u003e\u003c/div\u003e`;\n      body.innerHTML = html;\n      const m = document.getElementById('roster-modal');\n      m.classList.remove('hidden'); m.classList.add('flex');\n    }\n    function closeRosterGallery() {\n      const m = document.getElementById('roster-modal');\n      m.classList.add('hidden'); m.classList.remove('flex');\n    }\n\n    function renderSigilInventory() {\n      const p1 = gameState.players.p1;\n      const container = document.getElementById('sigil-inventory');\n      if (p1.sigils.length === 0) {\n        container.innerHTML = `\u003cspan class=\"text-[11px] text-slate-500 italic\"\u003eKosong (Beli di toko atau klaim gratis)\u003c/span\u003e`;\n        return;\n      }\n      container.innerHTML = p1.sigils.map((elKey, idx) =\u003e {\n        const el = ELEMENTS[elKey];\n        return `\n          \u003cdiv draggable=\"true\" ondragstart=\"handleDragStart(event, 'sigil', ${idx})\" class=\"px-2.5 py-1 rounded-lg border ${el.border} ${el.bg} text-xs font-bold ${el.color} flex items-center gap-1 cursor-grab active:cursor-grabbing\"\u003e\n            \u003cspan\u003e${el.icon}\u003c/span\u003e\n            \u003cspan\u003eSigil ${el.name}\u003c/span\u003e\n          \u003c/div\u003e\n        `;\n      }).join('');\n    }\n\n    function renderBench() {\n      const p1 = gameState.players.p1;\n      document.getElementById('bench-count').textContent = `(${p1.bench.filter(Boolean).length}/8)`;\n      document.getElementById('player-bench').innerHTML = p1.bench.map((card, idx) =\u003e {\n        return `\n          \u003cdiv ondragover=\"handleDragOver(event)\" ondrop=\"handleDrop(event, 'bench', ${idx})\" class=\"board-slot h-20 rounded-xl p-1 flex items-center justify-center\"\u003e\n            ${card ? `\u003cdiv draggable=\"true\" ondragstart=\"handleDragStart(event, 'bench', ${idx})\" onclick=\"selectOwnCard('bench', ${idx})\" class=\"w-full h-full ${gameState.selectedCard && gameState.selectedCard.source === 'bench' && gameState.selectedCard.index === idx ? 'ring-2 ring-amber-400 rounded-xl' : ''}\"\u003e${renderCardHTML(card)}\u003c/div\u003e` : `\u003cspan class=\"text-[10px] text-slate-600\"\u003e${idx + 1}\u003c/span\u003e`}\n          \u003c/div\u003e\n        `;\n      }).join('');\n    }\n\n    function renderShop() {\n      const p1 = gameState.players.p1;\n      document.getElementById('shop-cards').innerHTML = p1.shop.map((item, idx) =\u003e {\n        if (!item) return `\u003cdiv class=\"h-12 rounded-xl bg-slate-900/40 flex items-center justify-center text-xs text-slate-600\"\u003eTerbeli\u003c/div\u003e`;\n        if (item.isSigil) {\n          const el = ELEMENTS[item.element];\n          return `\n            \u003cbutton onclick=\"buyCardFromShop(${idx})\" class=\"w-full text-left rounded-xl border border-amber-500/40 bg-amber-950/20 hover:bg-amber-900/30 p-2 flex items-center justify-between transition\"\u003e\n              \u003cdiv class=\"flex items-center gap-2\"\u003e\n                \u003cspan class=\"text-xl\"\u003e${item.avatar}\u003c/span\u003e\n                \u003cdiv\u003e\n                  \u003cdiv class=\"text-xs font-bold text-amber-300\"\u003e🔮 ${item.name}\u003c/div\u003e\n                  \u003cdiv class=\"text-[10px] text-slate-300\"\u003eTambah +1 ${el.name}\u003c/div\u003e\n                \u003c/div\u003e\n              \u003c/div\u003e\n              \u003cspan class=\"text-xs font-bold text-amber-400\"\u003e${item.tier} 🪙\u003c/span\u003e\n            \u003c/button\u003e\n          `;\n        }\n        const el = ELEMENTS[item.element];\n        const bg = BADGES[item.badge];\n        return `\n          \u003cbutton onclick=\"buyCardFromShop(${idx})\" class=\"w-full text-left rounded-xl border border-slate-800 bg-slate-900 hover:bg-slate-800 p-2 flex items-center justify-between transition\"\u003e\n            \u003cdiv class=\"flex items-center gap-2\"\u003e\n              \u003cspan class=\"text-xl\"\u003e${item.avatar}\u003c/span\u003e\n              \u003cdiv\u003e\n                \u003cdiv class=\"text-xs font-bold text-white\"\u003e${item.name}\u003c/div\u003e\n                \u003cdiv class=\"text-[10px] text-slate-400\"\u003e${el.icon} ${el.name} • ${bg.icon} ${bg.name}\u003c/div\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cspan class=\"text-xs font-bold text-amber-400\"\u003e${item.tier} 🪙\u003c/span\u003e\n          \u003c/button\u003e\n        `;\n      }).join('');\n    }\n\n    function getSelectedCard() {\n      const sel = gameState.selectedCard;\n      if (!sel) return null;\n      const p1 = gameState.players.p1;\n      return (sel.source === 'board' ? p1.board : p1.bench)[sel.index] || null;\n    }\n    function selectOwnCard(source, index) {\n      if (gameState.phase !== 'PREP') return;\n      const sel = gameState.selectedCard;\n      gameState.selectedCard = (sel && sel.source === source && sel.index === index) ? null : { source, index };\n      renderAll();\n    }\n    function sellSelectedCard(sel) {\n      if (gameState.phase !== 'PREP') return;\n      sel = sel || gameState.selectedCard;\n      if (!sel) return;\n      const p1 = gameState.players.p1;\n      const arr = sel.source === 'board' ? p1.board : p1.bench;\n      const card = arr[sel.index];\n      if (!card) return;\n      const price = card.invested || card.tier;\n      p1.gold += price;\n      (card.extraElements || []).forEach(e =\u003e p1.sigils.push(e));\n      arr[sel.index] = null;\n      gameState.selectedCard = null;\n      showToast(`💰 ${card.name} dijual +${price}G` + ((card.extraElements || []).length ? ' (Sigil dikembalikan)' : ''), 'amber');\n      addLog(`[Jual] ${card.name} terjual seharga ${price}G.`, 'text-amber-300');\n      renderAll();\n    }\n    function giftSelectedCard(sel) {\n      if (gameState.phase !== 'PREP') return;\n      sel = sel || gameState.selectedCard;\n      if (!sel) return;\n      const p1 = gameState.players.p1, p2 = gameState.players.p2;\n      const arr = sel.source === 'board' ? p1.board : p1.bench;\n      const card = arr[sel.index];\n      if (!card) return;\n      if (p1.gold \u003c 1) { showToast('Butuh 1 Gold untuk memberi kartu!', 'rose'); return; }\n      const slot = p2.bench.findIndex(c =\u003e c === null);\n      if (slot === -1) { showToast('Bench rekan penuh!', 'rose'); return; }\n      p1.gold -= 1;\n      p2.bench[slot] = card;\n      arr[sel.index] = null;\n      gameState.selectedCard = null;\n      checkAndMergePlayerCards(p2);\n      showToast(`🎁 ${card.name} diberikan ke rekan (-1G)`, 'emerald');\n      addLog(`[Beri] ${card.name} diberikan ke AI Aria (-1G).`, 'text-emerald-300');\n      renderAll();\n    }\n    function handleDropAction(e, action) {\n      e.preventDefault();\n      if (!draggedItem || draggedItem.source === 'sigil') { draggedItem = null; return; }\n      const sel = { source: draggedItem.source, index: draggedItem.index };\n      draggedItem = null;\n      if (action === 'sell') sellSelectedCard(sel); else giftSelectedCard(sel);\n    }\n    function renderInspector() {\n      const container = document.getElementById('inspector-content');\n      const card = getSelectedCard();\n      const zones = `\n        \u003cdiv class=\"grid grid-cols-2 gap-2 mt-2\"\u003e\n          \u003cdiv ondragover=\"handleDragOver(event)\" ondrop=\"handleDropAction(event,'sell')\" class=\"rounded-xl border border-dashed border-amber-500/50 bg-amber-950/20 p-2 text-center text-[10px] text-amber-300\"\u003e💰 Drop = Jual\u003cbr\u003e(harga beli)\u003c/div\u003e\n          \u003cdiv ondragover=\"handleDragOver(event)\" ondrop=\"handleDropAction(event,'gift')\" class=\"rounded-xl border border-dashed border-emerald-500/50 bg-emerald-950/20 p-2 text-center text-[10px] text-emerald-300\"\u003e🎁 Drop = Beri Rekan\u003cbr\u003e(-1G)\u003c/div\u003e\n        \u003c/div\u003e`;\n      if (!card) {\n        container.innerHTML = `\u003cp class=\"text-xs text-slate-500 py-2 text-center\"\u003eKlik kartu untuk jual / beri rekan, atau drag ke kotak di bawah. Drag Sigil ke Hero untuk memasang.\u003c/p\u003e${zones}`;\n        return;\n      }\n      const el = ELEMENTS[card.element], bg = BADGES[card.badge];\n      const sig = (card.extraElements || []).map(e =\u003e ELEMENTS[e].icon).join('') || '-';\n      container.innerHTML = `\n        \u003cdiv class=\"rounded-xl border border-slate-700 bg-slate-900/80 p-2 text-xs space-y-1\"\u003e\n          \u003cdiv class=\"font-bold text-white\"\u003e${card.avatar} ${card.name} \u003cspan class=\"text-amber-300\"\u003e${'★'.repeat(card.star)}\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"text-[10px] text-slate-400\"\u003e${el.icon} ${el.name} • ${bg.icon} ${bg.name} • Sigil: ${sig}\u003c/div\u003e\n          \u003cdiv class=\"grid grid-cols-2 gap-2 pt-1\"\u003e\n            \u003cbutton onclick=\"sellSelectedCard()\" class=\"py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-[11px]\"\u003e💰 Jual +${card.invested || card.tier}G\u003c/button\u003e\n            \u003cbutton onclick=\"giftSelectedCard()\" class=\"py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[11px]\"\u003e🎁 Beri Rekan -1G\u003c/button\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e${zones}`;\n    }\n\n    function showToast(msg, color = 'amber') {\n      const container = document.getElementById('toast-container');\n      const toast = document.createElement('div');\n      toast.className = `border px-4 py-2 rounded-xl shadow-xl text-xs font-semibold text-center bg-slate-900 border-amber-500 text-amber-300`;\n      toast.textContent = msg;\n      container.appendChild(toast);\n      setTimeout(() =\u003e toast.remove(), 2500);\n    }\n\n    function addLog(text, color = 'text-slate-300') {\n      const logEl = document.getElementById('event-log');\n      const item = document.createElement('div');\n      item.className = color;\n      item.textContent = text;\n      logEl.prepend(item);\n    }\n\n    function toggleSynergyGuide() {\n      const m = document.getElementById('synergy-modal');\n      if (m.classList.contains('hidden')) populateSynergyGuideModal();\n      m.classList.toggle('hidden'); m.classList.toggle('flex');\n    }\n\n    function populateSynergyGuideModal() {\n      const src = rosterSource(), sc = synCounts(src.heroes);\n      document.getElementById('guide-elements').innerHTML = `\u003cdiv class=\"text-[11px] text-amber-300 bg-amber-950/30 border border-amber-500/30 rounded-xl p-2\"\u003e${src.note}\u003c/div\u003e` + Object.values(ELEMENTS).map(el =\u003e `\n        \u003cdiv class=\"rounded-xl border border-slate-800 bg-slate-900/60 p-2.5\"\u003e\n          \u003cdiv class=\"font-bold ${el.color}\"\u003e${el.icon} ${el.name} \u003cspan class=\"text-amber-300 font-normal\"\u003e• ${sc.el[el.name] || 0} kartu\u003c/span\u003e\u003c/div\u003e\n          \u003cp class=\"text-slate-400 mt-0.5\"\u003e${el.desc}\u003c/p\u003e\n        \u003c/div\u003e\n      `).join('');\n      document.getElementById('guide-badges').innerHTML = Object.values(BADGES).map(bg =\u003e `\n        \u003cdiv class=\"rounded-xl border border-slate-800 bg-slate-900/60 p-2.5\"\u003e\n          \u003cdiv class=\"font-bold ${bg.color}\"\u003e${bg.icon} ${bg.name} \u003cspan class=\"text-amber-300 font-normal\"\u003e• ${sc.bg[bg.name] || 0} kartu\u003c/span\u003e\u003c/div\u003e\n          \u003cp class=\"text-slate-400 mt-0.5\"\u003e${bg.desc}\u003c/p\u003e\n        \u003c/div\u003e\n      `).join('');\n    }\n    window.addEventListener('load', refreshMenuState);\n  \u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e"};
